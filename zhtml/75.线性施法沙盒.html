<style>
/* ------------------------------------------------------------------ *
 * Bending Sandbox — UI shell
 * The 3D view owns the whole viewport; everything here floats on top.
 * ------------------------------------------------------------------ */

:root {
  --ui-bg: rgba(10, 14, 20, 0.55);
  --ui-bg-solid: rgba(12, 16, 22, 0.92);
  --ui-border: rgba(255, 255, 255, 0.12);
  --ui-text: rgba(238, 245, 255, 0.92);
  --ui-text-dim: rgba(197, 214, 232, 0.6);
  --ui-accent: #7fd6ff;
  --ui-radius: 14px;
  --ui-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  --ui-font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #05070a;
  color: var(--ui-text);
  font-family: var(--ui-font);
  -webkit-font-smoothing: antialiased;
}

#viewport {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
}

/* ------------------------------------------------------------------ *
 * Loading veil
 * ------------------------------------------------------------------ */

.loader {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  background: radial-gradient(120% 120% at 50% 30%, #16202c 0%, #05070a 70%);
  transition: opacity 0.7s ease, visibility 0.7s;
}

.loader.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loader__inner {
  text-align: center;
  width: min(420px, 80vw);
}

.loader__title {
  margin: 22px 0 18px;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 0.16em;
}

.loader__sigil {
  display: flex;
  justify-content: center;
  gap: 14px;
}

.sigil {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  animation: sigil-pulse 1.8s ease-in-out infinite;
}

.sigil--a {
  background: #1d5f8f;
}
.sigil--b {
  background: #3fb4ff;
  animation-delay: 0.15s;
}
.sigil--c {
  background: #9fe0ff;
  animation-delay: 0.3s;
}
.sigil--d {
  background: #ecfbff;
  animation-delay: 0.45s;
}

@keyframes sigil-pulse {
  0%,
  100% {
    transform: scale(0.7);
    opacity: 0.35;
  }
  50% {
    transform: scale(1.15);
    opacity: 1;
  }
}

.loader__bar {
  height: 3px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.1);
  overflow: hidden;
}

.loader__bar i {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: 3px;
  background: linear-gradient(90deg, #1d5f8f, #3fb4ff, #ecfbff);
  transition: width 0.25s ease;
}

.loader__status {
  margin: 14px 0 0;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ui-text-dim);
}

/* ------------------------------------------------------------------ *
 * HUD
 * ------------------------------------------------------------------ */

.hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 20;
  font-size: 13px;
}

/* ------------------------------------------------------------------ *
 * Ability bar
 * ------------------------------------------------------------------ */

.hud__abilities {
  position: absolute;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  pointer-events: auto;
}

.ability-card {
  position: relative;
  width: 96px;
  padding: 12px 8px 10px;
  border-radius: var(--ui-radius);
  border: 1px solid var(--ui-border);
  background: var(--ui-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--ui-shadow);
  text-align: center;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease,
    box-shadow 0.18s ease;
  user-select: none;
}

.ability-card:hover {
  transform: translateY(-3px);
  background: rgba(20, 28, 38, 0.7);
}

.ability-card.is-active {
  border-color: var(--accent, var(--ui-accent));
  background: rgba(20, 28, 38, 0.82);
  box-shadow: 0 0 0 1px var(--accent, var(--ui-accent)) inset, 0 8px 28px rgba(0, 0, 0, 0.5),
    0 0 26px -6px var(--accent, var(--ui-accent));
}

/* Armed: the slot pulses until the shot is taken or cancelled. */
.hud__abilities.is-armed .ability-card.is-active {
  animation: ability-armed 1.05s ease-in-out infinite;
}

@keyframes ability-armed {
  0%,
  100% {
    box-shadow: 0 0 0 1px var(--accent, var(--ui-accent)) inset, 0 8px 28px rgba(0, 0, 0, 0.5),
      0 0 22px -8px var(--accent, var(--ui-accent));
  }
  50% {
    box-shadow: 0 0 0 2px var(--accent, var(--ui-accent)) inset, 0 8px 28px rgba(0, 0, 0, 0.5),
      0 0 34px -2px var(--accent, var(--ui-accent));
  }
}

/*
 * Cooldown sweep. A conic gradient driven by one custom property, so the frame
 * loop updates it with a single `setProperty` and never triggers layout.
 */
.ability-card__sweep {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: conic-gradient(
    from 0deg,
    rgba(5, 9, 14, 0.8) calc(var(--cooldown, 0) * 360deg),
    transparent 0
  );
  opacity: 0;
  transition: opacity 0.12s linear;
  pointer-events: none;
}

.ability-card.is-cooling .ability-card__sweep {
  opacity: 1;
}

.ability-card.is-cooling .ability-card__glyph,
.ability-card.is-cooling .ability-card__label {
  opacity: 0.45;
}

.ability-card__glyph {
  position: relative;
  color: var(--accent, var(--ui-accent));
}

.ability-card__glyph .glyph-svg {
  display: block;
  width: 34px;
  height: 34px;
  margin: 1px auto 0;
  filter: drop-shadow(0 0 6px var(--accent, var(--ui-accent)));
  transition: filter 0.18s ease, opacity 0.18s ease;
}

.ability-card.is-active .glyph-svg {
  filter: drop-shadow(0 0 11px var(--accent, var(--ui-accent)));
}

.ability-card__label {
  position: relative;
  margin-top: 7px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  transition: opacity 0.18s ease;
}

.ability-card__key {
  position: absolute;
  top: 6px;
  right: 9px;
  z-index: 1;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--ui-text-dim);
}

.hud__panel {
  position: absolute;
  padding: 12px 14px;
  border-radius: var(--ui-radius);
  border: 1px solid var(--ui-border);
  background: var(--ui-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--ui-shadow);
  line-height: 1.65;
}

.hud__help {
  left: 22px;
  bottom: 26px;
  max-width: 260px;
  color: var(--ui-text-dim);
  transition: opacity 0.3s ease;
}

.hud__help.is-hidden {
  opacity: 0;
}

.hud__help strong {
  color: var(--ui-text);
  font-weight: 600;
}

.hud__help kbd {
  display: inline-block;
  min-width: 18px;
  padding: 1px 5px;
  margin-right: 4px;
  border-radius: 5px;
  border: 1px solid var(--ui-border);
  background: rgba(255, 255, 255, 0.07);
  font: 11px/1.5 var(--ui-font);
  color: var(--ui-text);
  text-align: center;
}

.hud__stats {
  right: 22px;
  top: 22px;
  min-width: 132px;
  font-variant-numeric: tabular-nums;
  color: var(--ui-text-dim);
}

.hud__stats b {
  float: right;
  color: var(--ui-text);
  font-weight: 600;
}

.hud__title {
  left: 22px;
  top: 22px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-size: 11px;
  font-weight: 600;
}

.hud__title span {
  display: block;
  margin-top: 2px;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--ui-text-dim);
  text-transform: none;
}

.hud__toast {
  position: absolute;
  left: 50%;
  top: 76px;
  transform: translate(-50%, -12px);
  padding: 9px 18px;
  border-radius: 999px;
  border: 1px solid var(--ui-border);
  background: var(--ui-bg-solid);
  box-shadow: var(--ui-shadow);
  opacity: 0;
  transition: opacity 0.25s ease, transform 0.25s ease;
  font-size: 12px;
  letter-spacing: 0.04em;
}

.hud__toast.is-visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* Standing reminder that the clock is stopped but the editor is not. */
.hud__paused {
  position: absolute;
  left: 50%;
  top: 26px;
  transform: translate(-50%, -8px);
  padding: 5px 16px;
  border-radius: 999px;
  border: 1px solid rgba(127, 214, 255, 0.4);
  background: rgba(12, 22, 32, 0.86);
  color: var(--ui-accent);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.hud__paused.is-visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

.hud__help-note {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid var(--ui-border);
  font-size: 11px;
  color: var(--ui-accent);
  opacity: 0.72;
}

/* ------------------------------------------------------------------ *
 * lil-gui theming
 * ------------------------------------------------------------------ */

.lil-gui.root {
  --background-color: rgba(12, 16, 22, 0.9);
  --widget-color: rgba(255, 255, 255, 0.1);
  --focus-color: rgba(127, 214, 255, 0.35);
  --hover-color: rgba(255, 255, 255, 0.16);
  --font-family: var(--ui-font);
  --font-size: 11px;
  --input-font-size: 11px;
  --title-height: 30px;
  --widget-height: 22px;
  --name-width: 46%;
  z-index: 40;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--ui-shadow);
  max-height: calc(100vh - 32px);
}

.lil-gui.root > .title {
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 600;
}

.lil-gui.autoPlace {
  top: 16px;
  right: 16px;
}

@media (max-width: 760px) {
  .hud__help,
  .hud__stats {
    display: none;
  }
  .ability-card {
    width: 78px;
  }
}

    chunkGravity: -17,
    chunkSpin: 6,

    chunkCool: 2.6,

    chunkSink: 1,

    sparkStretch: 0.16,

    colorSparkA: "#fffdf2",
    colorSparkB: "#ffd27a",
    colorSparkC: "#ff6a12",
    colorSparkD: "#3d1103",

  /* ================================================================== */
  /* BEAM — ability four                                                 */
  /* ================================================================== */
  /**
   * A sustained super beam: the caster winds up a ball of light in both hands,
   * then lets a column of it out along the aimed line, where it *stays* —
   * burning into the floor for `lifetime` before it collapses back to a thread
   * and blinks out. Reference for the look: `superbeam.jpg`.
   *
   * This is the ability with a **fourth beat**. Ice, thunder and meteor all run
   * travel → impact → fade; the beam puts a `charge` in front of that, so the
   * shot is something you watch arrive *and* something that lands and holds.
   * Nothing in the base class needed changing for it — `BeamAbility` simply
   * refuses to let the front leave the hand until the orb is up to power.
   *
   * The column is **one tube** — see `assets/ProceduralGeometry.js` — drawn
   * three times at three radii by `materials/BeamMaterial.js`: a wide halo, a
   * hollow rim-weighted sheath and, inside it, a core weighted the *opposite*
   * way, brightest where the view ray runs down the barrel. That inversion is
   * what makes the middle read as a solid rod of light instead of as a lit
   * pipe. The coils spiralling around it and the shock discs racing down it are
   * two more instanced passes placed against the same radius profile, so all
   * five stay welded together when the shape is dragged.
   *
   * Deliberately *not* electric: no kinks anywhere. The bolt's noise is
   * piecewise-linear so it keeps its corners; every noise term here is smooth
   * and stretched hard along the flow, because a beam that kinks is a bolt.
   *
   * As in every other block, a cast captures nothing but one seed and a few
   * timestamps. The barrel, the flare, the coil pitch and the disc train are all
   * resolved against these numbers each frame — which is why dragging `radius`
   * re-bores a beam that is already burning, with the clock stopped.
   */
  beam: {
    /* --- the cast --- */
    range: 26,
    // maximum cast distance, metres
    minRange: 3,
    // closer than this and the cast is refused
    charge: 0.42,
    // seconds the orb winds up before the beam is let out
    speed: 150,
    // how fast the leading edge races downrange, metres/second
    lifetime: 1.15,
    // seconds it burns once it lands
    fadeTime: 0.4,
    // seconds it takes to collapse
    cooldown: 1.6,
    castAnim: "cast1",
    // which clip in `CAST_ANIMATIONS` the body throws
    /* --- where it leaves the caster --- */
    // Both hands, so this one sits on the centre line rather than off a
    // shoulder like the bolt and the rock.
    handHeight: 1.3,
    // metres above the floor
    handForward: 0.72,
    // metres in front of the caster
    handSide: 0,
    // metres to the side (+ follows `Ability#side`)
    endHeight: 1,
    // height of the beam where it lands, metres
    /* --- the column --- */
    // A narrow throat that stays tight (`radiusCurve` above 1) and then opens
    // hard over the last tenth of the span: the beam reads as a jet with a bell
    // on the end rather than as a cone, which is what puts the weight at the
    // impact instead of spreading it down the whole line.
    radiusNear: 0.16,
    // half-width at the muzzle, metres
    radius: 0.77,
    // half-width at the target
    radiusCurve: 1.27,
    // <1 opens out early, >1 stays tight then flares late
    flare: 1.74,
    // extra swell where it lands
    flareWidth: 0.09,
    // how much of the span that swell covers, 0..1
    // Both wobbles ship at zero. The column reads cleaner with a hard, still
    // silhouette — the coils already give the eye something moving to follow —
    // but the rates below are tuned, so raising either one is a single drag.
    throb: 0,
    // pressure waves travelling out along it
    throbScale: 4.8,
    // waves over the length
    throbSpeed: 2.6,
    // waves/second
    wander: 0,
    // metres the axis drifts, pinned at both ends
    wanderScale: 0.9,
    // drift features per unit length
    wanderSpeed: 0.7,
    /* --- the three tube passes --- */
    // The core is deliberately narrow and not fully opaque. Widen it or push
    // `coreFill` up and the three layers stack into one white rod: the cyan
    // sheath and the gold coils are only readable because the middle leaves
    // them room.
    coreWidth: 0.2,
    // the hot rod, × the column radius
    coreSharp: 1.55,
    // how tightly the core hugs the axis
    coreFill: 0.6,
    // how solid it reads
    shellWidth: 1,
    // the sheath
    shellRim: 1.15,
    // brightness of its silhouette edges
    shellFill: 0.18,
    // how much body it has between them
    shellOpacity: 0.95,
    // Wide and faint: the halo is atmosphere, not a second beam. Pushing its
    // opacity up fogs the sheath's silhouette edges, which are the read.
    haloWidth: 2.75,
    // the outer bloom
    haloRim: 4.3,
    // how tightly that hugs the silhouette
    haloOpacity: 0.14,
    edgePower: 2.2,
    // rim exponent shared by the sheath
    /* --- the surface --- */
    ripple: 0.2,
    // how far the noise pushes the barrel off round
    rippleBands: 2.2,
    // ripple features around the barrel
    rippleScale: 4.25,
    // ... and along it
    rippleSpeed: 2,
    // how fast they crawl downrange
    streak: 1.1,
    // filaments streaming along the flow
    streakSharp: 0.45,
    // 0 = a wash, 1 = hard threads
    streakScale: 4.2,
    // threads per unit length
    streakBands: 1.8,
    // ... and around the barrel
    // Kept low: the threads carry heat into the *sheath*, and pushing this up
    // whitens it out until the beam is one colour from axis to rim.
    streakGlow: 0.55,
    // how hot a thread burns in the sheath
    flowSpeed: 7,
    // how fast the whole field streams downrange
    mouthGlow: 1.6,
    // heat where the column leaves the orb
    mouthLength: 0.1,
    // how far that reaches, fraction of the span
    // Kept below the muzzle's: the flare and the impact shell already carry the
    // far end, and stacking a hot cap on top of them blows it out to a disc.
    tipGlow: 0.6,
    // heat on the leading edge / the burning end
    tipLength: 0.09,
    // length of that edge, fraction of the span
    softFade: 0.62,
    // metres of soft fade where it meets geometry
    /* --- colour --- */
    colorCore: "#ffffff",
    // the axis
    colorInner: "#d3f4ff",
    colorOuter: "#3ec6ff",
    // the outside of the sheath
    colorHalo: "#0d3ce0",
    // the wide bloom around it
    // The column is deliberately held *back*. Three additive tube passes at full
    // strength clip to white and the beam becomes a flat plank; dropping the
    // gain and the opacity keeps it glassy and hands the read to the coils.
    glow: 0.74,
    // overall emissive gain
    opacity: 0.29,
    /* --- the coils --- */
    /**
     * Ribbons spiralling around the column, on the same strip the bolt is drawn
     * on. Warm on purpose: the reference frames a white-hot beam with gold
     * coils, and the colour split is what stops them dissolving into the sheath.
     */
    coils: 4,
    // ribbons (capped at 8)
    coilTurns: 1.45,
    // turns each one makes over the length
    // Negative, so the ribbons roll *against* the direction the charge pulse
    // runs. The two motions reading differently is what keeps a held beam from
    // looking like a single rotating screw.
    coilSpeed: -0.69,
    // turns/second they roll on top of that
    coilRadius: 1.88,
    // how far out they ride, × the column radius
    coilFlare: 0.57,
    // extra opening at the far end
    coilWidth: 0.1,
    // half-width at the muzzle, metres
    coilWidthTip: 1.9,
    // that width at the target, as a multiple
    coilSharp: 2.2,
    // how hard the ribbon falls off across its width
    coilPulse: 0.65,
    // depth of the charge running along it
    coilPulseFreq: 3,
    // pulses over the length
    coilPulseSpeed: 1.6,
    // pulses/second
    // Driven hard on purpose. With the column dialled back above, the ribbons
    // are what the eye actually follows down the beam.
    coilGlow: 8,
    coilOpacity: 2,
    colorCoil: "#ffdc8c",
    colorCoilEdge: "#ff6a12",
    /* --- the shock discs --- */
    rings: 10,
    // discs in flight (capped at 12)
    ringSpeed: 1.31,
    // trips down the beam per second
    // Both lips well clear of the sheath, and close together: the discs read as
    // thin hoops orbiting the column rather than as plates growing out of it.
    ringInner: 2.42,
    // inner lip, × the local column radius
    ringOuter: 2.73,
    // outer lip
    ringSwell: 0.55,
    // how much they open out as they travel
    ringFade: 0.18,
    // how much is left of one by the time it lands
    ringSharp: 1.6,
    // how thin the band reads
    ringGlow: 2.4,
    ringOpacity: 0.7,
    colorRing: "#9ceeff",
    /* --- the charge orb --- */
    orbSize: 0.39,
    // radius once it is up to power, metres
    orbThrob: 0.11,
    // how hard it pulses
    orbThrobSpeed: 6.9,
    orbTurbulence: 0.24,
    // how far the noise eats into its surface
    orbScale: 2.2,
    // features over the surface
    orbFlow: 0.9,
    // how fast they crawl
    orbBands: 5,
    // filament frequency
    orbRim: 1.8,
    // rim exponent
    orbGlow: 2.8,
    orbOpacity: 1,
    /* --- what the ground does --- */
    scorchRate: 1.1,
    // burns laid per metre of front travel
    scorchRadius: 0.7,
    // radius of one, metres
    scorchLife: 7,
    // seconds it lingers
    scorchIntensity: 0.55,
    colorScorch: "#0a0d14",
    colorEmber: "#4ad6ff",
    dustRate: 7,
    // dust rings thrown off the burning end, per second
    dustRadius: 2.4,
    // radius of one, metres
    dustLife: 0.9,
    colorDustA: "#3d5c74",
    colorDustB: "#9ceeff",
    shockRate: 3.5,
    // pressure rings snapped across the floor, per second
    shockRadius: 7,
    // radius of the one at the impact, metres
    colorShockA: "#3ec6ff",
    // body of the shockwave ring
    colorShockB: "#ffffff",
    // its crest
    /* --- sparks, motes, smoke and debris --- */
    /**
     * As in `ice`, `thunder` and `meteor`: each system is coloured by a four-stop
     * gradient sampled over the particle's own lifetime, `A` at birth through

    sparkRate: 300,
    // sparks shed off the column, particles/second
    sparkSize: 0.15,
    sparkSpeed: 8,
    sparkLifetime: 0.55,
    sparkGravity: -9,
    sparkStretch: 0.22,
    // how far a spark smears along its velocity
    sparkForward: 0.9,
    // how hard the spray is dragged downrange
    colorSparkA: "#ffffff",
    colorSparkB: "#d3f4ff",
    colorSparkC: "#3ec6ff",
    colorSparkD: "#0b2f7a",
    moteRate: 120,
    // the drift hanging around the column
    moteSize: 0.06,
    moteSpeed: 1.6,
    moteLifetime: 1.5,
    moteRise: 0.9,
    // upward drift, metres/second
    moteTurbulence: 0.8,
    colorMoteA: "#ffffff",
    colorMoteB: "#9ceeff",
    colorMoteC: "#3ec6ff",
    colorMoteD: "#06205e",
    intakeRate: 260,
    // motes pulled into the orb while it charges
    intakeRadius: 2.6,
    // how far out they are drawn from, metres
    intakeSpeed: 7.5,
    // how fast they fall in
    smokeRate: 90,

    smokeSize: 1.1,
    smokeSpeed: 1.4,
    smokeLifetime: 2.4,
    smokeOpacity: 0.07,

    colorSmokeB: "#35485e",
    colorSmokeC: "#2a3949",
    colorSmokeD: "#1a2430",
    debrisRate: 34,

    debrisSize: 0.06,
    debrisSpeed: 6,

    debrisGravity: -18,
    colorDebrisA: "#2b323c",
    colorDebrisB: "#1f252d",
    colorDebrisC: "#1a1f26",
    colorDebrisD: "#1a1f26",
    /* --- dynamic light --- */

   * span is the length of the cast, so uJitterScale stays kinks per *metre*

  vec2 kink(float t, float seed, float span) {

    this.motes.uniforms.uFadeIn.value = 0.08;
    this.motes.uniforms.uFadeOut.value = 0.4;

      shape: ParticleShape.SMOKE,
      additive: false,
      curl: true,
      softFade: 1.1

    this.smoke.uniforms.uDrag.value = 1.8;
    this.smoke.uniforms.uEndSize.value = 3;
    this.smoke.uniforms.uSizeIn.value = 0.12;
    this.smoke.uniforms.uFadeIn.value = 0.16;
    this.smoke.uniforms.uFadeOut.value = 0.3;
    this.debris = particles.get("thunder.debris", {
      capacity: 1600,
      shape: ParticleShape.CHIP,
      additive: false,
      lit: true,
      softFade: 0.25

    this.debris.uniforms.uEndSize.value = 0.8;
    this.debris.uniforms.uFadeOut.value = 0.7;

    this.smokeEmitter = new RateEmitter();

  /* ------------------------------------------------------------------ */
  /* Timing                                                              */
  /* ------------------------------------------------------------------ */
  get instanceCount() {
    return this._strandCount * this.meshes.length;

  /** The bolt holds after it lands, then blows out. */
  get impactDuration() {
    return Math.max(0.05, settings.thunder.lifetime * settings.global.lifetime);

  /* ------------------------------------------------------------------ */
  /* Geometry of the bolt — every metre resolved from live settings       */
  /* ------------------------------------------------------------------ */

   * here rather than baked into the cast.

  _handPoint(out) {
    const c = settings.thunder;

    state.progress = this.phase === AbilityPhase.TRAVEL ? this.u : 1;
    state.fade = fade;
    state.seed = this._seed;

      getColor(c.colorSparkB),
      getColor(c.colorSparkC),
      getColor(c.colorSparkD)

    this.sparks.uniforms.uGravity.value.set(0, c.sparkGravity, 0);
    this.sparks.uniforms.uSizeScale.value = c.sparkSize * g.particleSize * 7;
    this.sparks.uniforms.uLifeScale.value = c.sparkLifetime * 0.5 * g.particleLifetime;
    this.sparks.uniforms.uSpeedScale.value = g.particleSpeed;
    this.sparks.uniforms.uOpacity.value = g.opacity;
    this.sparks.uniforms.uGlow.value = c.glow * 0.6 * g.glow;
    this.sparks.uniforms.uStretch.value = c.sparkStretch;
    this.sparks.uniforms.uTurbulence.value = 0.25 * g.turbulence;
    this.motes.setGradient(
      getColor(c.colorMoteA),
      getColor(c.colorMoteB),
      getColor(c.colorMoteC),
      getColor(c.colorMoteD)
    );
    this.motes.uniforms.uGravity.value.set(0, c.moteRise, 0);
    this.motes.uniforms.uSizeScale.value = c.moteSize * g.particleSize * 7;
    this.motes.uniforms.uLifeScale.value = c.moteLifetime * 0.5 * g.particleLifetime;
    this.motes.uniforms.uSpeedScale.value = g.particleSpeed;
    this.motes.uniforms.uOpacity.value = g.opacity;
    this.motes.uniforms.uGlow.value = 0.9 * g.glow;
    this.motes.uniforms.uTurbulence.value = c.moteTurbulence * g.turbulence;

    this.smoke.uniforms.uSizeScale.value = c.smokeSize * g.particleSize;
    this.smoke.uniforms.uLifeScale.value = c.smokeLifetime * 0.5 * g.particleLifetime;
    this.smoke.uniforms.uSpeedScale.value = c.smokeSpeed * g.particleSpeed;
    this.smoke.uniforms.uOpacity.value = c.smokeOpacity * g.opacity;
    this.smoke.uniforms.uTurbulence.value = 0.35 * g.turbulence;

      getColor(c.colorDebrisB),

  _muzzleFx() {

    _emit2.spread = 0.85;
    _emit2.inherit = null;
    _emit2.anchor = null;
    _emit2.size = 0.2;
    _emit2.sizeVariance = 0.7;
    _emit2.life = c.sparkLifetime;
    _emit2.lifeVariance = 0.5;

    _emit2.time = frame.uTime.value;

  /**

    let sparkCount = Math.round(this.sparkEmitter.tick(dt, c.sparkRate * scale) * g.particleCount);
    if (sparkCount > 0) {
      _emit2.direction = _dir3.copy(this.direction).multiplyScalar(0.45).setY(0.55).normalize();
      _emit2.speed = c.sparkSpeed;
      _emit2.speedVariance = 0.85;
      _emit2.spread = 1;
      _emit2.inherit = null;
      _emit2.anchor = null;
      _emit2.size = 0.16;
      _emit2.sizeVariance = 0.7;
      _emit2.life = c.sparkLifetime;
      _emit2.lifeVariance = 0.55;
      _emit2.spin = 0;

    if (moteCount > 0) {
      const s = Math.random() * reach;

      _emit2.radius = this._bundleRadius(s) * 1.6 + 0.2;
      _emit2.direction = _dir3.set(0, 1, 0);
      _emit2.speed = c.moteSpeed;
      _emit2.speedVariance = 0.8;
      _emit2.spread = 1;
      _emit2.size = 0.08;
      _emit2.sizeVariance = 0.6;
      _emit2.life = c.moteLifetime;
      _emit2.lifeVariance = 0.5;
      _emit2.spin = 0;
      _emit2.time = time;

      _emit2.position = _pos2;
      _emit2.radius = c.scorchRadius * 2.5;
      _emit2.direction = _dir3.set(0, 1, 0);
      _emit2.speed = c.smokeSpeed;
      _emit2.speedVariance = 0.7;
      _emit2.spread = 0.9;
      _emit2.size = 0.8;
      _emit2.sizeVariance = 0.5;
      _emit2.life = c.smokeLifetime;
      _emit2.lifeVariance = 0.4;

        life: c.scorchLife,
        intensity: c.scorchIntensity,

  /* ------------------------------------------------------------------ */
  /* Phases                                                              */
  /* ------------------------------------------------------------------ */
  onTravel(dt) {

      radius: c.burstSize * 0.2,
      endRadius: c.burstSize * g.explosionIntensity,

      intensity: c.burstIntensity,
      opacity: 0.9,
      fresnel: 1.6,
      displace: 0.6,

      colorA: getColor(c.colorBurstA),
      colorB: getColor(c.colorBurstB),
      colorC: getColor(c.colorBurstC)
    });

    this.ctx.decals.spawn(DecalType.SHOCKWAVE, _target, {
      radius: c.shockRadius * g.explosionIntensity,
      life: 0.6,
      width: 0.05,
      intensity: 1,
      colorA: getColor(c.colorShockA),
      colorB: getColor(c.colorShockB)

      radius: c.arcRadius * 2.4,
      life: c.arcLife * 1.6,
      width: c.arcBranches,
      intensity: c.arcIntensity,
      colorA: getColor(c.colorEmber),
      colorB: getColor(c.colorArc)
    });
    this.ctx.decals.spawn(DecalType.SCORCH, _target, {
      radius: c.scorchRadius * 2.6,
      life: c.scorchLife * 1.4,
      intensity: c.scorchIntensity * 1.3,
      colorA: getColor(c.colorScorch),
      colorB: getColor(c.colorEmber),
      height: 0.015
    });
    _emit2.position = _pos2;
    _emit2.radius = 0.3;
    _emit2.direction = _dir3.copy(this.direction).multiplyScalar(0.5).setY(0.7).normalize();
    _emit2.speed = c.sparkSpeed * 2.2;
    _emit2.speedVariance = 0.85;
    _emit2.spread = 1;
    _emit2.inherit = null;
    _emit2.anchor = null;
    _emit2.size = 0.22;
    _emit2.sizeVariance = 0.8;
    _emit2.life = c.sparkLifetime * 1.5;
    _emit2.lifeVariance = 0.6;
    _emit2.spin = 0;
    _emit2.tint = null;
    _emit2.time = time;
    this.sparks.emit(Math.round(c.burstSparks * g.particleCount), _emit2);
    _emit2.position = _target;
    _emit2.radius = c.scorchRadius * 2;
    _emit2.direction = _dir3.set(0, 1, 0);
    _emit2.speed = c.debrisSpeed * 1.8;
    _emit2.spread = 0.85;
    _emit2.size = 0.14;
    _emit2.life = c.debrisLifetime * 1.3;
    _emit2.spin = 10;
    this.debris.emit(Math.round(c.burstDebris * g.particleCount), _emit2);
    _emit2.speed = c.smokeSpeed * 2.2;
    _emit2.spread = 1;
    _emit2.size = 1.5;
    _emit2.life = c.smokeLifetime * 1.3;
    _emit2.spin = 0.5;
    this.smoke.emit(Math.round(45 * g.particleCount), _emit2);
    this.ctx.shake.add(
      c.impactShake * g.explosionIntensity * g.cameraShake,
      1 / Math.max(0.1, c.shakeDuration),
      26
    );
    this.ctx.flash.trigger(getColor(c.colorFlash), c.impactFlash * g.explosionIntensity);
    this.lightBoost = c.lightIntensity * 1.5 * g.explosionIntensity;
  }
  onFade(dt, t) {
    const fade = t <= 1 ? 1 : 1 - Easing.inCubic(saturate(t - 1));

  onDestroy() {
    this._strandCount = 1;

  }
  dispose() {
    this.geometry.dispose();
    for (const material of this.boltMaterials) material.dispose();
    super.dispose();
  }
};

// src/materials/MeteorMaterial.js
function createMeteorMaterial(environment) {
  const material = new MeshStandardMaterial5({
    color: 16777215,
    roughness: 0.94,
    metalness: 0,
    // Faceted, like the crystals: it is what makes a low-poly rock read as rock
    // rather than as a smooth ball with a texture on it.
    flatShading: true
  });
  const uniforms = {
    uTime: frame.uTime,
    uColorRock: { value: new Color14() },
    uColorChar: { value: new Color14() },
    uColorCrack: { value: new Color14() },
    uColorHot: { value: new Color14() },
    uCrackScale: { value: 2.4 },
    uCrackWidth: { value: 0.1 },
    uCrackBranches: { value: 0.65 },
    uCrackGlow: { value: 3.2 },
    uFlow: { value: 0.7 },
    uFlowSpeed: { value: 0.9 },
    uRockScale: { value: 3.4 },
    uFacetTint: { value: 0.35 },
    uCavity: { value: 0.45 },
    uSoot: { value: 0.8 },
    uRimHeat: { value: 1.1 },
    uLead: { value: 1.6 },
    uLeadSharp: { value: 2.6 },
    /** Unit heading of the meteor, world space — drives the leading-face heat. */
    uHeading: { value: new Vector320(0, 0, 1) },
    uCharge: { value: 0 },
    uGlow: { value: 1 }
  };
  environment.registerShadowCasterWithPatch(material, (shader) => {
    Object.assign(shader.uniforms, uniforms);
    shader.vertexShader = shader.vertexShader.replace(
      "#include <common>",
      `#include <common>
         attribute float aSeed;
         attribute float aHeat;
         varying vec3  vRockLocal;
         varying vec3  vRockNormalW;
         varying float vRockSeed;
         varying float vRockHeat;`
    ).replace(
      "#include <begin_vertex>",
      `#include <begin_vertex>
         vRockLocal = transformed;
         vRockSeed = aSeed;
         vRockHeat = aHeat;
         #ifdef USE_INSTANCING
           vRockNormalW = normalize(mat3(modelMatrix) * (instanceMatrix * vec4(objectNormal, 0.0)).xyz);
         #else
           vRockNormalW = normalize(mat3(modelMatrix) * objectNormal);
         #endif`
    );
    shader.fragmentShader = shader.fragmentShader.replace(
      "#include <common>",
      `#include <common>
         uniform float uTime;
         uniform vec3  uColorRock;
         uniform vec3  uColorChar;
         uniform vec3  uColorCrack;
         uniform vec3  uColorHot;
         uniform float uCrackScale;
         uniform float uCrackWidth;
         uniform float uCrackBranches;
         uniform float uCrackGlow;
         uniform float uFlow;
         uniform float uFlowSpeed;
         uniform float uRockScale;
         uniform float uFacetTint;
         uniform float uCavity;
         uniform float uSoot;
         uniform float uRimHeat;
         uniform float uLead;
         uniform float uLeadSharp;
         uniform vec3  uHeading;
         uniform float uCharge;
         uniform float uGlow;
         varying vec3  vRockLocal;
         varying vec3  vRockNormalW;
         varying float vRockSeed;
         varying float vRockHeat;
         ${noiseGLSL}`
    ).replace(
      "#include <emissivemap_fragment>",
      `#include <emissivemap_fragment>
         {
           vec3  N   = normalize(normal);
           float ndv = clamp(dot(N, normalize(vViewPosition)), 0.0, 1.0);
           float rim = pow(1.0 - ndv, 2.2);

           /*
            * The seam, as a cross-section rather than as a line.
            *
            * "distance" is how far this fragment is from the nearest zero
            * crossing of the crack field, and the three bands cut out of it are
            * what make the crack read as a *split in stone* instead of a bright
            * worm painted over it:
            *
            *   fissure — the open gap. There is no rock here, so the albedo is
            *             killed and only the magma below shows.
            *   lip     — a much wider charred band either side of it. A crack is
            *             a shadow first and a light second; without this the
            *             glow just sits on top of the surface.
            *   core    — the middle of the gap, the only part hot enough to run
            *             white.
            *
            * Local space throughout, so the whole network is welded to the rock
            * and tumbles with it.
            */
           vec3  p  = vRockLocal * uCrackScale + vRockSeed * 19.0;
           float f1 = fbm3(p);
           float f2 = fbm3(p * 2.7 + 11.3);

           // The charge prises the seams open as the meteor heats up.
           float width = max(0.004, uCrackWidth * (1.0 + uCharge * 0.8));
           float distance = min(abs(f1), abs(f2) / max(uCrackBranches, 0.05));

           float fissure = 1.0 - smoothstep(width * 0.35, width, distance);
           float lip     = 1.0 - smoothstep(width, width * 2.0, distance);
           float core    = 1.0 - smoothstep(0.0, width * 0.45, distance);

           // Magma is not static: brightness crawls along the inside of a seam.
           float pulse = snoise(vRockLocal * 4.0 + vec3(0.0, uTime * uFlowSpeed, 0.0) + vRockSeed * 7.0);
           float flow  = mix(1.0, 0.45 + 0.75 * (pulse * 0.5 + 0.5), uFlow);

           /* --- the rock itself --- */
           float mottle = fbm3(vRockLocal * uRockScale + vRockSeed * 31.0) * 0.5 + 0.5;
           vec3  rock   = mix(uColorRock, uColorChar, smoothstep(0.3, 0.85, mottle));

           // Per-facet value break-up. The geometric normal in *object* space is
           // constant across a triangle, so hashing it gives every flat face its
           // own shade — the thing that separates cut stone from a noise-painted
           // ball, and it costs two derivatives.
           vec3  faceN = normalize(cross(dFdx(vRockLocal), dFdy(vRockLocal)));
           float facet = hash13(faceN * 37.0 + vRockSeed + 0.5);
           rock *= 1.0 + (facet - 0.5) * uFacetTint;

           // Cheap curvature occlusion: craters and cut faces sit closer to the
           // centre than the lumps do, so radius doubles as a cavity term.
           float cavity = smoothstep(0.55, 1.0, length(vRockLocal));
           rock *= mix(1.0 - uCavity, 1.0, cavity);

           // Charred around every seam, and gone entirely inside one.
           rock = mix(rock, uColorChar, lip * uSoot);
           rock *= 1.0 - fissure * 0.92;

           // Hard lighting contrast across the facets, so the silhouette reads
           // as a bundle of planes rather than one smooth mass.
           rock *= mix(0.55, 1.15, ndv);
           diffuseColor.rgb *= rock;

           /* --- what is burning --- */
           // The gap is the only thing that emits, and only its middle runs
           // white. Everything else is rock.
           float heat = fissure * flow * vRockHeat;
           vec3  glow = mix(uColorCrack, uColorHot, core * core) * heat * uCrackGlow;

           // A sheath of heat around the silhouette, and the compression heat on
           // the leading facets. Both are squared against the charge: at launch
           // this is a cold rock with lit cracks, and it is only on the way down
           // that the whole thing starts to burn.
           float charge2 = uCharge * uCharge;
           glow += uColorCrack * rim * uRimHeat * vRockHeat * charge2;

           float lead = pow(clamp(dot(normalize(vRockNormalW), uHeading), 0.0, 1.0), uLeadSharp);
           glow += uColorHot * lead * uLead * vRockHeat * charge2;

           glow *= uGlow;

           // The same soft ceiling the ice uses: these terms are independent and
           // stack, and without it a seam crossing the rim sums past 10 and the
           // bloom pass smears the whole rock into a white blob.
           glow /= 1.0 + glow * 0.22;

           totalEmissiveRadiance += glow;
         }`
    );
  });
  material.userData.uniforms = uniforms;
  material.userData.sync = (charge = 0, heading = null) => {
    const c = settings.meteor;
    const g = settings.global;
    uniforms.uColorRock.value.copy(getColor(c.colorRock));
    uniforms.uColorChar.value.copy(getColor(c.colorChar));
    uniforms.uColorCrack.value.copy(getColor(c.colorCrack));
    uniforms.uColorHot.value.copy(getColor(c.colorHot));
    uniforms.uCrackScale.value = c.crackScale * g.noiseFrequency;
    uniforms.uCrackWidth.value = c.crackWidth;
    uniforms.uCrackBranches.value = c.crackBranches;
    uniforms.uCrackGlow.value = c.crackGlow * g.shaderIntensity;
    uniforms.uFlow.value = c.crackFlow;
    uniforms.uFlowSpeed.value = c.crackFlowSpeed * g.noiseSpeed;
    uniforms.uRockScale.value = c.rockScale * g.noiseFrequency;
    uniforms.uFacetTint.value = c.facetTint * g.randomness;
    uniforms.uCavity.value = c.cavity;
    uniforms.uSoot.value = c.soot;
    uniforms.uRimHeat.value = c.rimHeat * g.fresnel;
    uniforms.uLead.value = c.leadGlow;
    uniforms.uLeadSharp.value = c.leadSharp;
    uniforms.uCharge.value = charge;
    uniforms.uGlow.value = c.glow * g.glow;
    if (heading) uniforms.uHeading.value.copy(heading);
    material.envMapIntensity = c.envIntensity;
  };
  material.userData.sync();
  return material;
}

}

  /* glsl */

  constructor() {

      blending: CustomBlending,
      blendEquation: AddEquation,
      blendSrc: OneFactor,
      blendDst: OneMinusSrcAlphaFactor,
      blendSrcAlpha: OneFactor,
      blendDstAlpha: OneMinusSrcAlphaFactor,
      side: DoubleSide8,
      toneMapped: false,
      uniforms: sharedUniforms({
        /* shape */

        uHeadSize: { value: 2.1 },
        uPlume: { value: 1.8 },
        uWakeSpread: { value: 1.1 },
        uStreamLength: { value: 6 },
        uArcLength: { value: 7 },
        uTailPad: { value: 0.3 },
        uDetachment: { value: 0.5 },
        uSoftness: { value: 0.45 },
        uShred: { value: 1.35 },
        uBulge: { value: 0.28 },
        uBulgeScale: { value: 0.5 },
        /* motion */

        uBuoyancy: { value: 2.6 },
        uSwirl: { value: 0.45 },
        uSwirlSpeed: { value: 0.9 },
        uVortex: { value: 1.15 },
        uRingFreq: { value: 0.55 },
        uRingSpeed: { value: 1.6 },
        uNoiseFrequency: { value: 3.2 },
        uNoiseStrength: { value: 0.9 },
        uWarp: { value: 0.2 },
        uTongue: { value: 0.5 },
        uStreamStretch: { value: 0.3 },
        uWisp: { value: 0 },
        uFlicker: { value: 0.45 },
        uLick: { value: 3.2 },
        uOctaves: { value: 5 },
        /* temperature & radiance */
        uTempCore: { value: 3500 },
        uTempEdge: { value: 1550 },
        uEmissionCurve: { value: 2.6 },
        uHeatFocus: { value: 1 },
        uHeatFalloff: { value: 1.15 },
        uHeatFollow: { value: 0.2 },
        uTailHeat: { value: 0.5 },
        uPalette: { value: 0 },
        uScatter: { value: 0.9 },
        uScatterFalloff: { value: 2.2 },
        /* rendering */
        uDensity: { value: 1.35 },
        uSoot: { value: 1.5 },
        uCoreClarity: { value: 0.62 },
        uEmission: { value: 6.5 },
        uOpacity: { value: 1 },
        uSteps: { value: 44 },
        uSeed: { value: Math.random() * 20 },
        uHeadFade: { value: 0 },
        uTailFade: { value: 0.1 },
        uColorCore: { value: new Color15(1, 0.96, 0.82) },
        uColorMid: { value: new Color15(1, 0.69, 0.18) },
        uColorEdge: { value: new Color15(1, 0.24, 0.06) },
        uColorSmoke: { value: new Color15(0.14, 0.1, 0.09) }
      }),
      vertexShader: (
        /* glsl */
        `
        uniform float uArcLength;
        uniform float uTailPad;

        attribute float aDist;
        attribute float aRandom;
        attribute vec3  aCenter;
        attribute vec3  aTangent;

        varying vec3  vCenter;
        varying vec3  vTangent;
        varying float vS;
        varying float vRadius;
        varying vec3  vWorld;
        varying float vRandom;

        ${PROFILE_GLSL}

        void main() {

          // ends so its end caps are covered).

          // flame in front of it instead of to the fattest part of the stream —

        /* glsl */

        uniform float uTime;
        uniform float uRadius;
        uniform float uHeadSize;
        uniform float uPlume;
        uniform float uStreamLength;
        uniform float uDetachment;
        uniform float uSoftness;
        uniform float uShred;
        uniform float uBulge;
        uniform float uBulgeScale;
        uniform float uFlow;
        uniform float uBuoyancy;
        uniform float uSwirl;
        uniform float uSwirlSpeed;
        uniform float uVortex;
        uniform float uRingFreq;
        uniform float uRingSpeed;
        uniform float uNoiseFrequency;
        uniform float uNoiseStrength;
        uniform float uWarp;
        uniform float uTongue;
        uniform float uStreamStretch;
        uniform float uWisp;
        uniform float uFlicker;
        uniform float uLick;
        uniform float uOctaves;
        uniform float uTempCore;
        uniform float uTempEdge;
        uniform float uEmissionCurve;
        uniform float uHeatFocus;
        uniform float uHeatFalloff;
        uniform float uHeatFollow;
        uniform float uTailHeat;
        uniform float uPalette;
        uniform float uScatter;
        uniform float uScatterFalloff;
        uniform float uDensity;
        uniform float uSoot;
        uniform float uCoreClarity;
        uniform float uEmission;
        uniform float uOpacity;
        uniform float uSteps;
        uniform float uSeed;
        uniform float uHeadFade;
        uniform float uTailFade;
        uniform vec3  uColorCore;
        uniform vec3  uColorMid;
        uniform vec3  uColorEdge;
        uniform vec3  uColorSmoke;
        uniform float uShaderIntensity;
        uniform float uGlobalGlow;
        uniform vec2  uResolution;
        uniform sampler2D uSceneDepth;
        uniform float uCameraNear;
        uniform float uCameraFar;

        varying vec3  vCenter;
        varying vec3  vTangent;
        varying float vS;
        varying float vRadius;
        varying vec3  vWorld;
        varying float vRandom;

        ${noiseGLSL}
        ${commonGLSL}
        ${PROFILE_GLSL}

        /* Where the fringe shred starts and stops. REACH_HI bounds how far
           outside the nominal tube the noise can push density, and therefore how
           wide the proxy hull has to be — it is mirrored by FIRE_SHRED_REACH on
           the JS side. */
        const float REACH_LO = 1.15;
        const float REACH_HI = 1.55;

        /* A volume march needs a *cheap* field: this is trilinear value noise on
           a hashed lattice, roughly a third of the cost of the simplex noise the
           surface shaders use, and indistinguishable once five octaves of it are
           being advected, warped and rolled. */
        float vnoise(vec3 p) {
          vec3 i = floor(p);
          vec3 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);

          float a = hash13(i);
          float b = hash13(i + vec3(1.0, 0.0, 0.0));
          float c = hash13(i + vec3(0.0, 1.0, 0.0));
          float d = hash13(i + vec3(1.0, 1.0, 0.0));
          float e = hash13(i + vec3(0.0, 0.0, 1.0));
          float g = hash13(i + vec3(1.0, 0.0, 1.0));
          float h = hash13(i + vec3(0.0, 1.0, 1.0));
          float k = hash13(i + vec3(1.0, 1.0, 1.0));

          return mix(
            mix(mix(a, b, f.x), mix(c, d, f.x), f.y),
            mix(mix(e, g, f.x), mix(h, k, f.x), f.y),
            f.z
          );
        }

        /* Unit-determinant rotation applied between octaves. Value noise is
           built on an axis-aligned lattice, so stacking octaves along the same
           axes lines their features up into a visible grid; rotating the domain
           between them scatters that structure. */
        const mat3 OCTAVE_ROT = mat3(
           0.00,  0.80,  0.60,
          -0.80,  0.36, -0.48,
          -0.60, -0.48,  0.64
        );

        /**
         * Turbulent flame field, normalised to 0..1.
         *
         * Three things separate this from a plain fbm, and two of them are free —
         * they reuse octave values that have already been paid for:
         *
         *  - *progressive domain warping*: each octave is displaced by the one
         *    before it, which folds the field over itself. Straight fbm gives
         *    round, cloud-like blobs; warped fbm gives the curling, billowing
         *    sheets fire actually makes.
         *  - *buoyant shear*: every octave also drifts upward faster than the
         *    last, so fine detail outruns the coarse shapes it sits on and the
         *    structures tear into upward-licking tongues.
         *  - *inter-octave rotation*: see OCTAVE_ROT.
         *
         * @param ridge out — sharp ridged filaments from the two finest octaves,
         *              0..1, used to shred the fringe into strands.
         * @param coarse out — the field truncated to its two largest scales,
         *              0..1. Temperature is read off *this* rather than off the
         *              full field; see the note where it is used.
         */
        float flameFbm(vec3 p, float rise, out float ridge, out float coarse) {
          float v = 0.0;
          float a = 0.5;
          float norm = 0.0;
          float scale = 1.0;
          ridge = 0.0;
          coarse = 0.5;

          for (int i = 0; i < 5; i++) {
            if (float(i) >= uOctaves) break;

            float n = vnoise(p);
            v += a * n;
            norm += a;
            if (i == 1) coarse = v / norm;
            // Ridges come from the finest octaves alone. Averaging the coarse
            // octaves in as well produces broad, smooth ridges that trace the
            // iso-lines of the field, and those read as contour lines drawn on
            // the flame rather than as strands in it.
            if (i >= 3) ridge = max(ridge, 1.0 - abs(n * 2.0 - 1.0));

            p = OCTAVE_ROT * p * 2.17 + (n - 0.5) * uWarp * vec3(1.7, 0.9, 1.3);
            scale *= 2.17;
            p.y -= rise * scale * (1.0 + 0.6 * float(i));
            a *= 0.55;
          }

          return v / max(norm, 1e-4);
        }

        /**
         * Planckian radiator, converted to the linear working space.
         *
         * Fire is not a palette, it is a temperature. The reason a real flame
         * runs deep red at its fringe, orange through its body and white in its
         * core is that those are the colours a grey body emits between roughly
         * 1200 K and 3300 K — and the reason the core blows out while the fringe
         * stays dim is that the power emitted scales as T^4. Both fall out of the
         * physics here instead of having to be dialled in by hand, which is why
         * the result holds together at any exposure.
         *
         * Fit: Tanner Helland's piecewise approximation, valid 1000-40000 K.
         */
        vec3 blackbody(float kelvin) {
          float t = clamp(kelvin, 1000.0, 12000.0) * 0.01;
          vec3 c;
          if (t <= 66.0) {
            c.r = 1.0;
            c.g = 0.3900816 * log(t) - 0.6318414;
            c.b = t <= 19.0 ? 0.0 : 0.5432068 * log(t - 10.0) - 1.1962540;
          } else {
            c.r = 1.2929362 * pow(t - 60.0, -0.1332047);
            c.g = 1.1298909 * pow(t - 60.0, -0.0755148);
            c.b = 1.0;
          }
          c = clamp(c, 0.0, 1.0);
          return c * c * (0.6 + 0.4 * c); // cheap, accurate-enough sRGB -> linear
        }

        /**
         * Density of the flame at a world point.
         *
         * @param heat out — normalised temperature, 0 at the perturbed surface,
         *             1 in the burning core.
         * @param bath out — how strongly this point is lit by the flame around
         *             it, for the single-scatter term.
         */
        float flameSample(vec3 p, out float heat, out float bath) {
          heat = 0.0;
          bath = 0.0;

          vec3 rel = p - vCenter;
          float ax = dot(rel, vTangent);
          vec3 perp = rel - vTangent * ax;

          float s = vS + ax;                                  // metres from the tail
          float u = clamp(s / max(uStreamLength, 0.01), 0.0, 1.0);
          float age = 1.0 - u;

          // Billowing wake behind a fireball at the nose.
          float radius = uRadius * flameProfile(u)
                       * (1.0 + (uHeadSize - 1.0) * smoothstep(0.62, 1.0, u));

          // A local frame whose "up" is world up (projected off the tangent), so
          // buoyancy, the teardrop stretch and the vertical elongation of the
          // noise all pull in the direction gravity actually cares about.
          vec3 upAxis = vec3(0.0, 1.0, 0.0) - vTangent * vTangent.y;
          float upLen = length(upAxis);
          upAxis = upLen > 1e-3 ? upAxis / upLen : vec3(1.0, 0.0, 0.0);
          vec3 sideAxis = cross(vTangent, upAxis);

          float py = dot(perp, upAxis);
          float px = dot(perp, sideAxis);

          // Buoyant stretch: mostly upward, so the cross-section is a teardrop
          // rather than a symmetric tube. The underside gets a quarter of it —
          // enough that the flame drapes instead of ending on a flat horizontal
          // cut, which is what an unstretched underside reads as.
          float plume = max(uPlume, 0.05);
          float shapedY = py > 0.0 ? py / plume : py / (1.0 + (plume - 1.0) * 0.25);
          float rad = length(vec2(px, shapedY));

          // Fold the axial overshoot past either end into the radius: a capsule,
          // so the stream ends in round caps instead of being sliced flat.
          float over = s - clamp(s, 0.0, uStreamLength);
          rad = sqrt(rad * rad + over * over);

          // Conservative reject *before* paying for any noise: even with the
          // bulge pushed fully outward the field cannot reach past this. Most
          // samples along most rays land here, so this test is what pays for the
          // headroom the hull needs.
          float qNominal = rad / max(radius, 1e-3);
          if (qNominal > REACH_HI * (1.0 + uBulge)) return 0.0;

          float sFlow = s - uTime * uFlow;                    // streams backwards

          // ---- 1. silhouette: metre-scale lobes -------------------------
          // One octave, wavelength of order the flame's own width. A fireball's
          // outline is dominated by lobes this size; turbulence at flame-detail
          // frequency can only nibble the edge of a capsule and the result still
          // reads as a shaded tube.
          float lobe = vnoise(vec3(px, py * 0.8, sFlow * 0.7) * uBulgeScale
                              + vec3(uSeed, uTime * 0.25, 0.0)) * 2.0 - 1.0;
          radius *= 1.0 + uBulge * lobe;

          float q = rad / max(radius, 1e-3);
          float edge = 1.0 - q;
          if (edge < -1.2) return 0.0;

          // ---- 2. vortex roll-up ----------------------------------------
          // Noise domain attached to the stream (a local frame around the axis)
          // so the fire is carried along instead of swimming through the world.
          vec2 rp = rot2(s * uSwirl * 0.3 + uTime * uSwirlSpeed + uSeed) * vec2(px, py);

          // Hot gas sheds ring vortices that travel back down the wake and grow
          // as they age. Rotating the domain in the (streamwise, vertical) plane
          // by that travelling wave folds the field over on itself — this is what
          // produces curling, mushrooming billows. Plain fbm, at any octave
          // count, makes clouds; it never makes curls. The rotation is strongest
          // on the axis and dies off outside the tube, so the fringe is sheared
          // past the core rather than rotating rigidly with it.
          float phase = s * uRingFreq - uTime * uRingSpeed + uSeed;
          float roll = uVortex * sin(phase * 6.2831853)
                     * smoothstep(0.0, 0.32, age) * exp(-q * q * 0.7);
          vec2 rolled = rot2(roll) * vec2(sFlow * uStreamStretch, rp.y * uTongue);

          // ---- 3. turbulence --------------------------------------------
          // Anisotropic on purpose: a lower frequency vertically and along the
          // flow draws every structure out into a tall, streamwise tongue.
          vec3 np = vec3(rp.x, rolled.y, rolled.x) * uNoiseFrequency;
          np.y -= uTime * uBuoyancy;                          // hot gas climbs

          // Radial shear. Gas at the fringe is unconfined and has been climbing
          // and falling behind for longer than gas on the axis, so the domain is
          // dragged upward and backward in proportion to how far out it sits.
          // This is what turns rounded blobs into the tongues that lick up off a
          // flame's edge: without a shear the structures are the same shape
          // everywhere and only their size changes.
          np.y -= uLick * q * q;
          np.z += uLick * 0.45 * q * q;

          float ridge, coarse;
          float n = flameFbm(np, uTime * uBuoyancy * 0.06, ridge, coarse) * 2.0 - 1.0;
          coarse = coarse * 2.0 - 1.0;

          // Filaments belong to the fringe. In the body they only mottle a core
          // that should read as one continuous sheet of burning gas.
          //
          // Note the sign: the ridge peaks *on* an iso-line of the noise, so
          // adding it thickens the iso-lines and the flame ends up drawn in
          // bright closed loops, like a contour map. Subtracting it instead
          // deepens the gaps between lobes, which is what actually separates the
          // fringe into strands.
          float fringe = smoothstep(0.3, 1.05, q);
          float turbulent = n * 0.75 + (0.5 - ridge) * uWisp * fringe;

          // ---- 4. shred --------------------------------------------------
          // The heart of the flame is barely touched by the noise while the
          // fringe is torn apart by it. That contrast — solid burning core, an
          // edge dissolving into wisps — is most of what reads as "fire".
          //
          // The falloff past REACH_LO is not cosmetic: it is what bounds how far
          // outside the nominal tube the noise can push density. Without it the
          // volume reaches well past the proxy hull and the flame is sliced off
          // along a visibly straight edge.
          // The coherent burning core belongs to the head. By the far end of the
          // wake the gas has been churning for the whole flight and there is no
          // quiet axis left, so the erosion floor climbs with age.
          float shred = mix(mix(0.26, 1.0, age), 1.8 * uShred, smoothstep(0.06, 1.05, q))
                      * (1.0 - smoothstep(REACH_LO, REACH_HI, q));
          // Turbulence is *fully developed* in the wake and still growing at the
          // head: the gas at the far end has had the whole flight to break up.
          // Without this the tail is the smoothest part of the volume, and a
          // smooth field marched with a hard density threshold renders its own
          // iso-surfaces as concentric shells — the flame ends up wearing
          // contour rings exactly where it should look most chaotic.
          float erosion = uNoiseStrength * shred * (1.0 + 1.3 * age);
          float field = edge + turbulent * erosion;
          field -= uDetachment * age * 0.55;                  // the tail tears into puffs

          // Temperature gets its own, deliberately blunter field, and the reason
          // is the single least obvious thing in this shader.
          //
          // Radiated power goes as a high power of temperature, so whatever
          // drives the temperature gets its contrast multiplied several-fold on
          // screen. Drive it from the full density field and that amplification
          // lands on the level sets of turbulent noise — which are nested closed
          // loops — and the flame comes out looking like polished agate: dense
          // parallel contour lines wrapping every blob. It is unmistakable once
          // seen and impossible to tune away from the colour end.
          //
          // So the contrast is carried by the capsule falloff, i.e. geometry: hot on the
          // axis, cooling outward, no level sets of its own. The noise only
          // *displaces* that profile — enough that a tongue stays hot along its
          // spine, not enough to draw itself. And it is the two coarsest octaves
          // that do the displacing, since a reaction zone is thick compared with
          // the smallest turbulent scales.
          // Deliberately not the age-amplified erosion the density uses: letting
          // the wake's extra churn into the temperature brings the agate straight
          // back, and only in the tail, which is the last place it is wanted.
          float heatField = edge + coarse * uHeatFollow * uNoiseStrength * shred
                          - uDetachment * age * 0.55;

          float d = smoothstep(0.0, clamp(uSoftness, 0.05, 1.0), field);
          if (d <= 0.0) return 0.0;

          d *= smoothstep(0.0, max(uTailFade, 0.01), u);
          d *= 1.0 - smoothstep(1.0 - uHeadFade, 1.0, u) * step(0.001, uHeadFade);

          // ---- temperature ------------------------------------------------
          // Follows the *perturbed* shape rather than the distance to the axis, so
          // a tongue the large eddies pushed outward stays hot along its own spine

  uniform float uWidthFade;

  uniform float uFlareWidth;

  uniform float uThrobScale;
  uniform float uThrobSpeed;
  uniform float uWander;
  uniform float uWanderScale;

  uniform float uMouthLength;

  uniform float uTipLength;

  uniform float uCoils;
  uniform float uCoilTurns;
  uniform float uCoilSpeed;
  uniform float uCoilRadius;
  uniform float uCoilFlare;
  uniform float uCoilWidth;
  uniform float uCoilWidthTip;

  #elif BEAM_PASS == 3
    varying float vSide;
  #elif BEAM_PASS == 4

  /* glsl */

  /** Half-width of the column at t, metres. */
  float beamRadius(float t) {

    float r = mix(uRadiusNear, uRadius, pow(u, max(uRadiusCurve, 0.01)));
    // Pressure waves travelling out along it. Small — this is the beam
    // breathing, not a sausage.
    r *= 1.0 + uThrob * sin((u * uThrobScale - uTime * uThrobSpeed) * TAU);

    r *= 1.0 + uFlare * smoothstep(1.0 - max(uFlareWidth, 1e-3), 1.0, u);
    return max(r * uRadiusScale * uWidthFade, 1e-4);
  }

  /** The column's local frame. n1/n2 span the plane across it. */
  void beamFrame(out vec3 dir, out vec3 n1, out vec3 n2) {
    vec3 delta = uTarget - uOrigin;
    float span = max(length(delta), 0.01);
    dir = delta / span;

    // approximately perpendicular to it.

   * bolt's charm is that its noise is piecewise-linear and keeps its corners,

  vec3 beamAxis(float t, vec3 n1, vec3 n2) {

    float ends = sin(clamp(t, 0.0, 1.0) * PI);
    float dx = snoise(vec3(t * uWanderScale, uTime * uWanderSpeed, uSeed));

    #endif

      float a = position.y;
      float angle = a * TAU;
      vec3 nrm = n1 * cos(angle) + n2 * sin(angle);

      // Break the barrel up so it is a gas column and not a machined pipe. The
      // noise crawls downrange with the flow rather than sitting still on it.
      float rip = snoise(vec3(
        cos(angle) * uRippleBands,
        sin(angle) * uRippleBands,
        t * uRippleScale - uTime * uRippleSpeed + uSeed

      vA = a;

      // are built out of this one number.

  }

  /** Where a shard stands, at the live footprint settings. */
  _spikePosition(record, c, out) {

    } else if (record.role === Role.CORE) {

    }
  }

// src/core/App.js
var HDR_URL = "https://cdn.jsdelivr.net/gh/achrefelouafi/LinearAbiltyCastingThreeJS@main/public/hdri/spruit_sunrise.hdr";
var App = class {
  constructor(canvas2) {
    this.canvas = canvas2;
    this.time = new Time();
    this.elapsed = 0;
    this.paused = false;
    this._raf = 0;
    this.cooldowns = new Map(ELEMENTS.map((element) => [element, 0]));
    this.renderer = new Renderer(canvas2);
    this.rig = new CameraRig(canvas2);
    this.camera = this.rig.camera;
    this.environment = new Environment(this.renderer, this.camera);
    this.scene = this.environment.scene;
    this.ground = new Ground(this.environment);
    this.dust = new DustMotes();
    this.contactShadows = new ContactShadows(this.renderer, { size: 2.6, height: 2.4, blur: 2 });
    this.scene.add(this.ground.mesh, this.dust.points, this.contactShadows.group);
    this.dust.setPixelRatio(this.renderer.gl.getPixelRatio());
    this.particles = new ParticleEngine(this.scene);
    this.lights = new LightPool(this.scene);
    this.decals = new DecalSystem(this.scene);
    this.fissures = new FissureSystem(this.scene);
    this.bursts = new BurstSystem(this.scene);
    this.shake = new CameraShake(this.rig);
    this.flash = new ScreenFlash();
    this.abilities = new AbilityManager({
      scene: this.scene,
      camera: this.camera,
      environment: this.environment,
      particles: this.particles,
      lights: this.lights,
      decals: this.decals,
      fissures: this.fissures,
      bursts: this.bursts,
      shake: this.shake,
      flash: this.flash
    });
    this.character = new CharacterController(this.environment);
    this.scene.add(this.character.root);
    this.input = new InputManager(canvas2);
    this.aim = new AimController(this.camera);
    this.scene.add(this.aim.object3D);
    this.post = new PostProcessing(this.renderer, this.scene, this.camera);
    this.loading = new LoadingScreen();
    this.hud = new HUD(document.getElementById("hud"));
    this.editor = new Editor({
      onClear: () => this.clearEffects(),
      onToast: (message) => this.hud.showToast(message)
    });
    this._bindEvents();
    this.selectAbility(ELEMENTS[0], { silent: true });
    this._focusPoint = new Vector330();
  }
  /** The ability currently in the slot. */
  get element() {
    return this.abilities.selected;
  }
  /* ------------------------------------------------------------------ */
  _bindEvents() {
    this.renderer.onResize((width, height, pixelRatio) => {
      this.rig.resize(width, height);
      this.post.setSize(width, height, pixelRatio);
      this.dust.setPixelRatio(pixelRatio);
    });
    this.input.on("pointer:move", (pointer) => this.aim.point(pointer));
    this.input.on("pointer:confirm", (pointer) => {
      this.aim.point(pointer);
      this.aim.confirm();
    });
    this.input.on("action", (action, slot) => this._handleAction(action, slot));
    this.aim.on("cast", (origin, direction, distance) => this._cast(origin, direction, distance));
    this.aim.on("reject", () => this.hud.showToast("太近了 — 请瞄准更远处"));
    this.hud.onAbility = (element) => this.armAbility(element);
  }
  _handleAction(action, slot) {
    switch (action) {
      case "ability": {
        const element = ELEMENTS[slot] ?? this.element;
        if (this.aim.isArmed && element === this.element) this.aim.cancel();
        else this.armAbility(element);
        break;
      }
      case "cancel":
        this.aim.cancel();
        break;
      case "toggleHelp":
        this.hud.toggleHelp();
        break;
      case "toggleEditor":
        this.editor.toggle();
        break;
      case "clear":
        this.clearEffects();
        this.hud.showToast("特效已清除");
        break;
      case "togglePause":
        this.paused = !this.paused;
        this.hud.setPaused(this.paused);
        this.hud.showToast(this.paused ? "已暂停 — 编辑器仍可调整" : "已继续");
        break;
      default:
        break;
    }
  }
  /**
   * Put an ability in the slot. The aim indicator and the HUD both follow,
   * because `range` and `minRange` are the ability's, not the app's.
   */
  selectAbility(element, options = {}) {
    if (!ELEMENTS.includes(element)) return;
    this.abilities.select(element);
    this.aim.setElement(element);
    this.hud.setElement(element, options);
  }
  /** Select an ability and arm it, unless it is still cooling down. */
  armAbility(element = this.element) {
    if ((this.cooldowns.get(element) ?? 0) > 0) {
      this.hud.showToast("技能尚未冷却完毕");
      return;
    }
    if (element !== this.element) this.selectAbility(element);
    this.aim.arm();
  }
  _cast(origin, direction, distance) {
    const element = this.element;
    this.abilities.cast(origin, direction, distance, element);
    this.cooldowns.set(element, Math.max(0, settings[element].cooldown));
    this.character.setFacing(this.aim.facing);
    this.character.playCast(settings[element].castAnim);
    this.character.castLunge();
  }
  clearEffects() {
    this.aim.cancel();
    this.abilities.clear();
    this.particles.reset();
    this.decals.clear();
    this.fissures.clear();
    this.bursts.clear();
    this.lights.reset();
    this.shake.reset();
    this.flash.reset();
  }
  /* ------------------------------------------------------------------ */
  /** Load assets, warm the shader cache, then start the loop. */
  async load() {
    const assets = new AssetLoader();
    this.loading.setProgress(0.05, "正在加载环境…");
    const hdr = await assets.loadHDR(HDR_URL);
    await this.environment.loadEnvironment(hdr);
    frame.uEnvMap.value = this.environment.equirect;
    this.loading.setProgress(0.35, "正在加载地面…");
    await this.ground.loadTextures(assets);
    this.loading.setProgress(0.5, "正在加载角色…");
    await this.character.load(assets);
    this.loading.setProgress(0.85, "正在编译着色器…");
    await this.renderer.gl.compileAsync(this.scene, this.camera);
    this.loading.setProgress(1, "准备就绪");
    this.loading.hide();
    this.start();
  }
  start() {
    this.time.reset();
    const loop = () => {
      this._raf = requestAnimationFrame(loop);
      this.frame();
    };
    this._raf = requestAnimationFrame(loop);
  }
  stop() {
    cancelAnimationFrame(this._raf);
  }
  /* ------------------------------------------------------------------ */
  frame() {
    const gl = this.renderer.gl;
    gl.info.reset();
    const raw = this.time.tick();
    const dt = this.paused ? 0 : raw * settings.global.timeScale;
    this.elapsed += dt;
    frame.uTime.value = this.elapsed;
    frame.uDelta.value = dt;
    frame.uShaderIntensity.value = settings.global.shaderIntensity;
    frame.uGlobalGlow.value = settings.global.glow;
    frame.uCameraNear.value = this.camera.near;
    frame.uCameraFar.value = this.camera.far;
    this.renderer.syncSettings();
    this.environment.setFocus(this.character.position.x, this.character.position.z);
    this.environment.update();
    this.aim.setOrigin(this.character.position);
    this.aim.update(raw);
    if (settings.character.turnToAim && this.aim.isArmed) {
      this.character.turnToward(this.aim.facing, settings.character.turnRate, raw);
    }
    this.character.update(dt);
    for (const [element, remaining] of this.cooldowns) {
      if (remaining > 0) this.cooldowns.set(element, Math.max(0, remaining - raw));
    }
    this.ground.update(this.elapsed);
    this.dust.update(this.elapsed, this.character.position);
    this.abilities.update(dt);
    this.particles.flush();
    this.decals.update(dt);
    this.fissures.update(dt);
    this.bursts.update(dt);
    this.lights.update(dt);
    const focus = this.abilities.focus;
    if (focus) this.rig.lookAt(focus.position, MathUtils6.clamp(1 - focus.u * 0.4, 0, 1));
    this.rig.setAnchor(this.character.position.x, 0, this.character.position.z);
    this.shake.update(raw);
    this.flash.update(raw);
    this.rig.update(raw);
    this.contactShadows.setPosition(this.character.position.x, this.character.position.z);
    this.contactShadows.render(this.scene);
    gl.shadowMap.needsUpdate = true;
    this.post.sync(this.elapsed, this.flash);
    this.post.render();
    for (const element of ELEMENTS) {
      this.hud.setCooldown(element, this.cooldowns.get(element) ?? 0, settings[element].cooldown);
    }
    this.hud.setArmed(this.aim.isArmed);
    this.hud.update(raw, () => ({
      particles: this.particles.countLive(this.elapsed),
      calls: gl.info.render.calls,
      spikes: this.abilities.active.reduce((total, ability) => total + ability.instanceCount, 0),
      abilities: this.abilities.active.length
    }));
  }
  /* ------------------------------------------------------------------ */
  dispose() {
    this.stop();
    this.input.dispose();
    this.aim.dispose();
    this.abilities.dispose();
    this.particles.dispose();
    this.decals.dispose();
    this.fissures.dispose();
    this.bursts.dispose();
    this.lights.dispose();
    this.character.dispose();
    this.ground.dispose();
    this.dust.dispose();
    this.contactShadows.dispose();
    this.post.dispose();
    this.environment.dispose();
    this.editor.dispose();
    this.rig.dispose();
    this.renderer.dispose();
  }
};

var canvas = document.getElementById("viewport");
async function boot() {
  try {
    const app = new App(canvas);
    await app.load();
    window.app = app;
  } catch (error) {
    console.error("[boot] failed to start", error);
    new LoadingScreen().fail(
      error?.message ? `启动失败：${error.message}` : "启动失败，请查看控制台。"
    );
  }
}
boot();

  window.THREE = THREE;
