<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>46.风格化上下海洋</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #container, canvas { width: 100%; height: 100%; display: block; }
    body { overflow: hidden; background: #020305; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
      "@petamoriken/float16": "https://cdn.jsdelivr.net/npm/@petamoriken/float16@3.9.2/browser/float16.mjs",
      "astronomy-engine": "https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/esm/astronomy.js",
      "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js",
      "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.37.4/build/index.js",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/build/index.module.js",
      "three-stdlib": "../assets/awesome/runtime/exr-loader.js"
    }
  }
  </script>
</head>
<body>
  <div id="container"><canvas id="view"></canvas></div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GUI } from "three/addons/libs/lil-gui.module.min.js";
    import Stats from "three/addons/libs/stats.module.js";

        import { SpectralOceanSystem } from "../assets/awesome/skills/threejs-spectral-ocean/examples/spectral-cascade-ocean/ocean-system.js";
    
    import { validateFragmentIFFT } from "../assets/awesome/skills/threejs-spectral-ocean/examples/spectral-cascade-ocean/fft-pipeline.js";
    
    import {
    
      createStylizedOceanSkyMaterial,
    
      createStylizedOceanSurfaceMaterial,
    
      createStylizedSeaFloorMaterial,
    
      createStylizedUnderwaterCompositeMaterial,
    
      stylizedAboveBelowOceanAssetPaths,
    
      stylizedOceanDebugModes,
    
      updateStylizedOceanMaterials,
    
    } from "../assets/awesome/skills/threejs-spectral-ocean/examples/stylized-above-below-ocean/stylized-ocean-material.js";
    
    
    
    const ABOVE_CAMERA = new THREE.Vector3(0, 40, 200);
    
    const ABOVE_TARGET = new THREE.Vector3(0, 0, 0);
    
    const UNDERWATER_CAMERA = new THREE.Vector3(0, -18, 76);
    
    const UNDERWATER_TARGET = new THREE.Vector3(0, -30, -8);
    
    
    
    function applyCameraView(camera, controls, mode) {
    
      if (mode === "above-surface") {
    
        camera.position.copy(ABOVE_CAMERA);
    
        controls?.target?.copy(ABOVE_TARGET);
    
      } else {
    
        camera.position.copy(UNDERWATER_CAMERA);
    
        controls?.target?.copy(UNDERWATER_TARGET);
    
      }
    
      controls?.update?.();
    
    }
    
    
    
    async function loadEffectTexture(url, colorSpace = THREE.SRGBColorSpace) {
    
      const texture = await new THREE.TextureLoader().loadAsync(url);
    
      texture.wrapS = THREE.RepeatWrapping;
    
      texture.wrapT = THREE.RepeatWrapping;
    
      texture.colorSpace = colorSpace;
    
      texture.anisotropy = 8;
    
      return texture;
    
    }
    
    
    
    const sceneModule = {
    
      initialTime: 22,
    
      renderer: {
    
        options: { antialias: true },
    
        toneMapping: 0,
    
        exposure: 1,
    
        clearColor: 0x064289,
    
      },
    
      camera: {
    
        fov: 50,
    
        near: 0.1,
    
        far: 10000,
    
        position: UNDERWATER_CAMERA.toArray(),
    
      },
    
      controls: {
    
        target: UNDERWATER_TARGET.toArray(),
    
        minDistance: 10,
    
        maxDistance: 200,
    
        enablePan: true,
    
      },
    
      async setup({ renderer, scene, camera, controls }) {
    
        const fftValidation = validateFragmentIFFT(renderer);
    
        if (!fftValidation.pass) {
    
          throw new Error(
    
            `IFFT validation failed: impulse=${fftValidation.impulseError}, ` +
    
            `frequency=${fftValidation.frequencyError}`,
    
          );
    
        }
    
    
    
        const sunDirection = new THREE.Vector3(-0.14, 0.13, -0.98).normalize();
    
        const sceneTarget = new THREE.WebGLRenderTarget(1, 1, {
    
          minFilter: THREE.LinearFilter,
    
          magFilter: THREE.LinearFilter,
    
          depthBuffer: true,
    
        });
    
        sceneTarget.depthTexture = new THREE.DepthTexture(1, 1);
    
        sceneTarget.depthTexture.type = THREE.UnsignedIntType;
    
    
    
        const options = {
    
          resolution: 256,
    
          patchLengths: [250, 64, 18],
    
          boundaryFactor: 6,
    
          gravity: 9.81,
    
          depth: 500,
    
          choppiness: 1.5,
    
          foamRecovery: 0.5,
    
          amplitude: 0.74,
    
          seed: 78243,
    
          local: {
    
            scale: 1,
    
            windSpeed: 15,
    
            directionDegrees: 63.435,
    
            fetchMeters: 90000,
    
            directionality: 1,
    
            swell: 0.24,
    
            peakEnhancement: 3.3,
    
            shortWaveFade: 0.018,
    
          },
    
          swell: {
    
            scale: 0.62,
    
            windSpeed: 4,
    
            directionDegrees: 63.435,
    
            fetchMeters: 280000,
    
            directionality: 1,
    
            swell: 1,
    
            peakEnhancement: 3.3,
    
            shortWaveFade: 0.012,
    
          },
    
        };
    
        const ocean = new SpectralOceanSystem(renderer, options);
    
        const [foamTexture, sandTexture] = await Promise.all([
    
          loadEffectTexture(stylizedAboveBelowOceanAssetPaths.foam, THREE.NoColorSpace),
    
          loadEffectTexture(stylizedAboveBelowOceanAssetPaths.sand),
    
        ]);
    
    
    
        const skyMaterial = createStylizedOceanSkyMaterial({ sunDirection });
    
        const sky = new THREE.Mesh(new THREE.SphereGeometry(9000, 48, 24), skyMaterial);
    
        scene.add(sky);
    
    
    
        const seafloorMaterial = createStylizedSeaFloorMaterial({
    
          sandTexture,
    
          causticIntensity: 0.9,
    
        });
    
        const seafloor = new THREE.Mesh(
    
          new THREE.PlaneGeometry(4000, 4000, 1, 1),
    
          seafloorMaterial,
    
        );
    
        seafloor.rotation.x = -Math.PI / 2;
    
        seafloor.position.y = -50;
    
        scene.add(seafloor);
    
    
    
        const oceanMaterial = createStylizedOceanSurfaceMaterial(ocean.cascades, {
    
          patchLengths: options.patchLengths,
    
          sunDirection,
    
          foamTexture,
    
        });
    
        const waterGeometry = new THREE.PlaneGeometry(2000, 2000, 256, 256);
    
        waterGeometry.rotateX(-Math.PI / 2);
    
        const water = new THREE.Mesh(waterGeometry, oceanMaterial);
    
        water.frustumCulled = false;
    
        scene.add(water);
    
    
    
        const compositeMaterial = createStylizedUnderwaterCompositeMaterial({
    
          sceneColor: sceneTarget.texture,
    
          sceneDepth: sceneTarget.depthTexture,
    
          displacement: ocean.cascades[0].displacement,
    
          patchLength: options.patchLengths[0],
    
          scale: 1,
    
          waterClarity: 57,
    
        });
    
        const compositeScene = new THREE.Scene();
    
        const compositeCamera = new THREE.Camera();
    
        const composite = new THREE.Mesh(
    
          new THREE.PlaneGeometry(2, 2),
    
          compositeMaterial,
    
        );
    
        compositeScene.add(composite);
    
    
    
        let debugMode = "final";
    
        applyCameraView(camera, controls, "underwater");
    
    
    
        return {
    
          resize({ bufferWidth, bufferHeight }) {
    
            sceneTarget.setSize(bufferWidth, bufferHeight);
    
          },
    
          setDebugMode(mode) {
    
            debugMode = mode;
    
            if (mode === "above-surface" || mode === "underwater" || mode === "final") {
    
              applyCameraView(
    
                camera,
    
                controls,
    
                mode === "above-surface" ? "above-surface" : "underwater",
    
              );
    
            }
    
          },
    
          update({ elapsed, delta }) {
    
            const snappedX = Math.round(camera.position.x / 16) * 16;
    
            const snappedZ = Math.round(camera.position.z / 16) * 16;
    
            water.position.x = snappedX;
    
            water.position.z = snappedZ;
    
            seafloor.position.x = camera.position.x;
    
            seafloor.position.z = camera.position.z;
    
            sky.position.x = camera.position.x;
    
            sky.position.z = camera.position.z;
    
    
    
            if (camera.position.y < -49) camera.position.y = -49;
    
            if (camera.position.y > 200) camera.position.y = 200;
    
            if (controls?.target) {
    
              if (controls.target.y < -49) controls.target.y = -49;
    
              if (controls.target.y > 150) controls.target.y = 150;
    
            }
    
    
    
            ocean.update(elapsed, Math.max(delta, 1 / 120));
    
            updateStylizedOceanMaterials({
    
              oceanMaterial,
    
              seafloorMaterial,
    
              compositeMaterial,
    
              cascades: ocean.cascades,
    
              elapsed,
    
              camera,
    
              debugMode,
    
            });
    
          },
    
          render({ renderer, camera }) {
    
            if (debugMode === "cascade-bands" || debugMode === "normals" ||
    
              debugMode === "foam") {
    
              renderer.render(scene, camera);
    
              return;
    
            }
    
            renderer.setRenderTarget(sceneTarget);
    
            renderer.clear();
    
            renderer.render(scene, camera);
    
            renderer.setRenderTarget(null);
    
            renderer.render(compositeScene, compositeCamera);
    
          },
    
          metrics() {
    
            return {
    
              resolution: `${options.resolution}² x ${ocean.cascades.length}`,
    
              view: debugMode === "above-surface" ? "above surface" : "underwater",
    
              fftTest: `pass ${Math.max(
    
                fftValidation.impulseError,
    
                fftValidation.frequencyError,
    
              ).toExponential(1)}`,
    
            };
    
          },
    
          dispose() {
    
            sceneTarget.depthTexture.dispose();
    
            sceneTarget.dispose();
    
            sky.geometry.dispose();
    
            skyMaterial.dispose();
    
            seafloor.geometry.dispose();
    
            seafloorMaterial.dispose();
    
            waterGeometry.dispose();
    
            oceanMaterial.dispose();
    
            composite.geometry.dispose();
    
            compositeMaterial.dispose();
    
            foamTexture.dispose();
    
            sandTexture.dispose();
    
          },
    
        };
    
      },
    
    };

    if ((sceneModule.backend === "webgpu" || sceneModule.backend === "raw-webgpu") && !navigator.gpu) {
      throw new Error("WebGPU unavailable");
    }

    const canvas = document.querySelector("#view");
    const rawWebGpu = sceneModule.backend === "raw-webgpu";
    const rendererOptions = {
      canvas,
      antialias: true,
      powerPreference: "high-performance",
      ...(sceneModule.renderer?.options ?? {}),
    };
    const renderer = rawWebGpu
      ? null
      : sceneModule.backend === "webgpu"
        ? new THREE.WebGPURenderer(rendererOptions)
        : new THREE.WebGLRenderer(rendererOptions);

    if (typeof renderer?.init === "function") await renderer.init();
    if (renderer) {
      renderer.outputColorSpace = sceneModule.renderer?.outputColorSpace ?? THREE.SRGBColorSpace;
      renderer.toneMapping = sceneModule.renderer?.toneMapping ?? THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = sceneModule.renderer?.exposure ?? 1;
    }
    if (renderer && sceneModule.renderer?.clearColor != null) {
      renderer.setClearColor(sceneModule.renderer.clearColor, sceneModule.renderer.clearAlpha ?? 1);
    }

    const scene = new THREE.Scene();
    const cameraConfig = sceneModule.camera ?? {};
    const camera = cameraConfig.type === "orthographic"
      ? new THREE.OrthographicCamera(
          cameraConfig.left ?? -1,
          cameraConfig.right ?? 1,
          cameraConfig.top ?? 1,
          cameraConfig.bottom ?? -1,
          cameraConfig.near ?? 0,
          cameraConfig.far ?? 1,
        )
      : new THREE.PerspectiveCamera(
          cameraConfig.fov ?? 50,
          1,
          cameraConfig.near ?? 0.1,
          cameraConfig.far ?? 2000,
        );
    if (cameraConfig.position) camera.position.fromArray(cameraConfig.position);
    if (cameraConfig.up) camera.up.fromArray(cameraConfig.up);

    const controlsConfig = sceneModule.controls ?? {};
    const controls = controlsConfig.enabled === false || cameraConfig.type === "orthographic"
      ? null
      : new OrbitControls(camera, canvas);
    if (controls) {
      controls.enableDamping = controlsConfig.enableDamping ?? true;
      controls.dampingFactor = controlsConfig.dampingFactor ?? 0.08;
      controls.enablePan = controlsConfig.enablePan ?? true;
      controls.enableZoom = controlsConfig.enableZoom ?? true;
      controls.screenSpacePanning = controlsConfig.screenSpacePanning ?? true;
      controls.minDistance = controlsConfig.minDistance ?? 0;
      controls.maxDistance = controlsConfig.maxDistance ?? Infinity;
      controls.minPolarAngle = controlsConfig.minPolarAngle ?? 0;
      controls.maxPolarAngle = controlsConfig.maxPolarAngle ?? Math.PI;
      controls.minAzimuthAngle = controlsConfig.minAzimuthAngle ?? -Infinity;
      controls.maxAzimuthAngle = controlsConfig.maxAzimuthAngle ?? Infinity;
      controls.target.fromArray(controlsConfig.target ?? [0, 0, 0]);
      controls.update();
    }

    function resolveAsset(relativePath) {
      if (/^https?:\/\//.test(relativePath)) return relativePath;
      return new URL(relativePath, new URL("../assets/awesome/examples/threejs-spectral-ocean/stylized-above-below-ocean/", import.meta.url)).href;
    }

    const example = await sceneModule.setup({
      THREE,
      canvas,
      renderer,
      scene,
      camera,
      controls,
      resolveAsset,
    }) ?? {};

    const params = {
      paused: false,
      timeScale: 1,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      debugMode: "final",
    };
    if (renderer) renderer.setPixelRatio(params.dpr);
    example.setDebugMode?.(params.debugMode);

    const drawingBufferSize = renderer ? new THREE.Vector2() : null;
    function resize() {
      const width = Math.max(1, canvas.clientWidth);
      const height = Math.max(1, canvas.clientHeight);
      const bufferWidth = Math.round(width * params.dpr);
      const bufferHeight = Math.round(height * params.dpr);
      if (rawWebGpu) {
        example.resize?.({ width, height, bufferWidth, bufferHeight, dpr: params.dpr });
        if (camera.isPerspectiveCamera) {
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        }
        return;
      }
      renderer.getDrawingBufferSize(drawingBufferSize);
      if (drawingBufferSize.x === bufferWidth && drawingBufferSize.y === bufferHeight) return;
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(width, height, false);
      if (camera.isPerspectiveCamera) {
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }
      example.resize?.({ width, height, bufferWidth, bufferHeight, dpr: params.dpr });
    }

    const stats = new Stats();
    document.body.appendChild(stats.dom);
    const gui = new GUI({ title: "46.风格化上下海洋" });
    gui.add(params, "paused").name("暂停");
    gui.add(params, "timeScale", 0, 3, 0.05).name("时间缩放");
    gui.add(params, "dpr", 0.5, 2, 0.25).name("像素比").onChange(resize);
    gui.add(params, "debugMode", {
      "Final": "final",
      "Above surface": "above-surface",
      "Underwater": "underwater",
      "Cascade bands": "cascade-bands",
      "Normals": "normals",
      "Foam": "foam",
      "Depth fog": "depth-fog",
    }).name("调试").onChange((value) => example.setDebugMode?.(value));

    let elapsed = sceneModule.initialTime ?? 0;
    let previous = performance.now();
    let frameInProgress = false;
    resize();

    async function frame(now) {
      if (frameInProgress) return;
      frameInProgress = true;
      try {
        stats.update();
        resize();
        const rawDelta = Math.min((now - previous) / 1000, 0.1);
        previous = now;
        const delta = params.paused ? 0 : rawDelta * params.timeScale;
        elapsed += delta;
        controls?.update();
        await example.update?.({ delta, rawDelta, elapsed, state: params, camera, controls });
        if (example.render) {
          await example.render({ renderer, scene, camera, elapsed, delta, rawDelta, state: params });
        } else if (typeof renderer?.renderAsync === "function") {
          await renderer.renderAsync(scene, camera);
        } else if (renderer) {
          renderer.render(scene, camera);
        }
      } finally {
        frameInProgress = false;
      }
    }

    if (rawWebGpu) {
      let rawAnimationFrame = 0;
      let rawLoopStopped = false;
      const rawLoop = async (now) => {
        await frame(now);
        if (!rawLoopStopped) rawAnimationFrame = requestAnimationFrame(rawLoop);
      };
      rawAnimationFrame = requestAnimationFrame(rawLoop);
      window.addEventListener("pagehide", () => {
        rawLoopStopped = true;
        cancelAnimationFrame(rawAnimationFrame);
        gui.destroy();
        stats.dom.remove();
        controls?.dispose();
        example.dispose?.();
      }, { once: true });
    } else {
      renderer.setAnimationLoop(frame);
      window.addEventListener("pagehide", () => {
        renderer.setAnimationLoop(null);
        gui.destroy();
        stats.dom.remove();
        controls?.dispose();
        example.dispose?.();
        renderer.dispose();
      }, { once: true });
    }
  </script>
</body>
</html>
