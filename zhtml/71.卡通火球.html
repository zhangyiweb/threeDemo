<!--
 * Toon Fireball — https://codepen.io/pizza3/pen/Rwoqemx
 * 卡通火球：噪声着色器球体 + 双层蒸汽圆柱拖尾，UnrealBloom 辉光
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>71.卡通火球</title>
</head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; }
  html, body { width: 100%; height: 100%; background: #000; font-family: "Helvetica Neue", Arial, sans-serif; }
  #world { width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; }
  .hint {
    position: fixed; left: 16px; bottom: 16px; z-index: 9;
    color: rgba(255, 255, 255, 0.72); font-size: 13px;
    pointer-events: none; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
  }
</style>
<body>
  <div id="world"></div>
  <div class="hint">拖拽旋转 · 滚轮缩放 · 右侧 GUI 调色 / Bloom</div>
</body>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
    }
  }
</script>
<script type="module">
  import * as THREE from "three";
  import Stats from "three/addons/libs/stats.module.js";
  import { GUI } from "three/addons/libs/lil-gui.module.min.js";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";
  import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
  import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
  import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

  const ASSET = "https://raw.githubusercontent.com/pizza3/asset/master";

  const vert = `
    varying vec3 vNormal;
    varying vec3 camPos;
    varying vec2 vUv;

    void main() {
    vNormal = normal;
    vUv = uv;
    camPos = cameraPosition;
    gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
    }
`;

  const frag = `
#define NUM_OCTAVES 5
#define M_PI 3.1415926535897932384626433832795
uniform vec4 resolution;
varying vec3 vNormal;
uniform sampler2D perlinnoise;
uniform sampler2D sparknoise;
uniform float time;
uniform vec3 color0;
uniform vec3 color1;
uniform vec3 color2;
uniform vec3 color3;
uniform vec3 color4;
uniform vec3 color5;
varying vec3 camPos;
varying vec2 vUv;

float setOpacity(float r, float g, float b, float tonethreshold) {
  float tone = (r + g + b) / 3.0;
  float alpha = 1.0;
  if(tone<tonethreshold) {
    alpha = 0.0;
  }
  return alpha;
}

vec3 rgbcol(vec3 col) {
  return vec3(col.r/255.0,col.g/255.0,col.b/255.0);
}

vec2 rotate(vec2 v, float a) {
  float s = sin(a);
  float c = cos(a);
  mat2 m = mat2(c, -s, s, c);
  return m * v;
}

vec2 UnityPolarCoordinates (vec2 UV, vec2 Center, float RadialScale, float LengthScale){
  vec2 delta = UV - Center;
  float radius = length(delta) * 2. * RadialScale;
  float angle = atan(delta.x, delta.y) * 1.0/6.28 * LengthScale;
  return vec2(radius, angle);
}

void main() {
  vec2 olduv = gl_FragCoord.xy/resolution.xy ;
  vec2 uv = vUv ;
  vec2 imguv = uv;
  float scale = 1.;
  olduv *= 0.5 + time;
  olduv.y = olduv.y ;
  vec2 p = olduv*scale;
  vec4 txt = texture2D(perlinnoise, olduv);
  float gradient = dot(normalize( -camPos ), normalize( vNormal ));
  float pct = distance(vUv,vec2(0.5));

  vec3 rgbcolor0 = rgbcol(color0);
  vec3 rgbcolor1 = rgbcol(color1);
  vec3 rgbcolor2 = rgbcol(color2);
  vec3 rgbcolor5 = rgbcol(color5);

  float y = smoothstep(0.16,0.525,pct);
  vec3 backcolor = mix(rgbcolor0, rgbcolor5, y);

  gl_FragColor = vec4(backcolor,1.);

  vec2 center = vec2(0.5);
  vec2 cor = UnityPolarCoordinates(vec2(vUv.x,vUv.y), center, 1., 1.);

  vec2 newUv = vec2(cor.x + time,cor.x*0.2+cor.y);
  vec3 noisetex = texture2D(perlinnoise,mod(newUv,1.)).rgb;
  vec3 noisetex2 = texture2D(sparknoise,mod(newUv,1.)).rgb;

  float tone0 =  1. - smoothstep(0.3,0.6,noisetex.r);
  float tone1 =  smoothstep(0.3,0.6,noisetex2.r);

  float opacity0 = setOpacity(tone0,tone0,tone0,.29);
  float opacity1 = setOpacity(tone1,tone1,tone1,.49);

  if(opacity1>0.0){
    gl_FragColor = vec4(rgbcolor2,0.)*vec4(opacity1);
  } else if(opacity0>0.0){
    gl_FragColor = vec4(rgbcolor1,0.)*vec4(opacity0);
  }
}
`;

  const vertcylinder = `
    varying vec2 vUv;

    void main() {
        vUv = uv;
        vec3 pos = vec3(position.x/1.,position.y,position.z/1.);
        if(pos.y >= 1.87){
            pos = vec3(position.x*(sin((position.y - 0.6)*1.27)-0.16),position.y,position.z*(sin((position.y - 0.6)*1.27)-0.16));
        } else{
            pos = vec3(position.x*(sin((position.y/2. -  .01)*.11)+0.75),position.y,position.z*(sin((position.y/2. -  .01)*.11)+0.75));
        }
        gl_Position = projectionMatrix * modelViewMatrix * vec4( pos, 1.0 );
    }
`;

  const fragcylinder = `
    varying vec2 vUv;
    uniform sampler2D perlinnoise;
    uniform vec3 color4;
    uniform float time;
    varying vec3 vNormal;

    vec3 rgbcol(vec3 col) {
        return vec3(col.r/255.0,col.g/255.0,col.b/255.0);
    }

    void main() {
        vec3 noisetex = texture2D(perlinnoise,mod(1.*vec2(vUv.y-time*2.,vUv.x + time*1.),1.)).rgb;
        gl_FragColor = vec4(noisetex.r);

        if(gl_FragColor.r >= 0.5){
            gl_FragColor = vec4(rgbcol(color4),gl_FragColor.r);
        }else{
            gl_FragColor = vec4(0.);
        }
        gl_FragColor *= vec4(sin(vUv.y) - 0.1);
        gl_FragColor *= vec4(smoothstep(0.3,0.628,vUv.y));
    }
`;

  const vertflame = `
    varying vec2 vUv;
    varying vec3 camPos;
    varying vec3 vNormal;
    varying vec3 nois;
    uniform sampler2D noise;
    uniform float time;

    void main() {
        vUv = uv;
        camPos = cameraPosition;
        vNormal = normal;
        vec3 pos = vec3(position.x/1.,position.y,position.z/1.);
        vec3 noisetex = texture2D(noise,mod(1.*vec2(vUv.y-time*2.,vUv.x + time*1.),1.)).rgb;
        if(pos.y >= 1.87){
            pos = vec3(position.x*(sin((position.y - 0.64)*1.27)-0.12),position.y,position.z*(sin((position.y - 0.64)*1.27)-0.12));
        } else{
            pos = vec3(position.x*(sin((position.y/2. -  .01)*.11)+0.79),position.y,position.z*(sin((position.y/2. -  .01)*.11)+0.79));
        }
        pos.xz *= noisetex.r;
        gl_Position = projectionMatrix * modelViewMatrix * vec4( pos, 1.0 );
    }
`;

  const fragflame = `
    varying vec2 vUv;
    uniform sampler2D perlinnoise;
    uniform sampler2D noise;
    uniform vec3 color4;
    uniform float time;
    varying vec3 camPos;
    varying vec3 vNormal;
    varying vec3 nois;

    vec3 rgbcol(vec3 col) {
        return vec3(col.r/255.0,col.g/255.0,col.b/255.0);
    }

    void main() {
        vec3 noisetex = texture2D(noise,mod(1.*vec2(vUv.y-time*2.,vUv.x + time*1.),1.)).rgb;
        gl_FragColor = vec4(noisetex.r);

        if(gl_FragColor.r >= 0.44){
            gl_FragColor = vec4(rgbcol(color4),gl_FragColor.r);
        } else{
            gl_FragColor = vec4(0.);
        }
        gl_FragColor *= vec4(smoothstep(0.2,0.628,vUv.y));
    }
`;

  const options = {
    bloomStrength: 3.5,
    bloomRadius: 0.39,
    color0: [0, 0, 0],
    color1: [81, 14, 5],
    color2: [181, 156, 24],
    color3: [66, 66, 66],
    color4: [79, 79, 79],
    color5: [64, 27, 0],
  };

  function loadNoise(url) {
    const tex = new THREE.TextureLoader().load(url);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.colorSpace = THREE.NoColorSpace;
    return tex;
  }

  let scene, camera, renderer, controls, stats;
  let material, material2, material3, bloomPass, bloomComposer;
  let width = window.innerWidth;
  let height = window.innerHeight;

  const gui = new GUI();
  const bloom = gui.addFolder("Bloom");
  bloom.add(options, "bloomStrength", 0.0, 5.0).name("bloomStrength").listen();
  bloom.add(options, "bloomRadius", 0.1, 2.0).name("bloomRadius").listen();
  bloom.open();
  const color = gui.addFolder("Colors");
  color.addColor(options, "color0").name("ball0");
  color.addColor(options, "color1").name("ball1");
  color.addColor(options, "color2").name("ball2");
  color.addColor(options, "color4").name("steam");
  color.addColor(options, "color5").name("trail");
  color.open();
  gui.close();

  function createScene() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
    camera.position.set(3.437, 3.524, 2.995);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setClearColor(new THREE.Color("#000"));
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(width, height);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById("world").appendChild(renderer.domElement);
    controls = new OrbitControls(camera, renderer.domElement);
    stats = new Stats();
    document.body.appendChild(stats.dom);
  }

  function postProc() {
    const renderScene = new RenderPass(scene, camera);
    // UnrealBloomPass 的最后一个参数是 threshold（亮度阈值）。
    // 这里把 threshold 调低，避免在 r185 + 颜色空间下高阈值导致“看不到辉光”。
    bloomPass = new UnrealBloomPass(new THREE.Vector2(width, height), 1.5, 0.4, 0.0);
    bloomPass.strength = options.bloomStrength;
    bloomPass.radius = options.bloomRadius;
    // 确保 composer 最终把 bloom 的结果输出到屏幕。
    bloomPass.renderToScreen = true;
    bloomComposer = new EffectComposer(renderer);
    bloomComposer.addPass(renderScene);
    bloomComposer.addPass(bloomPass);
  }

  function mesh() {
    const geometry = new THREE.SphereGeometry(1, 30, 30);
    material = new THREE.ShaderMaterial({
      uniforms: {
        time: { value: 0.0 },
        perlinnoise: { value: loadNoise(`${ASSET}/noise9.jpg`) },
        sparknoise: { value: loadNoise(`${ASSET}/sparklenoise.jpg`) },
        color5: { value: new THREE.Vector3(...options.color5) },
        color4: { value: new THREE.Vector3(...options.color4) },
        color3: { value: new THREE.Vector3(...options.color3) },
        color2: { value: new THREE.Vector3(...options.color2) },
        color1: { value: new THREE.Vector3(...options.color1) },
        color0: { value: new THREE.Vector3(...options.color0) },
        resolution: { value: new THREE.Vector2(width, height) },
      },
      vertexShader: vert,
      fragmentShader: frag,
    });
    const ball = new THREE.Mesh(geometry, material);
    ball.scale.set(0.78, 0.78, 0.78);
    ball.position.set(1, 0, 0);
    scene.add(ball);
  }

  function cylinder() {
    const geometry = new THREE.CylinderGeometry(1.11, 0, 5.3, 50, 50, true);
    material2 = new THREE.ShaderMaterial({
      uniforms: {
        perlinnoise: { value: loadNoise(`${ASSET}/water-min.jpg`) },
        color4: { value: new THREE.Vector3(...options.color4) },
        time: { value: 0.0 },
        noise: { value: loadNoise(`${ASSET}/noise9.jpg`) },
      },
      vertexShader: vertcylinder,
      fragmentShader: fragcylinder,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
    });
    const meshCyl = new THREE.Mesh(geometry, material2);
    meshCyl.rotation.set(0, 0, -Math.PI / 2);
    meshCyl.position.set(-3.05, 0, 0);
    meshCyl.scale.set(1.5, 1.7, 1.5);
    scene.add(meshCyl);
  }

  function flame() {
    const geometry = new THREE.CylinderGeometry(1, 0, 5.3, 50, 50, true);
    material3 = new THREE.ShaderMaterial({
      uniforms: {
        perlinnoise: { value: loadNoise(`${ASSET}/water-min.jpg`) },
        color4: { value: new THREE.Vector3(...options.color5) },
        time: { value: 0.0 },
        noise: { value: loadNoise(`${ASSET}/noise9.jpg`) },
      },
      vertexShader: vertflame,
      fragmentShader: fragflame,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
    });
    const meshFlame = new THREE.Mesh(geometry, material3);
    meshFlame.rotation.set(0, 0, -Math.PI / 2);
    meshFlame.position.set(-3.78, 0, 0);
    meshFlame.scale.set(2, 2, 2);
    scene.add(meshFlame);
  }

  function rgbVec(target, arr) {
    if (typeof arr === "string") {
      const c = new THREE.Color(arr);
      target.set(c.r * 255, c.g * 255, c.b * 255);
      return;
    }
    target.set(arr[0], arr[1], arr[2]);
  }

  function updateDraw(deltaTime) {
    const t = deltaTime || 0;
    material.uniforms.time.value = -t / (1000 * 2);
    material2.uniforms.time.value = -t / (3000 * 2);
    material3.uniforms.time.value = -t / (3000 * 2);
    rgbVec(material.uniforms.color5.value, options.color5);
    rgbVec(material2.uniforms.color4.value, options.color4);
    rgbVec(material3.uniforms.color4.value, options.color5);
    rgbVec(material.uniforms.color3.value, options.color3);
    rgbVec(material.uniforms.color2.value, options.color2);
    rgbVec(material.uniforms.color1.value, options.color1);
    rgbVec(material.uniforms.color0.value, options.color0);
  }

  function animatBloom(deltaTime) {
    requestAnimationFrame(animatBloom);
    updateDraw(deltaTime);
    controls.update();
    bloomPass.strength = options.bloomStrength;
    bloomPass.radius = options.bloomRadius;
    bloomComposer.render();
    stats.update();
  }

  function handleResize() {
    width = window.innerWidth;
    height = window.innerHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
    bloomComposer.setSize(width, height);
    material.uniforms.resolution.value.set(width, height);
  }

  function init() {
    createScene();
    postProc();
    mesh();
    flame();
    cylinder();
    animatBloom();
  }

  window.addEventListener("load", init);
  window.addEventListener("resize", handleResize, false);
</script>
</html>
