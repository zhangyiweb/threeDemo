<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>28.雨天积水</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #container, canvas { width: 100%; height: 100%; display: block; }
    body { overflow: hidden; background: #020305; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
      "@petamoriken/float16": "https://cdn.jsdelivr.net/npm/@petamoriken/float16@3.9.2/browser/float16.mjs",
      "astronomy-engine": "https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/esm/astronomy.js",
      "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js",
      "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.37.4/build/index.js",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/build/index.module.js",
      "three-stdlib": "https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/runtime/exr-loader.js"
    }
  }
  </script>
</head>
<body>
  <div id="container"><canvas id="view"></canvas></div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GUI } from "three/addons/libs/lil-gui.module.min.js";
    import Stats from "three/addons/libs/stats.module.js";

        import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
    
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
    
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    
    import {
    
      createPuddleMaterial,
    
      createRainDrops,
    
      createSplashSystem,
    
      loadWetPuddleRainTextures,
    
      rainPuddleDebugModes,
    
      wetPuddleRainAssetPaths,
    
    } from "https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/skills/threejs-precipitation-surfaces/examples/wet-puddle-rain/rain-puddle-system.js";
    
    
    
    async function loadTrashMaterial(resolveAsset) {
    
      const loader = new THREE.TextureLoader();
    
      const load = async (name, srgb = false) => {
    
        const texture = await loader.loadAsync(resolveAsset(`assets/trash/${name}`));
    
        if (srgb) texture.colorSpace = THREE.SRGBColorSpace;
    
        texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
    
        texture.repeat.set(2, 2);
    
        return texture;
    
      };
    
      const maps = {
    
        map: await load("shmpulh_4K_Albedo.jpg", true),
    
        alphaMap: await load("shmpulh_4K_Opacity.jpg"),
    
        normalMap: await load("shmpulh_4K_Normal.jpg"),
    
        roughnessMap: await load("shmpulh_4K_Roughness.jpg"),
    
        aoMap: await load("shmpulh_4K_AO.jpg"),
    
      };
    
      const material = new THREE.MeshStandardMaterial({
    
        ...maps,
    
        polygonOffset: true,
    
        polygonOffsetFactor: -2,
    
        depthWrite: false,
    
        transparent: true,
    
        blending: THREE.AdditiveBlending,
    
      });
    
      material.userData.maps = maps;
    
      return material;
    
    }
    
    
    
    const sceneModule = {
    
      initialTime: 4.85,
    
      renderer: {
    
        options: { antialias: false },
    
        toneMapping: 7,
    
        exposure: 1.0,
    
        clearColor: 0x050508,
    
      },
    
      camera: {
    
        fov: 50,
    
        near: 0.01,
    
        far: 60,
    
        position: [0.713725247365501, 0.3394033648663526, 0.32126638003592926],
    
      },
    
      controls: {
    
        target: [0, 0, 0],
    
        minDistance: 0.25,
    
        maxDistance: 4,
    
        maxPolarAngle: Math.PI * 0.49,
    
        enablePan: true,
    
      },
    
      async setup({ renderer, scene, camera, resolveAsset }) {
    
        const hdr = await new RGBELoader().loadAsync(
    
          resolveAsset("assets/cyberpunk.hdr"),
    
        );
    
        hdr.mapping = THREE.EquirectangularReflectionMapping;
    
        scene.environment = hdr;
    
        scene.environmentIntensity = 1.75;
    
        scene.background = new THREE.Color(0x00010b);
    
        const previousFilter = renderer.domElement.style.filter;
    
        renderer.domElement.style.filter = "contrast(1.2) saturate(1.1) brightness(1.1)";
    
    
    
        const rainProgress = { value: 0 };
    
        const maps = await loadWetPuddleRainTextures({
    
          paths: wetPuddleRainAssetPaths.road,
    
          anisotropy: renderer.capabilities.getMaxAnisotropy(),
    
        });
    
        const puddleMaterial = createPuddleMaterial({ maps, rainProgress });
    
    
    
        const floorGroup = new THREE.Group();
    
        floorGroup.rotation.x = -Math.PI / 2;
    
        scene.add(floorGroup);
    
    
    
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1, 1, 1, 1), puddleMaterial);
    
        floor.geometry.setAttribute("uv1", floor.geometry.attributes.uv);
    
        floorGroup.add(floor);
    
    
    
        const trashMaterial = await loadTrashMaterial(resolveAsset);
    
        const trash = new THREE.Mesh(new THREE.CircleGeometry(0.5, 96), trashMaterial);
    
        trash.rotation.z = THREE.MathUtils.degToRad(30);
    
        trash.position.z = 0.002;
    
        trash.renderOrder = 1;
    
        floorGroup.add(trash);
    
    
    
        floorGroup.updateMatrixWorld(true);
    
    
    
        const drops = createRainDrops({
    
          count: 1000,
    
          rainProgress,
    
        });
    
        scene.add(drops.mesh);
    
    
    
        const splashTexture = await new THREE.TextureLoader().loadAsync(
    
          wetPuddleRainAssetPaths.splashFlipbook,
    
        );
    
        splashTexture.colorSpace = THREE.SRGBColorSpace;
    
        const splashes = await createSplashSystem({
    
          targetGroup: floorGroup,
    
          texture: splashTexture,
    
          count: 1000,
    
          rainProgress,
    
        });
    
        scene.add(splashes.mesh);
    
    
    
        let debugMode = "final";
    
        const composer = new EffectComposer(renderer);
    
        composer.addPass(new RenderPass(scene, camera));
    
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.05, 0.0, 1.0));
    
        composer.addPass(new OutputPass());
    
    
    
        return {
    
          setDebugMode(mode) {
    
            debugMode = mode;
    
            const value = rainPuddleDebugModes.get(mode) ?? 0;
    
            puddleMaterial.userData.rainUniforms.uDebugMode.value = value;
    
            drops.setDebugMode(mode);
    
            splashes.setDebugMode(mode);
    
          },
    
          update({ delta, elapsed }) {
    
            rainProgress.value = Math.min(1, elapsed / 5);
    
            puddleMaterial.userData.rainUniforms.uTime.value += delta;
    
            drops.update({ camera, delta });
    
            splashes.update({ camera, delta });
    
          },
    
          metrics() {
    
            return {
    
              rain: rainProgress.value.toFixed(2),
    
              drops: "1000",
    
              splashes: "1000",
    
            };
    
          },
    
          resize({ width, height, dpr }) {
    
            composer.setPixelRatio(dpr);
    
            composer.setSize(width, height);
    
          },
    
          render({ state }) {
    
            if (state.debugMode === "final") composer.render();
    
            else renderer.render(scene, camera);
    
          },
    
          dispose() {
    
            drops.dispose();
    
            splashes.dispose();
    
            composer.dispose();
    
            renderer.domElement.style.filter = previousFilter;
    
            floor.geometry.dispose();
    
            puddleMaterial.dispose();
    
            trash.geometry.dispose();
    
            trashMaterial.dispose();
    
            splashTexture.dispose();
    
            for (const texture of Object.values(maps)) texture.dispose();
    
            for (const texture of Object.values(trashMaterial.userData.maps)) {
    
              texture.dispose();
    
            }
    
            hdr.dispose();
    
          },
    
        };
    
      },
    
    };

    if ((sceneModule.backend === "webgpu" || sceneModule.backend === "raw-webgpu") && !navigator.gpu) {
      throw new Error("WebGPU unavailable");
    }

    const canvas = document.querySelector("#view");
    const rawWebGpu = sceneModule.backend === "raw-webgpu";
    const rendererOptions = {
      canvas,
      antialias: true,
      powerPreference: "high-performance",
      ...(sceneModule.renderer?.options ?? {}),
    };
    const renderer = rawWebGpu
      ? null
      : sceneModule.backend === "webgpu"
        ? new THREE.WebGPURenderer(rendererOptions)
        : new THREE.WebGLRenderer(rendererOptions);

    if (typeof renderer?.init === "function") await renderer.init();
    if (renderer) {
      renderer.outputColorSpace = sceneModule.renderer?.outputColorSpace ?? THREE.SRGBColorSpace;
      renderer.toneMapping = sceneModule.renderer?.toneMapping ?? THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = sceneModule.renderer?.exposure ?? 1;
    }
    if (renderer && sceneModule.renderer?.clearColor != null) {
      renderer.setClearColor(sceneModule.renderer.clearColor, sceneModule.renderer.clearAlpha ?? 1);
    }

    const scene = new THREE.Scene();
    const cameraConfig = sceneModule.camera ?? {};
    const camera = cameraConfig.type === "orthographic"
      ? new THREE.OrthographicCamera(
          cameraConfig.left ?? -1,
          cameraConfig.right ?? 1,
          cameraConfig.top ?? 1,
          cameraConfig.bottom ?? -1,
          cameraConfig.near ?? 0,
          cameraConfig.far ?? 1,
        )
      : new THREE.PerspectiveCamera(
          cameraConfig.fov ?? 50,
          1,
          cameraConfig.near ?? 0.1,
          cameraConfig.far ?? 2000,
        );
    if (cameraConfig.position) camera.position.fromArray(cameraConfig.position);
    if (cameraConfig.up) camera.up.fromArray(cameraConfig.up);

    const controlsConfig = sceneModule.controls ?? {};
    const controls = controlsConfig.enabled === false || cameraConfig.type === "orthographic"
      ? null
      : new OrbitControls(camera, canvas);
    if (controls) {
      controls.enableDamping = controlsConfig.enableDamping ?? true;
      controls.dampingFactor = controlsConfig.dampingFactor ?? 0.08;
      controls.enablePan = controlsConfig.enablePan ?? true;
      controls.enableZoom = controlsConfig.enableZoom ?? true;
      controls.screenSpacePanning = controlsConfig.screenSpacePanning ?? true;
      controls.minDistance = controlsConfig.minDistance ?? 0;
      controls.maxDistance = controlsConfig.maxDistance ?? Infinity;
      controls.minPolarAngle = controlsConfig.minPolarAngle ?? 0;
      controls.maxPolarAngle = controlsConfig.maxPolarAngle ?? Math.PI;
      controls.minAzimuthAngle = controlsConfig.minAzimuthAngle ?? -Infinity;
      controls.maxAzimuthAngle = controlsConfig.maxAzimuthAngle ?? Infinity;
      controls.target.fromArray(controlsConfig.target ?? [0, 0, 0]);
      controls.update();
    }

    function resolveAsset(relativePath) {
      if (/^https?:\/\//.test(relativePath)) return relativePath;
      return new URL(relativePath, new URL("https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/examples/threejs-precipitation-surfaces/wet-puddle-rain/", import.meta.url)).href;
    }

    const example = await sceneModule.setup({
      THREE,
      canvas,
      renderer,
      scene,
      camera,
      controls,
      resolveAsset,
    }) ?? {};

    const params = {
      paused: false,
      timeScale: 1,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      debugMode: "final",
    };
    if (renderer) renderer.setPixelRatio(params.dpr);
    example.setDebugMode?.(params.debugMode);

    const drawingBufferSize = renderer ? new THREE.Vector2() : null;
    function resize() {
      const width = Math.max(1, canvas.clientWidth);
      const height = Math.max(1, canvas.clientHeight);
      const bufferWidth = Math.round(width * params.dpr);
      const bufferHeight = Math.round(height * params.dpr);
      if (rawWebGpu) {
        example.resize?.({ width, height, bufferWidth, bufferHeight, dpr: params.dpr });
        if (camera.isPerspectiveCamera) {
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        }
        return;
      }
      renderer.getDrawingBufferSize(drawingBufferSize);
      if (drawingBufferSize.x === bufferWidth && drawingBufferSize.y === bufferHeight) return;
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(width, height, false);
      if (camera.isPerspectiveCamera) {
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }
      example.resize?.({ width, height, bufferWidth, bufferHeight, dpr: params.dpr });
    }

    const stats = new Stats();
    document.body.appendChild(stats.dom);
    const gui = new GUI({ title: "28.雨天积水" });
    gui.add(params, "paused").name("暂停");
    gui.add(params, "timeScale", 0, 3, 0.05).name("时间缩放");
    gui.add(params, "dpr", 0.5, 2, 0.25).name("像素比").onChange(resize);
    gui.add(params, "debugMode", {
      "Final": "final",
      "Puddle mask": "puddleMask",
      "Ripple normals": "rippleNormals",
      "Rain progress": "rainProgress",
      "Splashes": "splashes",
    }).name("调试").onChange((value) => example.setDebugMode?.(value));

    let elapsed = sceneModule.initialTime ?? 0;
    let previous = performance.now();
    let frameInProgress = false;
    resize();

    async function frame(now) {
      if (frameInProgress) return;
      frameInProgress = true;
      try {
        stats.update();
        resize();
        const rawDelta = Math.min((now - previous) / 1000, 0.1);
        previous = now;
        const delta = params.paused ? 0 : rawDelta * params.timeScale;
        elapsed += delta;
        controls?.update();
        await example.update?.({ delta, rawDelta, elapsed, state: params, camera, controls });
        if (example.render) {
          await example.render({ renderer, scene, camera, elapsed, delta, rawDelta, state: params });
        } else if (typeof renderer?.renderAsync === "function") {
          await renderer.renderAsync(scene, camera);
        } else if (renderer) {
          renderer.render(scene, camera);
        }
      } finally {
        frameInProgress = false;
      }
    }

    if (rawWebGpu) {
      let rawAnimationFrame = 0;
      let rawLoopStopped = false;
      const rawLoop = async (now) => {
        await frame(now);
        if (!rawLoopStopped) rawAnimationFrame = requestAnimationFrame(rawLoop);
      };
      rawAnimationFrame = requestAnimationFrame(rawLoop);
      window.addEventListener("pagehide", () => {
        rawLoopStopped = true;
        cancelAnimationFrame(rawAnimationFrame);
        gui.destroy();
        stats.dom.remove();
        controls?.dispose();
        example.dispose?.();
      }, { once: true });
    } else {
      renderer.setAnimationLoop(frame);
      window.addEventListener("pagehide", () => {
        renderer.setAnimationLoop(null);
        gui.destroy();
        stats.dom.remove();
        controls?.dispose();
        example.dispose?.();
        renderer.dispose();
      }, { once: true });
    }
  </script>
</body>
</html>
