<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>39.风格化草地</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #container, canvas { width: 100%; height: 100%; display: block; }
    body { overflow: hidden; background: #020305; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
      "@petamoriken/float16": "https://cdn.jsdelivr.net/npm/@petamoriken/float16@3.9.2/browser/float16.mjs",
      "astronomy-engine": "https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/esm/astronomy.js",
      "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js",
      "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.37.4/build/index.js",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/build/index.module.js",
      "three-stdlib": "https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/runtime/exr-loader.js"
    }
  }
  </script>
</head>
<body>
  <div id="container"><canvas id="view"></canvas></div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GUI } from "three/addons/libs/lil-gui.module.min.js";
    import Stats from "three/addons/libs/stats.module.js";

        import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    
    import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
    
    import {
    
      createStylizedGrassField,
    
      stylizedMeadowGrassAssetPaths,
    
    } from "https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/skills/threejs-procedural-vegetation/examples/stylized-meadow-grass/grass-system.js";
    
    
    
    const GROUND_SIZE = 40;
    
    
    
    function firstMeshGeometry(root) {
    
      let geometry = null;
    
      root.traverse((child) => {
    
        if (!geometry && child.isMesh) {
    
          geometry = child.geometry;
    
        }
    
      });
    
      return geometry;
    
    }
    
    
    
    async function loadTexture(url, {
    
      colorSpace = THREE.SRGBColorSpace,
    
      repeat = [1, 1],
    
    } = {}) {
    
      const loader = new THREE.TextureLoader();
    
      const texture = await loader.loadAsync(url);
    
      texture.colorSpace = colorSpace;
    
      texture.wrapS = THREE.RepeatWrapping;
    
      texture.wrapT = THREE.RepeatWrapping;
    
      texture.repeat.set(repeat[0], repeat[1]);
    
      texture.anisotropy = 8;
    
      return texture;
    
    }
    
    
    
    async function loadImageData(url) {
    
      const image = new Image();
    
      image.crossOrigin = "anonymous";
    
      image.src = url;
    
      await image.decode();
    
      const canvas = document.createElement("canvas");
    
      canvas.width = image.naturalWidth;
    
      canvas.height = image.naturalHeight;
    
      const context = canvas.getContext("2d", { willReadFrequently: true });
    
      context.drawImage(image, 0, 0);
    
      return context.getImageData(0, 0, canvas.width, canvas.height);
    
    }
    
    
    
    function sampleImageData(imageData, u, v) {
    
      const x = Math.min(
    
        imageData.width - 1,
    
        Math.max(0, Math.floor(u * imageData.width)),
    
      );
    
      const y = Math.min(
    
        imageData.height - 1,
    
        Math.max(0, Math.floor(v * imageData.height)),
    
      );
    
      return imageData.data[(y * imageData.width + x) * 4] / 255;
    
    }
    
    
    
    function createImagePathSampler(imageData) {
    
      return (x, z) => sampleImageData(
    
        imageData,
    
        x / GROUND_SIZE + 0.5,
    
        z / GROUND_SIZE + 0.5,
    
      );
    
    }
    
    
    
    function createGroundMaterial({ grassMap, dirtMap, normalMap, roughnessMap, pathMap }) {
    
      return new THREE.ShaderMaterial({
    
        uniforms: {
    
          uGrassMap: { value: grassMap },
    
          uDirtMap: { value: dirtMap },
    
          uNormalMap: { value: normalMap },
    
          uRoughnessMap: { value: roughnessMap },
    
          uPathMap: { value: pathMap },
    
          uPathDepth: { value: 0.25 },
    
          uDirtBump: { value: 0.15 },
    
        },
    
        vertexShader: `
    
          varying vec2 vWorldXZ;
    
          varying vec2 vUv;
    
    
    
          void main() {
    
            vUv = uv;
    
            vec4 world = modelMatrix * vec4(position, 1.0);
    
            vWorldXZ = world.xz;
    
            gl_Position = projectionMatrix * viewMatrix * world;
    
          }
    
        `,
    
        fragmentShader: `
    
          precision highp float;
    
          uniform sampler2D uGrassMap;
    
          uniform sampler2D uDirtMap;
    
          uniform sampler2D uNormalMap;
    
          uniform sampler2D uRoughnessMap;
    
          uniform sampler2D uPathMap;
    
          varying vec2 vWorldXZ;
    
    
    
          void main() {
    
            vec2 fieldUv = vWorldXZ / ${GROUND_SIZE.toFixed(1)} + 0.5;
    
            vec2 tileUv = fieldUv * 8.0;
    
            float path = texture2D(uPathMap, fieldUv).r;
    
            float edge = smoothstep(0.28, 0.82, path);
    
            vec3 grass = texture2D(uGrassMap, tileUv).rgb;
    
            vec3 dirt = texture2D(uDirtMap, tileUv).rgb;
    
            float shade = texture2D(uRoughnessMap, tileUv).r * 0.16 +
    
              texture2D(uNormalMap, tileUv).g * 0.08;
    
            vec3 color = mix(grass, dirt * 1.08, edge) * (0.92 + shade);
    
            gl_FragColor = vec4(color, 1.0);
    
            #include <tonemapping_fragment>
    
            #include <colorspace_fragment>
    
          }
    
        `,
    
      });
    
    }
    
    
    
    function addSky(scene, texture) {
    
      const material = new THREE.MeshBasicMaterial({
    
        map: texture,
    
        side: THREE.BackSide,
    
        fog: false,
    
      });
    
      const sky = new THREE.Mesh(new THREE.SphereGeometry(280, 48, 24), material);
    
      scene.add(sky);
    
      return sky;
    
    }
    
    
    
    const sceneModule = {
    
      initialTime: 9.5,
    
      renderer: {
    
        options: { antialias: true },
    
        toneMapping: 7,
    
        exposure: 1,
    
        clearColor: 0x8ab7ed,
    
      },
    
      camera: {
    
        fov: 50,
    
        near: 0.1,
    
        far: 800,
    
        position: [1.98, 4.46, 22.31],
    
      },
    
      controls: {
    
        target: [0, 0, 0],
    
        minDistance: 3,
    
        maxDistance: 70,
    
        maxPolarAngle: Math.PI * 0.49,
    
        enablePan: true,
    
      },
    
      async setup({ scene, resolveAsset }) {
    
        scene.add(new THREE.HemisphereLight(0xdbe9ff, 0x40552a, 1.15));
    
        const sun = new THREE.DirectionalLight(0xfff1cf, 3.0);
    
        sun.position.set(18, 16, 10);
    
        sun.castShadow = true;
    
        scene.add(sun);
    
    
    
        const loader = new GLTFLoader();
    
        const dracoLoader = new DRACOLoader();
    
        dracoLoader.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/libs/draco/gltf/");
    
        loader.setDRACOLoader(dracoLoader);
    
        const [
    
          bladeGltf,
    
          grassMap,
    
          dirtMap,
    
          normalMap,
    
          roughnessMap,
    
          pathTexture,
    
          pathData,
    
          skyTexture,
    
        ] = await Promise.all([
    
          loader.loadAsync(stylizedMeadowGrassAssetPaths.blades),
    
          loadTexture(resolveAsset("assets/grass_texture/grass_05_basecolor_1k.webp"), { repeat: [8, 8] })
    
            .catch(() => loadTexture(resolveAsset("assets/ground_texture/ground_07_4k/ground_07__basecolor_1k.webp"), { repeat: [8, 8] })),
    
          loadTexture(resolveAsset("assets/ground_texture/ground_07_4k/ground_07__basecolor_1k.webp"), { repeat: [8, 8] }),
    
          loadTexture(resolveAsset("assets/ground_texture/ground_07_4k/ground_07__normal_gl_1k.webp"), {
    
            colorSpace: THREE.NoColorSpace,
    
            repeat: [8, 8],
    
          }),
    
          loadTexture(resolveAsset("assets/ground_texture/ground_07_4k/ground_07__roughness_1k.webp"), {
    
            colorSpace: THREE.NoColorSpace,
    
            repeat: [8, 8],
    
          }),
    
          loadTexture(stylizedMeadowGrassAssetPaths.pathMask, { colorSpace: THREE.NoColorSpace }),
    
          loadImageData(stylizedMeadowGrassAssetPaths.pathMask),
    
          loadTexture(resolveAsset("assets/skybox/sky_88_2k.png")),
    
        ]);
    
    
    
        const groundMaterial = createGroundMaterial({
    
          grassMap,
    
          dirtMap,
    
          normalMap,
    
          roughnessMap,
    
          pathMap: pathTexture,
    
        });
    
        const ground = new THREE.Mesh(
    
          new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE, 256, 256),
    
          groundMaterial,
    
        );
    
        ground.rotation.x = -Math.PI / 2;
    
        ground.receiveShadow = true;
    
        scene.add(ground);
    
    
    
        const sky = addSky(scene, skyTexture);
    
    
    
        const grassGeometry = firstMeshGeometry(bladeGltf.scene);
    
        const grass = createStylizedGrassField({
    
          count: 5000,
    
          area: GROUND_SIZE,
    
          seed: 815,
    
          bladeGeometry: grassGeometry,
    
          scale: 1.3,
    
          pathSampler: createImagePathSampler(pathData),
    
          sunDirection: sun.position.clone().normalize(),
    
          groundColorMap: grassMap,
    
        });
    
        scene.add(grass.object);
    
    
    
        return {
    
          setDebugMode(mode) {
    
            grass.setDebugMode(mode);
    
          },
    
          update({ elapsed }) {
    
            grass.update({ elapsed });
    
          },
    
          metrics() {
    
            return {
    
              blades: "5000",
    
              assets: "GLB blades, image path mask",
    
            };
    
          },
    
          dispose() {
    
            grass.dispose();
    
            ground.geometry.dispose();
    
            groundMaterial.dispose();
    
            sky.geometry.dispose();
    
            sky.material.dispose();
    
            for (const texture of [
    
              grassMap,
    
              dirtMap,
    
              normalMap,
    
              roughnessMap,
    
              pathTexture,
    
              skyTexture,
    
            ]) {
    
              texture.dispose();
    
            }
    
            dracoLoader.dispose();
    
          },
    
        };
    
      },
    
    };

    if ((sceneModule.backend === "webgpu" || sceneModule.backend === "raw-webgpu") && !navigator.gpu) {
      throw new Error("WebGPU unavailable");
    }

    const canvas = document.querySelector("#view");
    const rawWebGpu = sceneModule.backend === "raw-webgpu";
    const rendererOptions = {
      canvas,
      antialias: true,
      powerPreference: "high-performance",
      ...(sceneModule.renderer?.options ?? {}),
    };
    const renderer = rawWebGpu
      ? null
      : sceneModule.backend === "webgpu"
        ? new THREE.WebGPURenderer(rendererOptions)
        : new THREE.WebGLRenderer(rendererOptions);

    if (typeof renderer?.init === "function") await renderer.init();
    if (renderer) {
      renderer.outputColorSpace = sceneModule.renderer?.outputColorSpace ?? THREE.SRGBColorSpace;
      renderer.toneMapping = sceneModule.renderer?.toneMapping ?? THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = sceneModule.renderer?.exposure ?? 1;
    }
    if (renderer && sceneModule.renderer?.clearColor != null) {
      renderer.setClearColor(sceneModule.renderer.clearColor, sceneModule.renderer.clearAlpha ?? 1);
    }

    const scene = new THREE.Scene();
    const cameraConfig = sceneModule.camera ?? {};
    const camera = cameraConfig.type === "orthographic"
      ? new THREE.OrthographicCamera(
          cameraConfig.left ?? -1,
          cameraConfig.right ?? 1,
          cameraConfig.top ?? 1,
          cameraConfig.bottom ?? -1,
          cameraConfig.near ?? 0,
          cameraConfig.far ?? 1,
        )
      : new THREE.PerspectiveCamera(
          cameraConfig.fov ?? 50,
          1,
          cameraConfig.near ?? 0.1,
          cameraConfig.far ?? 2000,
        );
    if (cameraConfig.position) camera.position.fromArray(cameraConfig.position);
    if (cameraConfig.up) camera.up.fromArray(cameraConfig.up);

    const controlsConfig = sceneModule.controls ?? {};
    const controls = controlsConfig.enabled === false || cameraConfig.type === "orthographic"
      ? null
      : new OrbitControls(camera, canvas);
    if (controls) {
      controls.enableDamping = controlsConfig.enableDamping ?? true;
      controls.dampingFactor = controlsConfig.dampingFactor ?? 0.08;
      controls.enablePan = controlsConfig.enablePan ?? true;
      controls.enableZoom = controlsConfig.enableZoom ?? true;
      controls.screenSpacePanning = controlsConfig.screenSpacePanning ?? true;
      controls.minDistance = controlsConfig.minDistance ?? 0;
      controls.maxDistance = controlsConfig.maxDistance ?? Infinity;
      controls.minPolarAngle = controlsConfig.minPolarAngle ?? 0;
      controls.maxPolarAngle = controlsConfig.maxPolarAngle ?? Math.PI;
      controls.minAzimuthAngle = controlsConfig.minAzimuthAngle ?? -Infinity;
      controls.maxAzimuthAngle = controlsConfig.maxAzimuthAngle ?? Infinity;
      controls.target.fromArray(controlsConfig.target ?? [0, 0, 0]);
      controls.update();
    }

    function resolveAsset(relativePath) {
      if (/^https?:\/\//.test(relativePath)) return relativePath;
      return new URL(relativePath, new URL("https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/examples/threejs-procedural-vegetation/stylized-meadow-grass/", import.meta.url)).href;
    }

    const example = await sceneModule.setup({
      THREE,
      canvas,
      renderer,
      scene,
      camera,
      controls,
      resolveAsset,
    }) ?? {};

    const params = {
      paused: false,
      timeScale: 1,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      debugMode: "final",
    };
    if (renderer) renderer.setPixelRatio(params.dpr);
    example.setDebugMode?.(params.debugMode);

    const drawingBufferSize = renderer ? new THREE.Vector2() : null;
    function resize() {
      const width = Math.max(1, canvas.clientWidth);
      const height = Math.max(1, canvas.clientHeight);
      const bufferWidth = Math.round(width * params.dpr);
      const bufferHeight = Math.round(height * params.dpr);
      if (rawWebGpu) {
        example.resize?.({ width, height, bufferWidth, bufferHeight, dpr: params.dpr });
        if (camera.isPerspectiveCamera) {
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        }
        return;
      }
      renderer.getDrawingBufferSize(drawingBufferSize);
      if (drawingBufferSize.x === bufferWidth && drawingBufferSize.y === bufferHeight) return;
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(width, height, false);
      if (camera.isPerspectiveCamera) {
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }
      example.resize?.({ width, height, bufferWidth, bufferHeight, dpr: params.dpr });
    }

    const stats = new Stats();
    document.body.appendChild(stats.dom);
    const gui = new GUI({ title: "39.风格化草地" });
    gui.add(params, "paused").name("暂停");
    gui.add(params, "timeScale", 0, 3, 0.05).name("时间缩放");
    gui.add(params, "dpr", 0.5, 2, 0.25).name("像素比").onChange(resize);
    gui.add(params, "debugMode", {
      "Final": "final",
      "Blade height": "height",
      "Color patches": "patches",
      "Wind field": "wind",
      "Normals": "normals",
    }).name("调试").onChange((value) => example.setDebugMode?.(value));

    let elapsed = sceneModule.initialTime ?? 0;
    let previous = performance.now();
    let frameInProgress = false;
    resize();

    async function frame(now) {
      if (frameInProgress) return;
      frameInProgress = true;
      try {
        stats.update();
        resize();
        const rawDelta = Math.min((now - previous) / 1000, 0.1);
        previous = now;
        const delta = params.paused ? 0 : rawDelta * params.timeScale;
        elapsed += delta;
        controls?.update();
        await example.update?.({ delta, rawDelta, elapsed, state: params, camera, controls });
        if (example.render) {
          await example.render({ renderer, scene, camera, elapsed, delta, rawDelta, state: params });
        } else if (typeof renderer?.renderAsync === "function") {
          await renderer.renderAsync(scene, camera);
        } else if (renderer) {
          renderer.render(scene, camera);
        }
      } finally {
        frameInProgress = false;
      }
    }

    if (rawWebGpu) {
      let rawAnimationFrame = 0;
      let rawLoopStopped = false;
      const rawLoop = async (now) => {
        await frame(now);
        if (!rawLoopStopped) rawAnimationFrame = requestAnimationFrame(rawLoop);
      };
      rawAnimationFrame = requestAnimationFrame(rawLoop);
      window.addEventListener("pagehide", () => {
        rawLoopStopped = true;
        cancelAnimationFrame(rawAnimationFrame);
        gui.destroy();
        stats.dom.remove();
        controls?.dispose();
        example.dispose?.();
      }, { once: true });
    } else {
      renderer.setAnimationLoop(frame);
      window.addEventListener("pagehide", () => {
        renderer.setAnimationLoop(null);
        gui.destroy();
        stats.dom.remove();
        controls?.dispose();
        example.dispose?.();
        renderer.dispose();
      }, { once: true });
    }
  </script>
</body>
</html>
