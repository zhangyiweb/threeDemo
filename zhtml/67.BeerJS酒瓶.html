<!--
 * BeerJS / JS Beer Halloween Edition [TSL] — https://codepen.io/prisoner849/pen/gOVvxeX
 * WebGPU + TSL 车削酒瓶、Canvas 标签、噪声蒸汽与 Bloom
-->
<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>67.BeerJS酒瓶</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
    overflow: hidden;
    box-sizing: border-box;
  }

  html,
  body,
  #container {
    width: 100%;
    height: 100%;
    background: #000;
  }

  canvas {
    display: block;
  }
</style>

<body>
  <div id="container"></div>
</body>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
    }
  }
</script>
<script type="module">
  import * as THREE from 'three/webgpu';
  import {
    color,
    pmremTexture,
    mix,
    smoothstep,
    abs,
    max,
    clamp,
    normalize,
    negate,
    dot,
    texture,
    uv,
    vec2,
    vec3,
    vec4,
    pass,
    mrt,
    output,
    emissive,
    Fn,
    mx_noise_float,
    mx_fractal_noise_float,
    normalWorld,
    normalView,
    positionView,
    positionGeometry,
    normalGeometry,
    time,
  } from 'three/tsl';
  import { bloom } from 'three/addons/tsl/display/BloomNode.js';
  import Stats from 'three/addons/libs/stats.module.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

  await (async function () {
    async function loadFont(fontface) {
      await fontface.load();
      document.fonts.add(fontface);
    }
    const fonts = [
      new FontFace(
        'Sancreek',
        "url(https://fonts.gstatic.com/s/sancreek/v25/pxiHypAnsdxUm159X4D5V14.woff2) format('woff2')",
      ),
    ];
    for (const font of fonts) {
      await loadFont(font);
    }
  })();

  class Postprocessing extends THREE.PostProcessing {
    constructor(renderer) {
      const scenePass = pass(scene, camera);
      scenePass.setMRT(
        mrt({
          output,
          emissive,
        }),
      );

      const outputPass = scenePass.getTextureNode();
      const emissivePass = scenePass.getTextureNode('emissive');
      const bloomPass = bloom(emissivePass, 0.1, 0);

      super(renderer);
      this.outputNode = outputPass.add(bloomPass);
    }
  }

  class Bottle extends THREE.Mesh {
    constructor() {
      const bottlePath = new THREE.Path()
        .moveTo(0, 0)
        .lineTo(2, 0)
        .absarc(2, 0.5, 0.5, Math.PI * 1.5, 0)
        .lineTo(2.5, 5)
        .bezierCurveTo(2.5, 7.5, 0.5, 5.5, 0.5, 10)
        .absarc(0.5, 10.25, 0.125, Math.PI * 1.5, Math.PI * 3)
        .absarc(0, 6.5, 0.5, 0, Math.PI * 1.5, true);

      const g = new THREE.LatheGeometry(bottlePath.getPoints(100), 144).rotateY(Math.PI * -0.5);
      const pos = g.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i) - 0.5;
        g.attributes.uv.setY(i, y / 5);
      }

      const beerJSTex = (() => {
        const c = document.createElement('canvas');
        c.width = c.height = 1024;
        const u = (val) => c.height * 0.01 * val;
        const ctx = c.getContext('2d');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(255, 255, 255, 1)';
        ctx.font = `${u(15)}px Sancreek`;
        ctx.fillText('JS', u(50), u(45));
        ctx.font = `${u(30)}px Sancreek`;
        ctx.fillText('BEER', u(50), u(75));

        const eye = (flip) => {
          ctx.save();
          ctx.translate(u(50), u(50));
          ctx.scale(flip, 1);
          ctx.translate(u(10), u(-22));
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(u(10), -u(5), u(25), u(-24));
          ctx.quadraticCurveTo(u(25), u(25), 0, 0);
          ctx.fill();
          ctx.restore();
        };
        eye(1);
        eye(-1);

        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = 'srgb';
        tex.anisotropy = 8;
        return tex;
      })();

      const beerJSBackTex = (() => {
        const c = document.createElement('canvas');
        c.width = c.height = 1024;
        const u = (val) => c.height * 0.01 * val;
        const ctx = c.getContext('2d');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(255, 255, 255, 1)';
        ctx.font = `${u(5)}px Sancreek`;
        ctx.fillText('Shake thoroughly to blast!', u(50), u(10));
        ctx.fillText('Ingredients:', u(50), u(25));
        ctx.font = `${u(15)}px Sancreek`;
        ctx.fillText('☢ ☣ ⚠', u(50), u(40));
        ctx.fillText('♡ ☠', u(50), u(55));
        ctx.font = `${u(5)}px Sancreek`;
        ctx.fillText('♤ Drink at your own risk ♤', u(50), u(75));
        ctx.font = `${u(3)}px Sancreek`;
        ctx.fillText('BeerJS Brewery', u(50), u(90));

        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = 'srgb';
        tex.anisotropy = 8;
        return tex;
      })();

      const m = new THREE.MeshStandardNodeMaterial({
        roughness: 0.4,
        metalness: 0.9,
      });

      const fillLevel = smoothstep(1.25, 1.75, uv().y).toVar();
      m.colorNode = mix(color(0x00aa44), color(0x006600), fillLevel);

      const texFront = texture(
        beerJSTex,
        uv().sub(vec2(0.25, 0.5)).mul(vec2(Math.PI, 1)).add(0.5),
      ).a.toVar();

      const texBackUV = uv().sub(vec2(0.75, 0.5)).mul(vec2(Math.PI, 1)).add(0.5).toVar();
      const texBack = texture(beerJSBackTex, texBackUV).a.toVar();
      const finalTexVal = max(texFront, texBack).toVar();
      m.emissiveNode = finalTexVal.mul(color(0xff6600).mul(5));

      super(g, m);

      const vapourG = new THREE.LatheGeometry(
        new THREE.Path()
          .moveTo(2.25, 5.5)
          .splineThru(
            [
              [2, 6.5],
              [1.5, 8],
              [1, 10],
              [0, 11],
            ].map((p) => new THREE.Vector2(...p)),
          )
          .getSpacedPoints(100),
        72,
      ).rotateY(Math.PI);

      const vapourM = new THREE.MeshBasicNodeMaterial({
        side: THREE.DoubleSide,
        depthWrite: false,
        transparent: true,
      });

      const timer = time;
      vapourM.positionNode = Fn(() => {
        const posNoise = positionGeometry.add(vec3(0, timer, 0)).mul(0.5).toVar();
        const noise = mx_noise_float(posNoise).mul(0.5).add(0.5);
        return positionGeometry.add(normalGeometry.mul(noise).mul(0.75));
      })();

      vapourM.colorNode = Fn(() => {
        const alpha = smoothstep(0, 0.9, uv().y).pow(2).toVar();
        const colorNoiseFade = smoothstep(0, 0.9, uv().y).toVar();
        const colorNoise = mx_fractal_noise_float(
          vec3(uv().mul(vec2(5, 1.5)).add(vec2(0, timer.mul(0.5))), timer.mul(0.1)),
        )
          .abs()
          .oneMinus()
          .pow(8)
          .mul(colorNoiseFade)
          .toVar();
        alpha.assign(
          clamp(alpha.add(colorNoise), 0, 1).mul(smoothstep(0.8, 1, uv().y).oneMinus()),
        );
        const smoothing = smoothstep(
          0,
          1,
          dot(abs(normalView), normalize(positionView).negate()),
        ).toVar();
        return vec4(color(0x008800), alpha.mul(0.75).mul(smoothing));
      })();

      this.add(new THREE.Mesh(vapourG, vapourM));
    }
  }

  const container = document.getElementById('container');

  const scene = new THREE.Scene();
  scene.backgroundNode = color(0x000000);

  const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 1, 1000);
  camera.position.set(0, 0.35, 1).setLength(22.5);

  const renderer = new THREE.WebGPURenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  container.appendChild(renderer.domElement);
  await renderer.init();

  const stats = new Stats();
  container.appendChild(stats.dom);

  const postprocessing = new Postprocessing(renderer);

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  const camShift = new THREE.Vector3(0, 5.25, 0);
  camera.position.add(camShift);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed *= -1;
  controls.minPolarAngle = Math.PI * 0.25;
  controls.maxPolarAngle = Math.PI * 0.75;
  controls.target.copy(camShift);

  new RGBELoader()
    .setPath('https://threejs.org/examples/textures/equirectangular/')
    .load('lobe.hdr', (tex) => {
      tex.mapping = THREE.EquirectangularReflectionMapping;
      scene.environment = tex;
      scene.backgroundNode = pmremTexture(tex, normalWorld, 0.5).mul(0.1);
    });

  const bottle = new Bottle();
  bottle.rotation.y = Math.PI * 0.25;
  scene.add(bottle);

  renderer.setAnimationLoop(() => {
    controls.update();
    postprocessing.render();
    stats.update();
  });
</script>

</html>
