<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>45.光谱级联海洋</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #container, canvas { width: 100%; height: 100%; display: block; }
    body { overflow: hidden; background: #020305; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
      "@petamoriken/float16": "https://cdn.jsdelivr.net/npm/@petamoriken/float16@3.9.2/browser/float16.mjs",
      "astronomy-engine": "https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/esm/astronomy.js",
      "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js",
      "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.37.4/build/index.js",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/build/index.module.js",
      "three-stdlib": "../assets/awesome/runtime/exr-loader.js"
    }
  }
  </script>
</head>
<body>
  <div id="container"><canvas id="view"></canvas></div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GUI } from "three/addons/libs/lil-gui.module.min.js";
    import Stats from "three/addons/libs/stats.module.js";

        import { SpectralOceanSystem } from "../assets/awesome/skills/threejs-spectral-ocean/examples/spectral-cascade-ocean/ocean-system.js";
    
    import { validateFragmentIFFT } from "../assets/awesome/skills/threejs-spectral-ocean/examples/spectral-cascade-ocean/fft-pipeline.js";
    
    import { createOceanDetailTexture } from "../assets/awesome/skills/threejs-spectral-ocean/examples/spectral-cascade-ocean/detail-texture.js";
    
    import {
    
      createOceanMaterial,
    
      createSkyMaterial,
    
      createSpectrumDebugMaterial,
    
      updateOceanMaterialTextures,
    
    } from "../assets/awesome/skills/threejs-spectral-ocean/examples/spectral-cascade-ocean/ocean-material.js";
    
    
    
    const sceneModule = {
    
      initialTime: 18.5,
    
      renderer: {
    
        options: { antialias: true },
    
        toneMapping: 0,
    
        exposure: 1,
    
        clearColor: 0x9fb8cc,
    
      },
    
      camera: {
    
        fov: 55,
    
        near: 0.5,
    
        far: 30000,
    
        position: [0, 16, 68],
    
      },
    
      controls: {
    
        target: [0, 0, -20],
    
        maxPolarAngle: Math.PI * 0.495,
    
        enablePan: true,
    
      },
    
    
    
      async setup({ THREE, renderer, scene, camera }) {
    
        const fftValidation = validateFragmentIFFT(renderer);
    
        if (!fftValidation.pass) {
    
          throw new Error(
    
            `IFFT validation failed: impulse=${fftValidation.impulseError}, ` +
    
            `frequency=${fftValidation.frequencyError}`,
    
          );
    
        }
    
    
    
        const sunAzimuth = THREE.MathUtils.degToRad(135);
    
        const sunElevation = THREE.MathUtils.degToRad(28);
    
        const sunDirection = new THREE.Vector3(
    
          Math.cos(sunElevation) * Math.sin(sunAzimuth),
    
          Math.sin(sunElevation),
    
          Math.cos(sunElevation) * Math.cos(sunAzimuth),
    
        ).normalize();
    
        const detailTexture = createOceanDetailTexture();
    
        const options = {
    
          resolution: 256,
    
          patchLengths: [250, 17, 5],
    
          boundaryFactor: 6,
    
          gravity: 9.81,
    
          depth: 500,
    
          choppiness: 1.3,
    
          foamRecovery: 0.4,
    
          amplitude: 1,
    
          seed: 481516,
    
          sunDirection,
    
          detailTexture,
    
          local: {
    
            scale: 1,
    
            windSpeed: 16,
    
            directionDegrees: 45,
    
            fetchMeters: 100000,
    
            directionality: 1,
    
            swell: 0.2,
    
            peakEnhancement: 3.3,
    
            shortWaveFade: 0.02,
    
          },
    
          swell: {
    
            scale: 0.8,
    
            windSpeed: 2,
    
            directionDegrees: 70,
    
            fetchMeters: 300000,
    
            directionality: 1,
    
            swell: 1,
    
            peakEnhancement: 3.3,
    
            shortWaveFade: 0.01,
    
          },
    
        };
    
    
    
        const ocean = new SpectralOceanSystem(renderer, options);
    
        scene.fog = new THREE.FogExp2(0x9fb8cc, 0.0045);
    
    
    
        const oceanMaterial = createOceanMaterial(ocean.cascades, options);
    
        const oceanGeometry = new THREE.PlaneGeometry(400, 400, 900, 900);
    
        oceanGeometry.rotateX(-Math.PI * 0.5);
    
        const oceanMesh = new THREE.Mesh(oceanGeometry, oceanMaterial);
    
        oceanMesh.frustumCulled = false;
    
        scene.add(oceanMesh);
    
    
    
        const sky = new THREE.Mesh(
    
          new THREE.SphereGeometry(12000, 48, 24),
    
          createSkyMaterial(options),
    
        );
    
        scene.add(sky);
    
    
    
        const debugScene = new THREE.Scene();
    
        const debugCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    
        const debugQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
    
        debugScene.add(debugQuad);
    
        const spectrumMaterials = ocean.cascades.map((cascade) =>
    
          createSpectrumDebugMaterial(cascade.spectrum)
    
        );
    
        let debugMode = "final";
    
        const debugModes = new Map([
    
          ["final", 0],
    
          ["cascade-bands", 1],
    
          ["normals", 2],
    
          ["jacobian", 3],
    
        ]);
    
    
    
        return {
    
          setDebugMode(mode) {
    
            debugMode = mode;
    
            oceanMaterial.uniforms.debugMode.value =
    
              debugModes.get(mode) ?? 0;
    
          },
    
          update({ delta, elapsed }) {
    
            ocean.update(elapsed, Math.max(delta, 1 / 120));
    
            updateOceanMaterialTextures(oceanMaterial, ocean.cascades);
    
            oceanMaterial.uniforms.time.value = elapsed;
    
          },
    
          render() {
    
            if (debugMode.startsWith("spectrum-")) {
    
              const index = Number.parseInt(debugMode.at(-1), 10);
    
              debugQuad.material = spectrumMaterials[index];
    
              renderer.render(debugScene, debugCamera);
    
            } else {
    
              renderer.render(scene, camera);
    
            }
    
          },
    
          metrics() {
    
            return {
    
              resolution: `${options.resolution}² × ${ocean.cascades.length}`,
    
              fftTest: `pass ${Math.max(
    
                fftValidation.impulseError,
    
                fftValidation.frequencyError,
    
              ).toExponential(1)}`,
    
            };
    
          },
    
          dispose() {
    
            oceanGeometry.dispose();
    
            oceanMaterial.dispose();
    
            sky.geometry.dispose();
    
            sky.material.dispose();
    
            debugQuad.geometry.dispose();
    
            for (const material of spectrumMaterials) material.dispose();
    
            detailTexture.dispose();
    
          },
    
        };
    
      },
    
    };

    if ((sceneModule.backend === "webgpu" || sceneModule.backend === "raw-webgpu") && !navigator.gpu) {
      throw new Error("WebGPU unavailable");
    }

    const canvas = document.querySelector("#view");
    const rawWebGpu = sceneModule.backend === "raw-webgpu";
    const rendererOptions = {
      canvas,
      antialias: true,
      powerPreference: "high-performance",
      ...(sceneModule.renderer?.options ?? {}),
    };
    const renderer = rawWebGpu
      ? null
      : sceneModule.backend === "webgpu"
        ? new THREE.WebGPURenderer(rendererOptions)
        : new THREE.WebGLRenderer(rendererOptions);

    if (typeof renderer?.init === "function") await renderer.init();
    if (renderer) {
      renderer.outputColorSpace = sceneModule.renderer?.outputColorSpace ?? THREE.SRGBColorSpace;
      renderer.toneMapping = sceneModule.renderer?.toneMapping ?? THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = sceneModule.renderer?.exposure ?? 1;
    }
    if (renderer && sceneModule.renderer?.clearColor != null) {
      renderer.setClearColor(sceneModule.renderer.clearColor, sceneModule.renderer.clearAlpha ?? 1);
    }

    const scene = new THREE.Scene();
    const cameraConfig = sceneModule.camera ?? {};
    const camera = cameraConfig.type === "orthographic"
      ? new THREE.OrthographicCamera(
          cameraConfig.left ?? -1,
          cameraConfig.right ?? 1,
          cameraConfig.top ?? 1,
          cameraConfig.bottom ?? -1,
          cameraConfig.near ?? 0,
          cameraConfig.far ?? 1,
        )
      : new THREE.PerspectiveCamera(
          cameraConfig.fov ?? 50,
          1,
          cameraConfig.near ?? 0.1,
          cameraConfig.far ?? 2000,
        );
    if (cameraConfig.position) camera.position.fromArray(cameraConfig.position);
    if (cameraConfig.up) camera.up.fromArray(cameraConfig.up);

    const controlsConfig = sceneModule.controls ?? {};
    const controls = controlsConfig.enabled === false || cameraConfig.type === "orthographic"
      ? null
      : new OrbitControls(camera, canvas);
    if (controls) {
      controls.enableDamping = controlsConfig.enableDamping ?? true;
      controls.dampingFactor = controlsConfig.dampingFactor ?? 0.08;
      controls.enablePan = controlsConfig.enablePan ?? true;
      controls.enableZoom = controlsConfig.enableZoom ?? true;
      controls.screenSpacePanning = controlsConfig.screenSpacePanning ?? true;
      controls.minDistance = controlsConfig.minDistance ?? 0;
      controls.maxDistance = controlsConfig.maxDistance ?? Infinity;
      controls.minPolarAngle = controlsConfig.minPolarAngle ?? 0;
      controls.maxPolarAngle = controlsConfig.maxPolarAngle ?? Math.PI;
      controls.minAzimuthAngle = controlsConfig.minAzimuthAngle ?? -Infinity;
      controls.maxAzimuthAngle = controlsConfig.maxAzimuthAngle ?? Infinity;
      controls.target.fromArray(controlsConfig.target ?? [0, 0, 0]);
      controls.update();
    }

    function resolveAsset(relativePath) {
      if (/^https?:\/\//.test(relativePath)) return relativePath;
      return new URL(relativePath, new URL("../assets/awesome/examples/threejs-spectral-ocean/spectral-cascade-ocean/", import.meta.url)).href;
    }

    const example = await sceneModule.setup({
      THREE,
      canvas,
      renderer,
      scene,
      camera,
      controls,
      resolveAsset,
    }) ?? {};

    const params = {
      paused: false,
      timeScale: 1,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      debugMode: "final",
    };
    if (renderer) renderer.setPixelRatio(params.dpr);
    example.setDebugMode?.(params.debugMode);

    const drawingBufferSize = renderer ? new THREE.Vector2() : null;
    function resize() {
      const width = Math.max(1, canvas.clientWidth);
      const height = Math.max(1, canvas.clientHeight);
      const bufferWidth = Math.round(width * params.dpr);
      const bufferHeight = Math.round(height * params.dpr);
      if (rawWebGpu) {
        example.resize?.({ width, height, bufferWidth, bufferHeight, dpr: params.dpr });
        if (camera.isPerspectiveCamera) {
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        }
        return;
      }
      renderer.getDrawingBufferSize(drawingBufferSize);
      if (drawingBufferSize.x === bufferWidth && drawingBufferSize.y === bufferHeight) return;
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(width, height, false);
      if (camera.isPerspectiveCamera) {
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }
      example.resize?.({ width, height, bufferWidth, bufferHeight, dpr: params.dpr });
    }

    const stats = new Stats();
    document.body.appendChild(stats.dom);
    const gui = new GUI({ title: "45.光谱级联海洋" });
    gui.add(params, "paused").name("暂停");
    gui.add(params, "timeScale", 0, 3, 0.05).name("时间缩放");
    gui.add(params, "dpr", 0.5, 2, 0.25).name("像素比").onChange(resize);
    gui.add(params, "debugMode", {
      "Final": "final",
      "Cascade bands": "cascade-bands",
      "Resolved normals": "normals",
      "Jacobian / foam history": "jacobian",
      "250 m spectrum": "spectrum-0",
      "17 m spectrum": "spectrum-1",
      "5 m spectrum": "spectrum-2",
    }).name("调试").onChange((value) => example.setDebugMode?.(value));

    let elapsed = sceneModule.initialTime ?? 0;
    let previous = performance.now();
    let frameInProgress = false;
    resize();

    async function frame(now) {
      if (frameInProgress) return;
      frameInProgress = true;
      try {
        stats.update();
        resize();
        const rawDelta = Math.min((now - previous) / 1000, 0.1);
        previous = now;
        const delta = params.paused ? 0 : rawDelta * params.timeScale;
        elapsed += delta;
        controls?.update();
        await example.update?.({ delta, rawDelta, elapsed, state: params, camera, controls });
        if (example.render) {
          await example.render({ renderer, scene, camera, elapsed, delta, rawDelta, state: params });
        } else if (typeof renderer?.renderAsync === "function") {
          await renderer.renderAsync(scene, camera);
        } else if (renderer) {
          renderer.render(scene, camera);
        }
      } finally {
        frameInProgress = false;
      }
    }

    if (rawWebGpu) {
      let rawAnimationFrame = 0;
      let rawLoopStopped = false;
      const rawLoop = async (now) => {
        await frame(now);
        if (!rawLoopStopped) rawAnimationFrame = requestAnimationFrame(rawLoop);
      };
      rawAnimationFrame = requestAnimationFrame(rawLoop);
      window.addEventListener("pagehide", () => {
        rawLoopStopped = true;
        cancelAnimationFrame(rawAnimationFrame);
        gui.destroy();
        stats.dom.remove();
        controls?.dispose();
        example.dispose?.();
      }, { once: true });
    } else {
      renderer.setAnimationLoop(frame);
      window.addEventListener("pagehide", () => {
        renderer.setAnimationLoop(null);
        gui.destroy();
        stats.dom.remove();
        controls?.dispose();
        example.dispose?.();
        renderer.dispose();
      }, { once: true });
    }
  </script>
</body>
</html>
