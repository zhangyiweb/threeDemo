renderer.toneMappingExposure = params.toneMappingExposure
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
viewport.appendChild(renderer.domElement)

const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(55, 1, 0.2, 200000)
camera.position.set(0, 18, 48)

const controls = new OrbitControls(camera, renderer.domElement)
controls.enableDamping = true
controls.dampingFactor = 0.06
controls.maxPolarAngle = Math.PI * 0.495
controls.minDistance = 2
controls.maxDistance = 4000
controls.target.set(0, 8, 0)
controls.update()

const weather = new WeatherSystem({ dayOfYear: params.dayOfYear, timeOfDay: params.timeOfDay })
const sky = new VolumetricSky(renderer, camera)
scene.add(sky.mesh)

const ambient = new THREE.HemisphereLight(0xb7d7ed, 0x3a4a3c, 0.85)
scene.add(ambient)

const sunHelper = new THREE.DirectionalLight(0xfff1d0, 2)
sunHelper.castShadow = true
sunHelper.shadow.mapSize.set(2048, 2048)
Object.assign(sunHelper.shadow.camera, { left: -120, right: 120, top: 120, bottom: -120, near: 1, far: 500 })
sunHelper.shadow.bias = -0.0002
sunHelper.shadow.normalBias = 0.04
scene.add(sunHelper)

const groundGeometry = new THREE.CircleGeometry(6500, 256)
const positions = groundGeometry.attributes.position
for (let i = 0; i < positions.count; i++) {
  const x = positions.getX(i)
  const y = positions.getY(i)
  const r = Math.hypot(x, y)
  const hills = Math.sin(x * 0.0038) * Math.cos(y * 0.0032) * 7.5
    + Math.sin(x * 0.0095 + 1.4) * Math.cos(y * 0.008) * 2.6
    + Math.sin((x + y) * 0.0018) * 3.2
  const rim = THREE.MathUtils.smoothstep(4600, 6500, r) * -28
  positions.setZ(i, hills + rim)
}
groundGeometry.computeVertexNormals()

const groundUniforms = {
  uSunDir: { value: new THREE.Vector3(0, 1, 0) },
  uSunColor: { value: new THREE.Color('#fff1d0') },
  uDaylight: { value: 1 },
  uFogColor: { value: new THREE.Color('#9eb8c6') },
  uFogDensity: { value: 0.00008 },
}
const ground = new THREE.Mesh(
  groundGeometry,
  new THREE.ShaderMaterial({
    uniforms: groundUniforms,
    vertexShader: /* glsl */ `
      varying vec3 vWorld;
      varying vec3 vNormalW;
      void main() {
        vec4 world = modelMatrix * vec4(position, 1.0);
        vWorld = world.xyz;
        vNormalW = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * world;
      }
    `,
    fragmentShader: /* glsl */ `
      uniform vec3 uSunDir, uSunColor, uFogColor;
      uniform float uDaylight, uFogDensity;
      varying vec3 vWorld;
      varying vec3 vNormalW;
      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        float a = hash(i), b = hash(i + vec2(1., 0.));
        float c = hash(i + vec2(0., 1.)), d = hash(i + vec2(1., 1.));
        vec2 u = f * f * (3. - 2. * f);
        return mix(a, b, u.x) + (c - a) * u.y * (1. - u.x) + (d - b) * u.x * u.y;
      }
      float fbm(vec2 p) {
        float v = 0., a = .5;
        for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + 17.1; a *= .5; }
        return v;
      }
      void main() {
        vec2 uv = vWorld.xz * 0.0065;
        float macro = fbm(uv * 0.55);
        float mid = fbm(uv * 1.7 + 3.1);
        float detail = fbm(uv * 5.5 + macro * 2.);
        float cover = smoothstep(.32, .68, fbm(uv * 0.9 + 8.));
        vec3 soil = vec3(0.47, 0.38, 0.27);
        vec3 grass = vec3(0.34, 0.48, 0.27);
        vec3 meadow = vec3(0.28, 0.40, 0.22);
        vec3 dry = vec3(0.58, 0.50, 0.34);
        vec3 albedo = mix(soil, grass, cover);
        albedo = mix(albedo, meadow, smoothstep(.45, .85, mid) * cover);
        albedo = mix(albedo, dry, smoothstep(1.5, 7.0, vWorld.y) * 0.6);
        albedo *= 0.88 + detail * 0.22 + macro * 0.16;
        vec3 bump = vec3((detail - .5) * .35 + (mid - .5) * .2, 1., (macro - .5) * .35);
        vec3 normal = normalize(vNormalW + bump * 0.45);
        float ndl = max(dot(normal, normalize(uSunDir)), 0.0);
        float wrap = max(dot(normal, normalize(uSunDir + vec3(0., .4, 0.))), 0.0);
        vec3 hemi = mix(vec3(0.12, 0.14, 0.15), vec3(0.62, 0.74, 0.84), normal.y * .5 + .5);
        vec3 color = albedo * (hemi * (0.28 + 0.5 * uDaylight) + uSunColor * (ndl * 1.05 + wrap * 0.28) * uDaylight);
        float dist = length(vWorld - cameraPosition);
        float fog = 1.0 - exp(-dist * uFogDensity);
        fog *= smoothstep(80., 900., dist);
        color = mix(color, uFogColor, clamp(fog, 0., .92));
        gl_FragColor = vec4(color, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `,
  }),
)
ground.rotation.x = -Math.PI / 2
ground.position.y = -0.05
scene.add(ground)

let time = 0
let last = 0
let disposed = false

function resize() {
  const width = Math.max(viewport.clientWidth, 1)
  const height = Math.max(viewport.clientHeight, 1)
  renderer.setSize(width, height)
  camera.aspect = width / height
  camera.updateProjectionMatrix()
  const size = renderer.getDrawingBufferSize(new THREE.Vector2())
  sky.setSize(size.x, size.y)
}
window.addEventListener('resize', resize)
resize()

function applyLighting(immediate = true) {
  const sun = weather.sunDirection
  const daylight = THREE.MathUtils.smoothstep(sun.y, -0.12, 0.22)
  sky.setWeather(params.skyExposure, params.haze)
  sky.setLighting(sun, params.clouds, daylight, { moon: weather.moonDirection, immediate })
  sky.sunLightColor(sunHelper.color)
  const strength = Math.max(sunHelper.color.r, sunHelper.color.g, sunHelper.color.b)
  if (strength > 0) sunHelper.color.multiplyScalar(1 / strength)
  sunHelper.position.copy(sun).multiplyScalar(220)
  sunHelper.target.position.set(0, 0, 0)
  sunHelper.intensity = 2.8 * Math.min(strength, 1) * THREE.MathUtils.smoothstep(sun.y, -0.01, 0.05)
  sunHelper.castShadow = sun.y > 0.02
  ambient.intensity = 0.35 + daylight * 0.9
  ambient.color.set(daylight > 0.3 ? '#b7d7ed' : '#507299')
  ambient.groundColor.set(daylight > 0.3 ? '#6d7f5c' : '#1c2430')
  groundUniforms.uSunDir.value.copy(sun)
  groundUniforms.uSunColor.value.copy(sunHelper.color)
  groundUniforms.uDaylight.value = daylight
  const fogColor = daylight > 0.35 ? '#a8c4d4' : daylight > 0.05 ? '#c9936f' : '#0d1520'
  groundUniforms.uFogColor.value.set(fogColor)
  groundUniforms.uFogDensity.value = 0.000065 + (1 - daylight) * 0.00004
  folderState.dayLabel = formatWeatherDay(weather.dayOfYear)
  folderState.clock = formatClock(weather.timeOfDay)
  folderState.sunElevation = `${weather.snapshot().sunElevation.toFixed(1)}°`
  folderState.sunAzimuth = `${weather.snapshot().sunAzimuth.toFixed(1)}°`
  controllers.dayLabel?.updateDisplay()
  controllers.clock?.updateDisplay()
  controllers.sunElevation?.updateDisplay()
  controllers.sunAzimuth?.updateDisplay()
}

function formatClock(timeOfDay) {
  const minutes = Math.floor(timeOfDay * 60 + 1e-6) % 1440
  return `${String(Math.floor(minutes / 60)).padStart(2, '0')}:${String(minutes % 60).padStart(2, '0')}`
}

const folderState = {
  dayLabel: formatWeatherDay(params.dayOfYear),
  clock: formatClock(params.timeOfDay),
  sunElevation: '0.0°',
  sunAzimuth: '0.0°',
  qualityLabel: '高',
}
const qualityMap = { 低: 'Low', 中: 'Medium', 高: 'High', 超高: 'Ultra' }
const controllers = {}
const gui = new GUI({ title: '天空 / 大气' })
gui.domElement.style.cssText = 'position:absolute;top:12px;right:12px;z-index:10;'

const dateFolder = gui.addFolder('本地日期')
controllers.dayLabel = dateFolder.add(folderState, 'dayLabel').name(`${WEATHER_YEAR} 日期`).disable()
dateFolder.add(params, 'dayOfYear', 1, 365, 1).name('年内日期').onChange((value) => {
  params.animateTime = false
  weather.setDate(value, params.timeOfDay)
  params.dayOfYear = weather.dayOfYear
  params.timeOfDay = weather.timeOfDay
  applyLighting(true)
})
controllers.clock = dateFolder.add(folderState, 'clock').name('时钟').disable()
dateFolder.add(params, 'timeOfDay', 0, 24, 0.01).name('一天时刻').onChange((value) => {
  params.animateTime = false
  weather.setDate(params.dayOfYear, value)
  params.dayOfYear = weather.dayOfYear
  params.timeOfDay = weather.timeOfDay
  applyLighting(true)
})
dateFolder.add(params, 'animateTime').name('播放日照')
dateFolder.add(params, 'timeSpeed', -0.5, 0.5, 0.01).name('时间速度')
controllers.sunElevation = dateFolder.add(folderState, 'sunElevation').name('太阳高度').disable()
controllers.sunAzimuth = dateFolder.add(folderState, 'sunAzimuth').name('太阳方位').disable()
dateFolder.open()

const cloudFolder = gui.addFolder('体积云')
cloudFolder.add(params, 'clouds', 0, 1, 0.01).name('云层覆盖').onChange(() => applyLighting(true))
cloudFolder.add(params, 'animateClouds').name('云层移动')
cloudFolder.add(params, 'cloudSpeed', 0, 5, 0.1).name('移动速度')
cloudFolder.open()

const atmoFolder = gui.addFolder('大气')
atmoFolder.add(params, 'skyExposure', 0.5, 20, 0.1).name('天空曝光').onChange(() => applyLighting(false))
atmoFolder.add(params, 'haze').name('大气薄雾').onChange(() => applyLighting(true))
atmoFolder.add(folderState, 'qualityLabel', Object.keys(qualityMap)).name('渲染质量').onChange((label) => {
  params.quality = qualityMap[label]
  sky.configure(params.quality)
  applyLighting(true)
})
atmoFolder.add(params, 'toneMappingExposure', 0.2, 2, 0.01).name('色调曝光').onChange((value) => {
  renderer.toneMappingExposure = value
})
atmoFolder.open()

const sceneFolder = gui.addFolder('场景')
sceneFolder.add(params, 'showGround').name('显示地面').onChange((value) => { ground.visible = value })
sceneFolder.add(params, 'paused').name('暂停')
sceneFolder.add(params, 'resetCamera').name('重置相机')
sceneFolder.open()

applyLighting(true)

sky.ready.then(() => {
  if (disposed) return
  overlay.hidden = true
  status.textContent = '大气就绪 · GUI 可调'
  dot.classList.remove('busy')
  applyLighting(true)
  sky.update(weather.cloudTime, true, time)
}).catch((error) => {
  overlayText.textContent = `加载失败：${error instanceof Error ? error.message : String(error)}`
  status.textContent = '加载失败'
})

function frame(now) {
  if (disposed) return
  requestAnimationFrame(frame)
  const delta = last ? Math.min((now - last) / 1000, 0.05) : 1 / 60
  last = now
  controls.update()
  if (!params.paused) {
    time += delta
    if (weather.advance(delta, params)) applyLighting(false)
  }
  sky.update(weather.cloudTime, false, time)
  renderer.render(scene, camera)
}
requestAnimationFrame(frame)

window.addEventListener('beforeunload', () => {
  disposed = true
  gui.destroy()
  controls.dispose()
  sky.dispose()
  ground.geometry.dispose()
  ground.material.dispose()
  renderer.dispose()
})

  </script>
</body>
</html>
