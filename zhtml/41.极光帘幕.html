<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>41.极光帘幕</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #container, canvas { width: 100%; height: 100%; display: block; }
    body { overflow: hidden; background: #020305; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
      "@petamoriken/float16": "https://cdn.jsdelivr.net/npm/@petamoriken/float16@3.9.2/browser/float16.mjs",
      "astronomy-engine": "https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/esm/astronomy.js",
      "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js",
      "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.37.4/build/index.js",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/build/index.module.js",
      "three-stdlib": "../assets/awesome/runtime/exr-loader.js"
    }
  }
  </script>
</head>
<body>
  <div id="container"><canvas id="view"></canvas></div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GUI } from "three/addons/libs/lil-gui.module.min.js";
    import Stats from "three/addons/libs/stats.module.js";

        import {
    
      AURORA_CURTAIN_PRESET,
    
      AURORA_PROBE_SIZE,
    
      AURORA_VOLUME_GLSL,
    
      createAuroraCurtains,
    
    } from "../assets/awesome/skills/threejs-procedural-vfx/examples/raymarched-aurora-curtains/aurora-curtains.js";
    
    import { createPolarNightSky } from "../assets/awesome/examples/threejs-procedural-vfx/raymarched-aurora-curtains/polar-night-sky.js";
    
    import { createSnowDesert } from "../assets/awesome/examples/threejs-procedural-vfx/raymarched-aurora-curtains/snow-desert.js";
    
    
    
    const CAMERA_EYE_HEIGHT = 45;
    
    
    
    function addFullscreenQuad(THREE, targetScene, geometry, material) {
    
      const quad = new THREE.Mesh(geometry, material);
    
      quad.frustumCulled = false;
    
      targetScene.add(quad);
    
      return quad;
    
    }
    
    
    
    const sceneModule = {
    
      backend: "webgl",
    
      initialTime: 0,
    
      renderer: {
    
        options: {
    
          antialias: false,
    
          alpha: false,
    
          powerPreference: "high-performance",
    
        },
    
        clearColor: 0x04070e,
    
      },
    
      camera: {
    
        fov: 60,
    
        near: 0.1,
    
        far: 12000,
    
        position: [0, 45, 0],
    
      },
    
      controls: {
    
        target: [0, 90, -200],
    
        enableDamping: true,
    
        dampingFactor: 0.06,
    
        enablePan: true,
    
        screenSpacePanning: true,
    
        minDistance: 3,
    
        maxDistance: 1800,
    
        minPolarAngle: 0.2,
    
        maxPolarAngle: 2.2,
    
      },
    
    
    
      async setup({ THREE, renderer, scene, camera, controls }) {
    
        renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
    
        renderer.toneMapping = THREE.NoToneMapping;
    
        renderer.autoClear = false;
    
        renderer.setClearColor(0x04070e, 1);
    
    
    
        const quadCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    
        const quadGeometry = new THREE.PlaneGeometry(2, 2);
    
        const skyBackdropScene = new THREE.Scene();
    
        const auroraScreenScene = new THREE.Scene();
    
        const compositeScene = new THREE.Scene();
    
        const probeDebugScene = new THREE.Scene();
    
        const probeBackdropScene = new THREE.Scene();
    
    
    
        const skyTarget = new THREE.WebGLRenderTarget(2, 2, {
    
          type: THREE.HalfFloatType,
    
          format: THREE.RGBAFormat,
    
          minFilter: THREE.LinearFilter,
    
          magFilter: THREE.LinearFilter,
    
          colorSpace: THREE.LinearSRGBColorSpace,
    
          depthBuffer: false,
    
          stencilBuffer: false,
    
        });
    
        const probeTarget = new THREE.WebGLRenderTarget(
    
          AURORA_PROBE_SIZE.width,
    
          AURORA_PROBE_SIZE.height,
    
          {
    
            type: THREE.HalfFloatType,
    
            format: THREE.RGBAFormat,
    
            minFilter: THREE.LinearFilter,
    
            magFilter: THREE.LinearFilter,
    
            wrapS: THREE.RepeatWrapping,
    
            colorSpace: THREE.LinearSRGBColorSpace,
    
            depthBuffer: false,
    
            stencilBuffer: false,
    
          },
    
        );
    
    
    
        const aurora = createAuroraCurtains({ intensity: 1.15 });
    
        aurora.screenMaterial.blending = THREE.NoBlending;
    
        const polarNight = createPolarNightSky({
    
          auroraUniforms: aurora.uniforms,
    
          auroraGlsl: AURORA_VOLUME_GLSL,
    
          raySteps: AURORA_CURTAIN_PRESET.raySteps,
    
          probeRaySteps: AURORA_CURTAIN_PRESET.probeRaySteps,
    
          skyTexture: skyTarget.texture,
    
          probeTexture: probeTarget.texture,
    
        });
    
        const snowDesert = createSnowDesert({
    
          scene,
    
          auroraUniforms: aurora.uniforms,
    
          skyUniforms: polarNight.uniforms,
    
          probeTexture: probeTarget.texture,
    
        });
    
    
    
        addFullscreenQuad(
    
          THREE,
    
          skyBackdropScene,
    
          quadGeometry,
    
          polarNight.backdropMaterial,
    
        );
    
        addFullscreenQuad(
    
          THREE,
    
          auroraScreenScene,
    
          quadGeometry,
    
          aurora.screenMaterial,
    
        );
    
        addFullscreenQuad(
    
          THREE,
    
          compositeScene,
    
          quadGeometry,
    
          polarNight.compositeMaterial,
    
        );
    
        addFullscreenQuad(
    
          THREE,
    
          probeDebugScene,
    
          quadGeometry,
    
          polarNight.probeDebugMaterial,
    
        );
    
        addFullscreenQuad(
    
          THREE,
    
          probeBackdropScene,
    
          quadGeometry,
    
          polarNight.probeBackdropMaterial,
    
        );
    
        camera.position.set(0, snowDesert.groundHeight(0, 0) + CAMERA_EYE_HEIGHT, 0);
    
        camera.rotation.set(0.3, 0.4, 0, "YXZ");
    
        camera.updateMatrixWorld(true);
    
        const initialDirection = new THREE.Vector3();
    
        camera.getWorldDirection(initialDirection);
    
        controls.target.copy(camera.position).addScaledVector(initialDirection, 400);
    
        controls.update();
    
    
    
        let debugMode = "final";
    
    
    
        renderer.compile(skyBackdropScene, quadCamera);
    
        renderer.compile(auroraScreenScene, quadCamera);
    
        renderer.compile(scene, camera);
    
    
    
        return {
    
          setDebugMode(mode) {
    
            debugMode = mode;
    
          },
    
          resize({ bufferWidth, bufferHeight }) {
    
            aurora.setSize(bufferWidth, bufferHeight);
    
            snowDesert.setViewportHeight(bufferHeight);
    
            skyTarget.setSize(bufferWidth, bufferHeight);
    
          },
    
          update({ elapsed }) {
    
            const groundMinimum = snowDesert.groundHeight(
    
              camera.position.x,
    
              camera.position.z,
    
            ) + 1;
    
            if (camera.position.y < groundMinimum) {
    
              camera.position.y = groundMinimum;
    
            }
    
            controls.update();
    
            aurora.update(elapsed, camera);
    
            snowDesert.update(camera, CAMERA_EYE_HEIGHT);
    
          },
    
          render() {
    
            const auroraOnly = debugMode === "aurora-only";
    
    
    
            if (auroraOnly) {
    
              renderer.setRenderTarget(skyTarget);
    
              renderer.clear(true, false, false);
    
              renderer.render(auroraScreenScene, quadCamera);
    
              renderer.setRenderTarget(null);
    
              renderer.clear(true, true, true);
    
              renderer.render(compositeScene, quadCamera);
    
              return;
    
            }
    
    
    
            const savedAuroraGain = aurora.uniforms.uAuroraGain.value;
    
            if (debugMode === "no-aurora") {
    
              aurora.uniforms.uAuroraGain.value = 0;
    
            }
    
    
    
            renderer.setRenderTarget(probeTarget);
    
            renderer.clear(true, false, false);
    
            renderer.render(probeBackdropScene, quadCamera);
    
    
    
            if (debugMode === "radiance-probe") {
    
              aurora.uniforms.uAuroraGain.value = savedAuroraGain;
    
              renderer.setRenderTarget(null);
    
              renderer.clear(true, true, true);
    
              renderer.render(probeDebugScene, quadCamera);
    
              return;
    
            }
    
    
    
            renderer.setRenderTarget(skyTarget);
    
            renderer.clear(true, false, false);
    
            renderer.render(skyBackdropScene, quadCamera);
    
            aurora.uniforms.uAuroraGain.value = savedAuroraGain;
    
    
    
            renderer.setRenderTarget(null);
    
            renderer.clear(true, true, true);
    
            renderer.render(compositeScene, quadCamera);
    
            renderer.render(scene, camera);
    
          },
    
          metrics() {
    
            return {
    
              auroraSteps: AURORA_CURTAIN_PRESET.raySteps,
    
              probeSteps: AURORA_CURTAIN_PRESET.probeRaySteps,
    
              terrainLevels: snowDesert.terrainLevels.length,
    
              snowParticles: 9000,
    
            };
    
          },
    
          dispose() {
    
            snowDesert.dispose();
    
            polarNight.dispose();
    
            aurora.dispose();
    
            skyTarget.dispose();
    
            probeTarget.dispose();
    
            quadGeometry.dispose();
    
          },
    
        };
    
      },
    
    };

    if ((sceneModule.backend === "webgpu" || sceneModule.backend === "raw-webgpu") && !navigator.gpu) {
      throw new Error("WebGPU unavailable");
    }

    const canvas = document.querySelector("#view");
    const rawWebGpu = sceneModule.backend === "raw-webgpu";
    const rendererOptions = {
      canvas,
      antialias: true,
      powerPreference: "high-performance",
      ...(sceneModule.renderer?.options ?? {}),
    };
    const renderer = rawWebGpu
      ? null
      : sceneModule.backend === "webgpu"
        ? new THREE.WebGPURenderer(rendererOptions)
        : new THREE.WebGLRenderer(rendererOptions);

    if (typeof renderer?.init === "function") await renderer.init();
    if (renderer) {
      renderer.outputColorSpace = sceneModule.renderer?.outputColorSpace ?? THREE.SRGBColorSpace;
      renderer.toneMapping = sceneModule.renderer?.toneMapping ?? THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = sceneModule.renderer?.exposure ?? 1;
    }
    if (renderer && sceneModule.renderer?.clearColor != null) {
      renderer.setClearColor(sceneModule.renderer.clearColor, sceneModule.renderer.clearAlpha ?? 1);
    }

    const scene = new THREE.Scene();
    const cameraConfig = sceneModule.camera ?? {};
    const camera = cameraConfig.type === "orthographic"
      ? new THREE.OrthographicCamera(
          cameraConfig.left ?? -1,
          cameraConfig.right ?? 1,
          cameraConfig.top ?? 1,
          cameraConfig.bottom ?? -1,
          cameraConfig.near ?? 0,
          cameraConfig.far ?? 1,
        )
      : new THREE.PerspectiveCamera(
          cameraConfig.fov ?? 50,
          1,
          cameraConfig.near ?? 0.1,
          cameraConfig.far ?? 2000,
        );
    if (cameraConfig.position) camera.position.fromArray(cameraConfig.position);
    if (cameraConfig.up) camera.up.fromArray(cameraConfig.up);

    const controlsConfig = sceneModule.controls ?? {};
    const controls = controlsConfig.enabled === false || cameraConfig.type === "orthographic"
      ? null
      : new OrbitControls(camera, canvas);
    if (controls) {
      controls.enableDamping = controlsConfig.enableDamping ?? true;
      controls.dampingFactor = controlsConfig.dampingFactor ?? 0.08;
      controls.enablePan = controlsConfig.enablePan ?? true;
      controls.enableZoom = controlsConfig.enableZoom ?? true;
      controls.screenSpacePanning = controlsConfig.screenSpacePanning ?? true;
      controls.minDistance = controlsConfig.minDistance ?? 0;
      controls.maxDistance = controlsConfig.maxDistance ?? Infinity;
      controls.minPolarAngle = controlsConfig.minPolarAngle ?? 0;
      controls.maxPolarAngle = controlsConfig.maxPolarAngle ?? Math.PI;
      controls.minAzimuthAngle = controlsConfig.minAzimuthAngle ?? -Infinity;
      controls.maxAzimuthAngle = controlsConfig.maxAzimuthAngle ?? Infinity;
      controls.target.fromArray(controlsConfig.target ?? [0, 0, 0]);
      controls.update();
    }

    function resolveAsset(relativePath) {
      if (/^https?:\/\//.test(relativePath)) return relativePath;
      return new URL(relativePath, new URL("../assets/awesome/examples/threejs-procedural-vfx/raymarched-aurora-curtains/", import.meta.url)).href;
    }

    const example = await sceneModule.setup({
      THREE,
      canvas,
      renderer,
      scene,
      camera,
      controls,
      resolveAsset,
    }) ?? {};

    const params = {
      paused: false,
      timeScale: 1,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      debugMode: "final",
    };
    if (renderer) renderer.setPixelRatio(params.dpr);
    example.setDebugMode?.(params.debugMode);

    const drawingBufferSize = renderer ? new THREE.Vector2() : null;
    function resize() {
      const width = Math.max(1, canvas.clientWidth);
      const height = Math.max(1, canvas.clientHeight);
      const bufferWidth = Math.round(width * params.dpr);
      const bufferHeight = Math.round(height * params.dpr);
      if (rawWebGpu) {
        example.resize?.({ width, height, bufferWidth, bufferHeight, dpr: params.dpr });
        if (camera.isPerspectiveCamera) {
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        }
        return;
      }
      renderer.getDrawingBufferSize(drawingBufferSize);
      if (drawingBufferSize.x === bufferWidth && drawingBufferSize.y === bufferHeight) return;
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(width, height, false);
      if (camera.isPerspectiveCamera) {
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }
      example.resize?.({ width, height, bufferWidth, bufferHeight, dpr: params.dpr });
    }

    const stats = new Stats();
    document.body.appendChild(stats.dom);
    const gui = new GUI({ title: "41.极光帘幕" });
    gui.add(params, "paused").name("暂停");
    gui.add(params, "timeScale", 0, 3, 0.05).name("时间缩放");
    gui.add(params, "dpr", 0.5, 2, 0.25).name("像素比").onChange(resize);
    gui.add(params, "debugMode", {
      "Final": "final",
      "Aurora only": "aurora-only",
      "No aurora": "no-aurora",
      "Radiance probe": "radiance-probe",
    }).name("调试").onChange((value) => example.setDebugMode?.(value));

    let elapsed = sceneModule.initialTime ?? 0;
    let previous = performance.now();
    let frameInProgress = false;
    resize();

    async function frame(now) {
      if (frameInProgress) return;
      frameInProgress = true;
      try {
        stats.update();
        resize();
        const rawDelta = Math.min((now - previous) / 1000, 0.1);
        previous = now;
        const delta = params.paused ? 0 : rawDelta * params.timeScale;
        elapsed += delta;
        controls?.update();
        await example.update?.({ delta, rawDelta, elapsed, state: params, camera, controls });
        if (example.render) {
          await example.render({ renderer, scene, camera, elapsed, delta, rawDelta, state: params });
        } else if (typeof renderer?.renderAsync === "function") {
          await renderer.renderAsync(scene, camera);
        } else if (renderer) {
          renderer.render(scene, camera);
        }
      } finally {
        frameInProgress = false;
      }
    }

    if (rawWebGpu) {
      let rawAnimationFrame = 0;
      let rawLoopStopped = false;
      const rawLoop = async (now) => {
        await frame(now);
        if (!rawLoopStopped) rawAnimationFrame = requestAnimationFrame(rawLoop);
      };
      rawAnimationFrame = requestAnimationFrame(rawLoop);
      window.addEventListener("pagehide", () => {
        rawLoopStopped = true;
        cancelAnimationFrame(rawAnimationFrame);
        gui.destroy();
        stats.dom.remove();
        controls?.dispose();
        example.dispose?.();
      }, { once: true });
    } else {
      renderer.setAnimationLoop(frame);
      window.addEventListener("pagehide", () => {
        renderer.setAnimationLoop(null);
        gui.destroy();
        stats.dom.remove();
        controls?.dispose();
        example.dispose?.();
        renderer.dispose();
      }, { once: true });
    }
  </script>
</body>
</html>
