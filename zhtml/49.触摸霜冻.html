<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>49.触摸霜冻</title>
  <link rel="stylesheet" href="../assets/loading-overlay.css">
  <style>html{background:#02060c}</style>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #container, canvas { width: 100%; height: 100%; display: block; }
    body { overflow: hidden; background: #020305; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
      "@petamoriken/float16": "https://cdn.jsdelivr.net/npm/@petamoriken/float16@3.9.2/browser/float16.mjs",
      "astronomy-engine": "https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/esm/astronomy.js",
      "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js",
      "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.37.4/build/index.js",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/build/index.module.js",
      "three-stdlib": "https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/runtime/exr-loader.js"
    }
  }
  </script>
</head>
<body>
  <div id="scene-loader">
    <div class="grid"></div>
    <div class="scan"></div>
    <div class="glow"></div>
    <div class="hud">
      <i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i>
      <div class="kicker"><span>SYS // GRAPHICS PIPELINE</span><span class="pulse"></span></div>
      <div class="title">INITIALIZING</div>
      <div class="sub">awaiting asset handshake</div>
      <div class="file" id="sl-file">&gt;&gt; 链路建立中…</div>
      <div class="track"><div class="fill" id="sl-fill"></div><div class="ticks"></div></div>
      <div class="meta">
        <div class="cell"><span>进度 PROG</span><b id="sl-pct">00.0%</b></div>
        <div class="cell"><span>速率 RATE</span><b id="sl-speed">—</b></div>
        <div class="cell"><span>体积 SIZE</span><b id="sl-size">0 B / --</b></div>
        <div class="cell"><span>剩余 ETA</span><b id="sl-eta">—</b></div>
      </div>
    </div>
  </div>
  <script src="../assets/loading-overlay.js"></script>
  <div id="container"><canvas id="view"></canvas></div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GUI } from "three/addons/libs/lil-gui.module.min.js";
    import Stats from "three/addons/libs/stats.module.js";

        import { FrostSurfaceEffect } from "https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/skills/threejs-temporal-surfaces/examples/touch-history-frost/frost-surface-effect.js";
    
    
    
    const sceneModule = {
    
      renderer: {
    
        options: { antialias: false },
    
        exposure: 1,
    
        clearColor: 0x10141c,
    
      },
    
      camera: { type: "orthographic" },
    
      controls: { enabled: false },
    
    
    
      async setup({ THREE, renderer, canvas }) {
    
        const loader = new THREE.TextureLoader();
    
        const [
    
          sceneTexture,
    
          noiseTexture,
    
          mainNormalTexture,
    
          detailNormalTexture,
    
        ] = await Promise.all([
    
          loader.loadAsync(
    
            "https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/examples/threejs-temporal-surfaces/touch-history-frost/assets/winter_forest.jpeg",
    
          ),
    
          loader.loadAsync(
    
            "https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/skills/threejs-temporal-surfaces/assets/touch-history-frost/noise.webp",
    
          ),
    
          loader.loadAsync(
    
            "https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/skills/threejs-temporal-surfaces/assets/touch-history-frost/main-normal.webp",
    
          ),
    
          loader.loadAsync(
    
            "https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/skills/threejs-temporal-surfaces/assets/touch-history-frost/sub-normal.webp",
    
          ),
    
        ]);
    
    
    
        sceneTexture.colorSpace = THREE.SRGBColorSpace;
    
        for (const texture of [
    
          sceneTexture,
    
          noiseTexture,
    
          mainNormalTexture,
    
          detailNormalTexture,
    
        ]) {
    
          texture.wrapS = THREE.MirroredRepeatWrapping;
    
          texture.wrapT = THREE.MirroredRepeatWrapping;
    
          texture.needsUpdate = true;
    
        }
    
    
    
        const effect = new FrostSurfaceEffect(renderer, {
    
          sceneTexture,
    
          noiseTexture,
    
          mainNormalTexture,
    
          detailNormalTexture,
    
        });
    
    
    
        let touching = canvas.matches(":hover");
    
        const updatePointer = (event) => {
    
          const bounds = canvas.getBoundingClientRect();
    
          effect.setPointer(
    
            ((event.clientX - bounds.left) / bounds.width) * 2 - 1,
    
            -(((event.clientY - bounds.top) / bounds.height) * 2 - 1),
    
            touching,
    
          );
    
        };
    
        const onPointerDown = (event) => {
    
          if (event.pointerType === "touch") touching = true;
    
          canvas.setPointerCapture(event.pointerId);
    
          updatePointer(event);
    
        };
    
        const onPointerMove = (event) => {
    
          if (event.pointerType !== "touch") touching = true;
    
          if (touching) updatePointer(event);
    
        };
    
        const onPointerUp = (event) => {
    
          if (event.pointerType === "touch") touching = false;
    
          effect.setPointer(effect.pointer.x, effect.pointer.y, false);
    
          if (canvas.hasPointerCapture(event.pointerId)) {
    
            canvas.releasePointerCapture(event.pointerId);
    
          }
    
        };
    
        const onPointerOver = (event) => {
    
          if (event.pointerType !== "touch") {
    
            touching = true;
    
            updatePointer(event);
    
          }
    
        };
    
        const onPointerOut = (event) => {
    
          if (event.pointerType !== "touch") {
    
            touching = false;
    
            effect.setPointer(effect.pointer.x, effect.pointer.y, false);
    
          }
    
        };
    
    
    
        canvas.addEventListener("pointerdown", onPointerDown);
    
        canvas.addEventListener("pointermove", onPointerMove);
    
        canvas.addEventListener("pointerup", onPointerUp);
    
        canvas.addEventListener("pointercancel", onPointerUp);
    
        canvas.addEventListener("pointerover", onPointerOver);
    
        canvas.addEventListener("pointerout", onPointerOut);
    
    
    
        return {
    
          resize({ bufferWidth, bufferHeight }) {
    
            effect.resize(bufferWidth, bufferHeight);
    
          },
    
          setDebugMode(mode) {
    
            effect.setDebugMode(mode);
    
          },
    
          update({ delta }) {
    
            effect.update(delta);
    
          },
    
          render() {
    
            effect.render();
    
          },
    
          metrics() {
    
            return { tier: "full frost + 0.4× blur + half-float history" };
    
          },
    
          dispose() {
    
            canvas.removeEventListener("pointerdown", onPointerDown);
    
            canvas.removeEventListener("pointermove", onPointerMove);
    
            canvas.removeEventListener("pointerup", onPointerUp);
    
            canvas.removeEventListener("pointercancel", onPointerUp);
    
            canvas.removeEventListener("pointerover", onPointerOver);
    
            canvas.removeEventListener("pointerout", onPointerOut);
    
            effect.dispose();
    
            sceneTexture.dispose();
    
            noiseTexture.dispose();
    
            mainNormalTexture.dispose();
    
            detailNormalTexture.dispose();
    
          },
    
        };
    
      },
    
    };

    if ((sceneModule.backend === "webgpu" || sceneModule.backend === "raw-webgpu") && !navigator.gpu) {
      throw new Error("WebGPU unavailable");
    }

    const canvas = document.querySelector("#view");
    const rawWebGpu = sceneModule.backend === "raw-webgpu";
    const rendererOptions = {
      canvas,
      antialias: true,
      powerPreference: "high-performance",
      ...(sceneModule.renderer?.options ?? {}),
    };
    const renderer = rawWebGpu
      ? null
      : sceneModule.backend === "webgpu"
        ? new THREE.WebGPURenderer(rendererOptions)
        : new THREE.WebGLRenderer(rendererOptions);

    if (typeof renderer?.init === "function") await renderer.init();
    if (renderer) {
      renderer.outputColorSpace = sceneModule.renderer?.outputColorSpace ?? THREE.SRGBColorSpace;
      renderer.toneMapping = sceneModule.renderer?.toneMapping ?? THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = sceneModule.renderer?.exposure ?? 1;
    }
    if (renderer && sceneModule.renderer?.clearColor != null) {
      renderer.setClearColor(sceneModule.renderer.clearColor, sceneModule.renderer.clearAlpha ?? 1);
    }

    const scene = new THREE.Scene();
    const cameraConfig = sceneModule.camera ?? {};
    const camera = cameraConfig.type === "orthographic"
      ? new THREE.OrthographicCamera(
          cameraConfig.left ?? -1,
          cameraConfig.right ?? 1,
          cameraConfig.top ?? 1,
          cameraConfig.bottom ?? -1,
          cameraConfig.near ?? 0,
          cameraConfig.far ?? 1,
        )
      : new THREE.PerspectiveCamera(
          cameraConfig.fov ?? 50,
          1,
          cameraConfig.near ?? 0.1,
          cameraConfig.far ?? 2000,
        );
    if (cameraConfig.position) camera.position.fromArray(cameraConfig.position);
    if (cameraConfig.up) camera.up.fromArray(cameraConfig.up);

    const controlsConfig = sceneModule.controls ?? {};
    const controls = controlsConfig.enabled === false || cameraConfig.type === "orthographic"
      ? null
      : new OrbitControls(camera, canvas);
    if (controls) {
      controls.enableDamping = controlsConfig.enableDamping ?? true;
      controls.dampingFactor = controlsConfig.dampingFactor ?? 0.08;
      controls.enablePan = controlsConfig.enablePan ?? true;
      controls.enableZoom = controlsConfig.enableZoom ?? true;
      controls.screenSpacePanning = controlsConfig.screenSpacePanning ?? true;
      controls.minDistance = controlsConfig.minDistance ?? 0;
      controls.maxDistance = controlsConfig.maxDistance ?? Infinity;
      controls.minPolarAngle = controlsConfig.minPolarAngle ?? 0;
      controls.maxPolarAngle = controlsConfig.maxPolarAngle ?? Math.PI;
      controls.minAzimuthAngle = controlsConfig.minAzimuthAngle ?? -Infinity;
      controls.maxAzimuthAngle = controlsConfig.maxAzimuthAngle ?? Infinity;
      controls.target.fromArray(controlsConfig.target ?? [0, 0, 0]);
      controls.update();
    }

    function resolveAsset(relativePath) {
      if (/^https?:\/\//.test(relativePath)) return relativePath;
      return new URL(relativePath, new URL("https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/examples/threejs-temporal-surfaces/touch-history-frost/", import.meta.url)).href;
    }

    const example = await sceneModule.setup({
      THREE,
      canvas,
      renderer,
      scene,
      camera,
      controls,
      resolveAsset,
    }) ?? {};

    const params = {
      paused: false,
      timeScale: 1,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      debugMode: "final",
    };
    if (renderer) renderer.setPixelRatio(params.dpr);
    example.setDebugMode?.(params.debugMode);

    const drawingBufferSize = renderer ? new THREE.Vector2() : null;
    function resize() {
      const width = Math.max(1, canvas.clientWidth);
      const height = Math.max(1, canvas.clientHeight);
      const bufferWidth = Math.round(width * params.dpr);
      const bufferHeight = Math.round(height * params.dpr);
    if (rawWebGpu) {
        example.resize?.({ width, height, bufferWidth, bufferHeight, dpr: params.dpr });
        if (camera.isPerspectiveCamera) {
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        }
        return;
      }
      renderer.getDrawingBufferSize(drawingBufferSize);
      if (drawingBufferSize.x === bufferWidth && drawingBufferSize.y === bufferHeight) return;
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(width, height, false);
      if (camera.isPerspectiveCamera) {
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }
      example.resize?.({ width, height, bufferWidth, bufferHeight, dpr: params.dpr });
    }

    const stats = new Stats();
    document.body.appendChild(stats.dom);
    const gui = new GUI({ title: "49.触摸霜冻" });
    gui.add(params, "paused").name("暂停");
    gui.add(params, "timeScale", 0, 3, 0.05).name("时间缩放");
    gui.add(params, "dpr", 0.5, 2, 0.25).name("像素比").onChange(resize);
    gui.add(params, "debugMode", {
      "Final": "final",
      "Root scene": "root-scene",
      "Reduced blur": "blur",
      "Previous history": "history-previous",
      "Current deposit": "deposit",
      "Next history": "history-next",
      "Static structure": "structure",
      "Frost mask": "frost-mask",
      "No refraction": "no-refraction",
    }).name("调试").onChange((value) => example.setDebugMode?.(value));

    let elapsed = sceneModule.initialTime ?? 0;
    let previous = performance.now();
    let frameInProgress = false;
    resize();
    window.__sceneLoader?.done();

    async function frame(now) {
      if (frameInProgress) return;
      frameInProgress = true;
      try {
        stats.update();
        resize();
        const rawDelta = Math.min((now - previous) / 1000, 0.1);
        previous = now;
        const delta = params.paused ? 0 : rawDelta * params.timeScale;
        elapsed += delta;
        controls?.update();
        await example.update?.({ delta, rawDelta, elapsed, state: params, camera, controls });
        if (example.render) {
          await example.render({ renderer, scene, camera, elapsed, delta, rawDelta, state: params });
        } else if (typeof renderer?.renderAsync === "function") {
          await renderer.renderAsync(scene, camera);
        } else if (renderer) {
          renderer.render(scene, camera);
        }
      } finally {
        frameInProgress = false;
      }
    }

    if (rawWebGpu) {
      let rawAnimationFrame = 0;
      let rawLoopStopped = false;
      const rawLoop = async (now) => {
        await frame(now);
        if (!rawLoopStopped) rawAnimationFrame = requestAnimationFrame(rawLoop);
      };
      rawAnimationFrame = requestAnimationFrame(rawLoop);
      window.addEventListener("pagehide", () => {
        rawLoopStopped = true;
        cancelAnimationFrame(rawAnimationFrame);
        gui.destroy();
        stats.dom.remove();
        controls?.dispose();
        example.dispose?.();
      }, { once: true });
    } else {
      renderer.setAnimationLoop(frame);
      window.addEventListener("pagehide", () => {
        renderer.setAnimationLoop(null);
        gui.destroy();
        stats.dom.remove();
        controls?.dispose();
        example.dispose?.();
        renderer.dispose();
      }, { once: true });
    }
  </script>
</body>
</html>
