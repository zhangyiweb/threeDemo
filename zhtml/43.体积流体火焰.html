<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>43.体积流体火焰</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #container, canvas { width: 100%; height: 100%; display: block; }
    body { overflow: hidden; background: #020305; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
      "@petamoriken/float16": "https://cdn.jsdelivr.net/npm/@petamoriken/float16@3.9.2/browser/float16.mjs",
      "astronomy-engine": "https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/esm/astronomy.js",
      "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js",
      "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.37.4/build/index.js",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/build/index.module.js",
      "three-stdlib": "https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/runtime/exr-loader.js"
    }
  }
  </script>
</head>
<body>
  <div id="container"><canvas id="view"></canvas></div>
  <script type="module">
    import * as THREE from "three/webgpu";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GUI } from "three/addons/libs/lil-gui.module.min.js";
    import Stats from "three/addons/libs/stats.module.js";

        import { TeapotGeometry } from "three/addons/geometries/TeapotGeometry.js";
    
    import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
    
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    
    import { bloom } from "three/addons/tsl/display/BloomNode.js";
    
    import { color, Fn, mix, pass, uv } from "three/tsl";
    
    import {
    
      MeshPhysicalNodeMaterial,
    
      MeshStandardNodeMaterial,
    
      RenderPipeline,
    
    } from "three/webgpu";
    
    import {
    
      VolumetricFluidFire,
    
      VOLUMETRIC_FLUID_FIRE_PRESET,
    
    } from "https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/skills/threejs-procedural-vfx/examples/volumetric-fluid-fire/volumetric-fluid-fire.js";
    
    
    
    const VOLUME_LAYER = 10;
    
    const THUMBNAIL_WARMUP_FRAMES = 120;
    
    
    
    function createSeededRandom(seed) {
    
      let state = seed >>> 0;
    
      return () => {
    
        state += 0x6d2b79f5;
    
        let value = state;
    
        value = Math.imul(value ^ (value >>> 15), value | 1);
    
        value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
    
        return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
    
      };
    
    }
    
    
    
    const sceneModule = {
    
      backend: "webgpu",
    
      renderer: {
    
        options: {
    
          antialias: true,
    
          alpha: false,
    
          powerPreference: "high-performance",
    
        },
    
        clearColor: 0x000000,
    
      },
    
      camera: {
    
        fov: 60,
    
        near: 0.1,
    
        far: 100,
    
        position: [0, 3, 7],
    
      },
    
      controls: {
    
        target: [0, 2, 0],
    
        enableDamping: true,
    
        dampingFactor: 0.05,
    
        enablePan: true,
    
        minDistance: 5,
    
        maxDistance: 15,
    
        minPolarAngle: Math.PI / 2.5,
    
        maxPolarAngle: Math.PI / 2,
    
      },
    
    
    
      async setup({ THREE, renderer, scene, camera, controls, resolveAsset }) {
    
        renderer.shadowMap.enabled = true;
    
        renderer.shadowMap.transmitted = true;
    
        scene.background = new THREE.Color(0x000000);
    
    
    
        const dracoLoader = new DRACOLoader();
    
        dracoLoader.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/libs/draco/");
    
        const gltfLoader = new GLTFLoader();
    
        gltfLoader.setDRACOLoader(dracoLoader);
    
    
    
        const gltf = await gltfLoader.loadAsync(
    
          resolveAsset("https://raw.githubusercontent.com/zhangyiweb/models/main/%E4%BD%93%E7%A7%AF%E6%B5%81%E4%BD%93%E7%81%AB%E7%84%B0/demo-scene.glb"),
    
        );
    
        scene.add(gltf.scene);
    
    
    
        const volumeBounds = gltf.scene.getObjectByName("sim");
    
        const fireEmitter = gltf.scene.getObjectByName("fire");
    
        const backdrop = gltf.scene.getObjectByName("backdrop");
    
        const teapotAnchor = gltf.scene.getObjectByName("teapot");
    
        const authoredCamera = gltf.cameras[0];
    
        if (!volumeBounds || !fireEmitter || !backdrop || !teapotAnchor || !authoredCamera) {
    
          throw new Error("The volumetric fire stage is missing required named objects.");
    
        }
    
    
    
        camera.position.copy(authoredCamera.position);
    
        camera.rotation.copy(authoredCamera.rotation);
    
        camera.fov = authoredCamera.fov + 20;
    
        camera.translateZ(-11);
    
        camera.updateProjectionMatrix();
    
        controls.target.y = 2;
    
        controls.update();
    
    
    
        const spotLight = new THREE.SpotLight(0xffffff, 11);
    
        spotLight.position.set(0, 12, 0);
    
        spotLight.angle = Math.PI;
    
        spotLight.penumbra = 1;
    
        spotLight.decay = 1;
    
        spotLight.distance = 0;
    
        spotLight.castShadow = true;
    
        spotLight.shadow.intensity = 0.98;
    
        spotLight.shadow.mapSize.set(1024, 1024);
    
        spotLight.shadow.camera.near = 1;
    
        spotLight.shadow.camera.far = 66;
    
        spotLight.shadow.focus = 1;
    
        spotLight.layers.enable(VOLUME_LAYER);
    
        spotLight.target.position.set(0, 0, 0);
    
        scene.add(spotLight, spotLight.target);
    
    
    
        backdrop.material = new MeshStandardNodeMaterial({
    
          side: THREE.DoubleSide,
    
          colorNode: Fn(() => {
    
            const uvNode = uv();
    
            const checker = uvNode.x
    
              .mul(20)
    
              .floor()
    
              .add(uvNode.y.mul(20).floor())
    
              .mod(2);
    
            return mix(color("#bdbdbd").mul(0.1), color("#8c8c8c").mul(0.1), checker);
    
          })(),
    
        });
    
    
    
        const collidersMaterial = new MeshPhysicalNodeMaterial({
    
          colorNode: color("black"),
    
          roughness: 1,
    
          metalness: 0,
    
        });
    
        const teapot = new THREE.Mesh(
    
          new TeapotGeometry(0.5, 5),
    
          collidersMaterial,
    
        );
    
        teapotAnchor.add(teapot);
    
    
    
        const worldHalfExtents = volumeBounds.scale.clone();
    
        const fullSize = worldHalfExtents.clone().multiplyScalar(2);
    
        const voxelSizeRender = Math.max(fullSize.x, fullSize.y, fullSize.z) / 100;
    
        const voxelSizePhysics = Math.max(fullSize.x, fullSize.y, fullSize.z) / 80;
    
        const fire = new VolumetricFluidFire(renderer, {
    
          renderLayer: VOLUME_LAYER,
    
          size: {
    
            boundingBox: fullSize,
    
            renderResolution: fullSize.clone().divideScalar(voxelSizeRender).round(),
    
            physicsResolution: fullSize.clone().divideScalar(voxelSizePhysics).round(),
    
          },
    
          steps: 22,
    
          burnableMeshes: [
    
            { geometriesInsideOf: fireEmitter, maxCount: 1, id: "primary" },
    
            { geometriesInsideOf: teapot, maxCount: 1, id: "teapot" },
    
          ],
    
          noise: { size: 64, frecuency: 30 },
    
          vertexEmissionWorldRadius: 0.01,
    
          blurStrength: 0,
    
          debug: {},
    
          collisions: { disabled: false },
    
        });
    
        fire.keyLightPosition = spotLight.position;
    
        fire.position.copy(volumeBounds.position);
    
        fire.rotation.copy(volumeBounds.rotation);
    
        scene.add(fire);
    
    
    
        fireEmitter.material = new MeshStandardNodeMaterial({
    
          color: "#222222",
    
          wireframe: true,
    
        });
    
        fireEmitter.add(
    
          fire.getFireFor("primary", { emitMultiplier: 13, tintFactor: 0 }),
    
        );
    
        teapot.add(
    
          fire.getFireFor("teapot", { emitMultiplier: 22, tintFactor: 1 }),
    
        );
    
    
    
        const hemisphere = new THREE.HemisphereLight(0, "#ffce8e", 5);
    
        scene.add(hemisphere);
    
    
    
        const random = createSeededRandom(0x51f15e);
    
        const colliders = [];
    
        gltf.scene.traverse((object) => {
    
          if (!object.userData.collider) return;
    
          const collider = object.children[0];
    
          if (!collider) return;
    
          colliders.push(object);
    
          fire.makeObjectCollidable(collider, object.userData.collider);
    
          collider.material = collidersMaterial;
    
          object.userData.angularSpeed = 1 + random();
    
        });
    
    
    
        await fire.initialize();
    
    
    
        const renderPipeline = new RenderPipeline(renderer);
    
        const scenePass = pass(scene, camera);
    
        const sceneDepth = scenePass.getTextureNode("depth");
    
        const fireScene = fire.getRenderPass(scene, camera, sceneDepth)
    
          .toInspector("Volumetric fire");
    
        const scenePassColor = scenePass.add(fireScene);
    
        const compositedOutput = scenePassColor.add(
    
          bloom(fireScene, 0.01, 0.1, 13).setResolutionScale(0.5),
    
        );
    
        renderPipeline.outputNode = compositedOutput;
    
        fire.applySettingsSnapshot(VOLUMETRIC_FLUID_FIRE_PRESET);
    
    
    
        const advanceScene = (delta, elapsed) => {
    
          teapot.rotateZ(delta);
    
          teapot.rotateY(delta * 0.2);
    
          teapot.position.y = 1 + Math.cos(elapsed) * 0.3;
    
          for (const collider of colliders) {
    
            collider.rotateY(delta * collider.userData.angularSpeed);
    
          }
    
          fire.update?.(delta);
    
        };
    
    
    
        if (new URLSearchParams(globalThis.location.search).get("galleryThumbnail") === "1") {
    
          let warmElapsed = 0;
    
          for (let frame = 0; frame < THUMBNAIL_WARMUP_FRAMES; frame += 1) {
    
            await new Promise((resolve) => requestAnimationFrame(resolve));
    
            warmElapsed += 1 / 60;
    
            advanceScene(1 / 60, warmElapsed);
    
          }
    
        }
    
    
    
        return {
    
          setDebugMode(mode) {
    
            const noBloom = mode === "no-bloom";
    
            fire.setDebugMode(noBloom ? "final" : mode);
    
            renderPipeline.outputNode = mode === "final" ? compositedOutput : scenePassColor;
    
          },
    
          update({ delta, elapsed }) {
    
            controls.target.set(
    
              THREE.MathUtils.clamp(controls.target.x, -3.81, 3.81),
    
              THREE.MathUtils.clamp(controls.target.y, 0.25, 5.75),
    
              THREE.MathUtils.clamp(controls.target.z, -1.88, 1.88),
    
            );
    
            controls.update();
    
            if (delta <= 0) return;
    
            advanceScene(delta, elapsed);
    
          },
    
          render() {
    
            renderPipeline.render();
    
          },
    
          metrics() {
    
            return {
    
              renderGrid: `${fire.shaderContext.grid.dye.size.x}×${fire.shaderContext.grid.dye.size.y}×${fire.shaderContext.grid.dye.size.z}`,
    
              physicsGrid: `${fire.shaderContext.grid.phy.size.x}×${fire.shaderContext.grid.phy.size.y}×${fire.shaderContext.grid.phy.size.z}`,
    
              raymarchSteps: fire.volumetricMaterial.steps,
    
              pressureIterations: fire.pressureIterations,
    
            };
    
          },
    
          dispose() {
    
            dracoLoader.dispose();
    
            teapot.geometry.dispose();
    
            collidersMaterial.dispose();
    
            backdrop.material.dispose();
    
            fireEmitter.material.dispose();
    
          },
    
        };
    
      },
    
    };

    if ((sceneModule.backend === "webgpu" || sceneModule.backend === "raw-webgpu") && !navigator.gpu) {
      throw new Error("WebGPU unavailable");
    }

    const canvas = document.querySelector("#view");
    const rawWebGpu = sceneModule.backend === "raw-webgpu";
    const rendererOptions = {
      canvas,
      antialias: true,
      powerPreference: "high-performance",
      ...(sceneModule.renderer?.options ?? {}),
    };
    const renderer = rawWebGpu
      ? null
      : sceneModule.backend === "webgpu"
        ? new THREE.WebGPURenderer(rendererOptions)
        : new THREE.WebGLRenderer(rendererOptions);

    if (typeof renderer?.init === "function") await renderer.init();
    if (renderer) {
      renderer.outputColorSpace = sceneModule.renderer?.outputColorSpace ?? THREE.SRGBColorSpace;
      renderer.toneMapping = sceneModule.renderer?.toneMapping ?? THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = sceneModule.renderer?.exposure ?? 1;
    }
    if (renderer && sceneModule.renderer?.clearColor != null) {
      renderer.setClearColor(sceneModule.renderer.clearColor, sceneModule.renderer.clearAlpha ?? 1);
    }

    const scene = new THREE.Scene();
    const cameraConfig = sceneModule.camera ?? {};
    const camera = cameraConfig.type === "orthographic"
      ? new THREE.OrthographicCamera(
          cameraConfig.left ?? -1,
          cameraConfig.right ?? 1,
          cameraConfig.top ?? 1,
          cameraConfig.bottom ?? -1,
          cameraConfig.near ?? 0,
          cameraConfig.far ?? 1,
        )
      : new THREE.PerspectiveCamera(
          cameraConfig.fov ?? 50,
          1,
          cameraConfig.near ?? 0.1,
          cameraConfig.far ?? 2000,
        );
    if (cameraConfig.position) camera.position.fromArray(cameraConfig.position);
    if (cameraConfig.up) camera.up.fromArray(cameraConfig.up);

    const controlsConfig = sceneModule.controls ?? {};
    const controls = controlsConfig.enabled === false || cameraConfig.type === "orthographic"
      ? null
      : new OrbitControls(camera, canvas);
    if (controls) {
      controls.enableDamping = controlsConfig.enableDamping ?? true;
      controls.dampingFactor = controlsConfig.dampingFactor ?? 0.08;
      controls.enablePan = controlsConfig.enablePan ?? true;
      controls.enableZoom = controlsConfig.enableZoom ?? true;
      controls.screenSpacePanning = controlsConfig.screenSpacePanning ?? true;
      controls.minDistance = controlsConfig.minDistance ?? 0;
      controls.maxDistance = controlsConfig.maxDistance ?? Infinity;
      controls.minPolarAngle = controlsConfig.minPolarAngle ?? 0;
      controls.maxPolarAngle = controlsConfig.maxPolarAngle ?? Math.PI;
      controls.minAzimuthAngle = controlsConfig.minAzimuthAngle ?? -Infinity;
      controls.maxAzimuthAngle = controlsConfig.maxAzimuthAngle ?? Infinity;
      controls.target.fromArray(controlsConfig.target ?? [0, 0, 0]);
      controls.update();
    }

    function resolveAsset(relativePath) {
      if (/^https?:\/\//.test(relativePath)) return relativePath;
      return new URL(relativePath, new URL("https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/examples/threejs-procedural-vfx/volumetric-fluid-fire/", import.meta.url)).href;
    }

    const example = await sceneModule.setup({
      THREE,
      canvas,
      renderer,
      scene,
      camera,
      controls,
      resolveAsset,
    }) ?? {};

    const params = {
      paused: false,
      timeScale: 1,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      debugMode: "final",
    };
    if (renderer) renderer.setPixelRatio(params.dpr);
    example.setDebugMode?.(params.debugMode);

    const drawingBufferSize = renderer ? new THREE.Vector2() : null;
    function resize() {
      const width = Math.max(1, canvas.clientWidth);
      const height = Math.max(1, canvas.clientHeight);
      const bufferWidth = Math.round(width * params.dpr);
      const bufferHeight = Math.round(height * params.dpr);
      if (rawWebGpu) {
        example.resize?.({ width, height, bufferWidth, bufferHeight, dpr: params.dpr });
        if (camera.isPerspectiveCamera) {
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        }
        return;
      }
      renderer.getDrawingBufferSize(drawingBufferSize);
      if (drawingBufferSize.x === bufferWidth && drawingBufferSize.y === bufferHeight) return;
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(width, height, false);
      if (camera.isPerspectiveCamera) {
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }
      example.resize?.({ width, height, bufferWidth, bufferHeight, dpr: params.dpr });
    }

    const stats = new Stats();
    document.body.appendChild(stats.dom);
    const gui = new GUI({ title: "43.体积流体火焰" });
    gui.add(params, "paused").name("暂停");
    gui.add(params, "timeScale", 0, 3, 0.05).name("时间缩放");
    gui.add(params, "dpr", 0.5, 2, 0.25).name("像素比").onChange(resize);
    gui.add(params, "debugMode", {
      "Final": "final",
      "No bloom": "no-bloom",
      "Density": "density",
      "Temperature": "temperature",
      "Velocity": "velocity",
      "Colliders": "colliders",
    }).name("调试").onChange((value) => example.setDebugMode?.(value));

    let elapsed = sceneModule.initialTime ?? 0;
    let previous = performance.now();
    let frameInProgress = false;
    resize();

    async function frame(now) {
      if (frameInProgress) return;
      frameInProgress = true;
      try {
        stats.update();
        resize();
        const rawDelta = Math.min((now - previous) / 1000, 0.1);
        previous = now;
        const delta = params.paused ? 0 : rawDelta * params.timeScale;
        elapsed += delta;
        controls?.update();
        await example.update?.({ delta, rawDelta, elapsed, state: params, camera, controls });
        if (example.render) {
          await example.render({ renderer, scene, camera, elapsed, delta, rawDelta, state: params });
        } else if (typeof renderer?.renderAsync === "function") {
          await renderer.renderAsync(scene, camera);
        } else if (renderer) {
          renderer.render(scene, camera);
        }
      } finally {
        frameInProgress = false;
      }
    }

    if (rawWebGpu) {
      let rawAnimationFrame = 0;
      let rawLoopStopped = false;
      const rawLoop = async (now) => {
        await frame(now);
        if (!rawLoopStopped) rawAnimationFrame = requestAnimationFrame(rawLoop);
      };
      rawAnimationFrame = requestAnimationFrame(rawLoop);
      window.addEventListener("pagehide", () => {
        rawLoopStopped = true;
        cancelAnimationFrame(rawAnimationFrame);
        gui.destroy();
        stats.dom.remove();
        controls?.dispose();
        example.dispose?.();
      }, { once: true });
    } else {
      renderer.setAnimationLoop(frame);
      window.addEventListener("pagehide", () => {
        renderer.setAnimationLoop(null);
        gui.destroy();
        stats.dom.remove();
        controls?.dispose();
        example.dispose?.();
        renderer.dispose();
      }, { once: true });
    }
  </script>
</body>
</html>
