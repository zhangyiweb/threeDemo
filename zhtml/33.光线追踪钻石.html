<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>33.光线追踪钻石</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #container, canvas { width: 100%; height: 100%; display: block; }
    body { overflow: hidden; background: #020305; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
      "@petamoriken/float16": "https://cdn.jsdelivr.net/npm/@petamoriken/float16@3.9.2/browser/float16.mjs",
      "astronomy-engine": "https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/esm/astronomy.js",
      "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js",
      "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.37.4/build/index.js",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/build/index.module.js",
      "three-stdlib": "https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/runtime/exr-loader.js"
    }
  }
  </script>
  <script src="../assets/loading-overlay.js"></script>
</head>
<body>
  <div id="container"><canvas id="view"></canvas></div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GUI } from "three/addons/libs/lil-gui.module.min.js";
    import Stats from "three/addons/libs/stats.module.js";

        import { EXRLoader } from "three/addons/loaders/EXRLoader.js";
    
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    
    import { Reflector } from "three/addons/objects/Reflector.js";
    
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    
    import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
    
    import { SMAAPass } from "three/addons/postprocessing/SMAAPass.js";
    
    import { GammaCorrectionShader } from "three/addons/shaders/GammaCorrectionShader.js";
    
    import { MeshBVHHelper } from "three-mesh-bvh";
    
    import {
    
      makeDiamond,
    
      setDiamondResolution,
    
    } from "https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/skills/threejs-procedural-materials/examples/raytraced-diamond/diamond-material.js";
    
    
    
    const DIAMOND_URL =
    
      "https://raw.githubusercontent.com/zhangyiweb/models/main/%E5%85%89%E7%BA%BF%E8%BF%BD%E8%B8%AA%E9%92%BB%E7%9F%B3/diamond.glb";
    
    
    
    // Scene-buffer passthrough feeding the gamma + SMAA presentation chain. The
    
    // scene is rendered into an explicit target and handed to the composer as
    
    // `sceneDiffuse`.
    
    const scenePassthroughShader = {
    
      uniforms: {
    
        sceneDiffuse: { value: null },
    
      },
    
      vertexShader: /* glsl */ `
    
    		varying vec2 vUv;
    
    		void main() {
    
    			vUv = uv;
    
    			gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
    
    		}`,
    
      fragmentShader: /* glsl */ `
    
    		uniform sampler2D sceneDiffuse;
    
            varying vec2 vUv;
    
    		void main() {
    
                vec4 diffuse = texture2D(sceneDiffuse, vUv);
    
                gl_FragColor = vec4(diffuse.rgb, 1.0);
    
    		}`,
    
    };
    
    
    
    const sceneModule = {
    
      renderer: {
    
        options: { antialias: false },
    
        toneMapping: 0,
    
        exposure: 1,
    
        clearColor: 0x000000,
    
      },
    
      camera: {
    
        fov: 50,
    
        near: 0.1,
    
        far: 500,
    
        position: [30, 18, 30],
    
      },
    
      controls: {
    
        target: [0, 6, 0],
    
        minDistance: 12,
    
        maxDistance: 120,
    
        maxPolarAngle: Math.PI * 0.49,
    
        enablePan: true,
    
      },
    
      async setup({ renderer, scene, camera, resolveAsset }) {
    
        scene.background = new THREE.Color(0x000000);
    
    
    
        // The studio HDRI is never drawn as the background: it feeds the gem's
    
        // refraction/reflection and the floor's image-based lighting only.
    
        const hdriTexture = await new EXRLoader().loadAsync(
    
          resolveAsset("assets/colorful_studio.exr"),
    
        );
    
        hdriTexture.mapping = THREE.EquirectangularReflectionMapping;
    
        hdriTexture.generateMipmaps = true;
    
        hdriTexture.minFilter = THREE.LinearMipmapLinearFilter;
    
        scene.environment = hdriTexture;
    
    
    
        // Semi-reflective dark floor in two layers: a planar mirror underneath
    
        // reflects actual scene geometry (the gem), and the slightly transparent
    
        // glossy disc above keeps the HDRI-lit dark finish while dimming the
    
        // mirror to semi-reflective strength.
    
        const mirror = new Reflector(new THREE.CircleGeometry(70, 64), {
    
          clipBias: 0.003,
    
          textureWidth: 1024,
    
          textureHeight: 1024,
    
        });
    
        mirror.rotation.x = -Math.PI / 2;
    
        mirror.position.y = -0.02;
    
        scene.add(mirror);
    
    
    
        const floor = new THREE.Mesh(
    
          new THREE.CircleGeometry(70, 64),
    
          new THREE.MeshStandardMaterial({
    
            color: 0x060606,
    
            roughness: 0.18,
    
            metalness: 0.35,
    
            envMapIntensity: 0.5,
    
            transparent: true,
    
            opacity: 0.78,
    
          }),
    
        );
    
        floor.rotation.x = -Math.PI / 2;
    
        scene.add(floor);
    
    
    
        const gltf = await new GLTFLoader().loadAsync(DIAMOND_URL);
    
        const diamondGeo =
    
          gltf.scene.children[0].children[0].children[0].children[0].children[0]
    
            .geometry;
    
        diamondGeo.scale(10, 10, 10);
    
        diamondGeo.translate(0, 5, 0);
    
    
    
        // The gem's material samples a cube map: convert the equirectangular
    
        // HDRI once into a mipmapped HDR cube target. The mipmapped filtering it
    
        // inherits from the HDRI keeps the material's mip-correct sampling live.
    
        const envCubeTarget = new THREE.WebGLCubeRenderTarget(512, {
    
          type: THREE.HalfFloatType,
    
        });
    
        envCubeTarget.fromEquirectangularTexture(renderer, hdriTexture);
    
    
    
        const diamond = makeDiamond(diamondGeo, {
    
          envMap: envCubeTarget.texture,
    
          camera,
    
          resolution: new THREE.Vector2(1, 1),
    
          aberrationStrength: 0.05,
    
        });
    
        scene.add(diamond);
    
        const uniforms = diamond.material.uniforms;
    
    
    
        const bvhHelper = new MeshBVHHelper(diamond, 20);
    
        bvhHelper.visible = false;
    
        bvhHelper.update();
    
        scene.add(bvhHelper);
    
    
    
        // Half-float scene target: the chain stores linear light and applies
    
        // gamma afterwards, so an 8-bit target would band in the dark floor
    
        // gradients once the transfer curve expands them.
    
        const defaultTexture = new THREE.WebGLRenderTarget(1, 1, {
    
          minFilter: THREE.LinearFilter,
    
          magFilter: THREE.NearestFilter,
    
          type: THREE.HalfFloatType,
    
        });
    
        defaultTexture.depthTexture = new THREE.DepthTexture(1, 1, THREE.FloatType);
    
        const composer = new EffectComposer(renderer);
    
        const effectPass = new ShaderPass(scenePassthroughShader);
    
        composer.addPass(effectPass);
    
        composer.addPass(new ShaderPass(GammaCorrectionShader));
    
        const smaaPass = new SMAAPass();
    
        composer.addPass(smaaPass);
    
    
    
        return {
    
          setDebugMode(mode) {
    
            uniforms.bounces.value = mode === "one-bounce" ? 1 : 3;
    
            uniforms.chromaticAberration.value = mode !== "single-ior";
    
            uniforms.correctMips.value = mode !== "flat-mips";
    
            bvhHelper.visible = mode === "bvh";
    
          },
    
          resize({ width, height, bufferWidth, bufferHeight, dpr }) {
    
            setDiamondResolution(diamond.material, bufferWidth, bufferHeight);
    
            defaultTexture.setSize(bufferWidth, bufferHeight);
    
            composer.setPixelRatio(dpr);
    
            composer.setSize(width, height);
    
          },
    
          render({ renderer, camera }) {
    
            renderer.setRenderTarget(defaultTexture);
    
            renderer.clear();
    
            renderer.render(scene, camera);
    
            effectPass.uniforms.sceneDiffuse.value = defaultTexture.texture;
    
            composer.render();
    
          },
    
          metrics() {
    
            return {
    
              bounces: String(uniforms.bounces.value),
    
              ior: uniforms.ior.value.toFixed(2),
    
              dispersion: uniforms.chromaticAberration.value ? "on" : "off",
    
            };
    
          },
    
          dispose() {
    
            diamondGeo.dispose();
    
            diamond.material.dispose();
    
            mirror.dispose();
    
            mirror.geometry.dispose();
    
            floor.geometry.dispose();
    
            floor.material.dispose();
    
            hdriTexture.dispose();
    
            envCubeTarget.dispose();
    
            defaultTexture.depthTexture.dispose();
    
            defaultTexture.dispose();
    
            composer.dispose();
    
          },
    
        };
    
      },
    
    };

    if ((sceneModule.backend === "webgpu" || sceneModule.backend === "raw-webgpu") && !navigator.gpu) {
      throw new Error("WebGPU unavailable");
    }

    const canvas = document.querySelector("#view");
    const rawWebGpu = sceneModule.backend === "raw-webgpu";
    const rendererOptions = {
      canvas,
      antialias: true,
      powerPreference: "high-performance",
      ...(sceneModule.renderer?.options ?? {}),
    };
    const renderer = rawWebGpu
      ? null
      : sceneModule.backend === "webgpu"
        ? new THREE.WebGPURenderer(rendererOptions)
        : new THREE.WebGLRenderer(rendererOptions);

    if (typeof renderer?.init === "function") await renderer.init();
    if (renderer) {
      renderer.outputColorSpace = sceneModule.renderer?.outputColorSpace ?? THREE.SRGBColorSpace;
      renderer.toneMapping = sceneModule.renderer?.toneMapping ?? THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = sceneModule.renderer?.exposure ?? 1;
    }
    if (renderer && sceneModule.renderer?.clearColor != null) {
      renderer.setClearColor(sceneModule.renderer.clearColor, sceneModule.renderer.clearAlpha ?? 1);
    }

    const scene = new THREE.Scene();
    const cameraConfig = sceneModule.camera ?? {};
    const camera = cameraConfig.type === "orthographic"
      ? new THREE.OrthographicCamera(
          cameraConfig.left ?? -1,
          cameraConfig.right ?? 1,
          cameraConfig.top ?? 1,
          cameraConfig.bottom ?? -1,
          cameraConfig.near ?? 0,
          cameraConfig.far ?? 1,
        )
      : new THREE.PerspectiveCamera(
          cameraConfig.fov ?? 50,
          1,
          cameraConfig.near ?? 0.1,
          cameraConfig.far ?? 2000,
        );
    if (cameraConfig.position) camera.position.fromArray(cameraConfig.position);
    if (cameraConfig.up) camera.up.fromArray(cameraConfig.up);

    const controlsConfig = sceneModule.controls ?? {};
    const controls = controlsConfig.enabled === false || cameraConfig.type === "orthographic"
      ? null
      : new OrbitControls(camera, canvas);
    if (controls) {
      controls.enableDamping = controlsConfig.enableDamping ?? true;
      controls.dampingFactor = controlsConfig.dampingFactor ?? 0.08;
      controls.enablePan = controlsConfig.enablePan ?? true;
      controls.enableZoom = controlsConfig.enableZoom ?? true;
      controls.screenSpacePanning = controlsConfig.screenSpacePanning ?? true;
      controls.minDistance = controlsConfig.minDistance ?? 0;
      controls.maxDistance = controlsConfig.maxDistance ?? Infinity;
      controls.minPolarAngle = controlsConfig.minPolarAngle ?? 0;
      controls.maxPolarAngle = controlsConfig.maxPolarAngle ?? Math.PI;
      controls.minAzimuthAngle = controlsConfig.minAzimuthAngle ?? -Infinity;
      controls.maxAzimuthAngle = controlsConfig.maxAzimuthAngle ?? Infinity;
      controls.target.fromArray(controlsConfig.target ?? [0, 0, 0]);
      controls.update();
    }

    function resolveAsset(relativePath) {
      if (/^https?:\/\//.test(relativePath)) return relativePath;
      return new URL(relativePath, new URL("https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/examples/threejs-procedural-materials/raytraced-diamond/", import.meta.url)).href;
    }

    const example = await sceneModule.setup({
      THREE,
      canvas,
      renderer,
      scene,
      camera,
      controls,
      resolveAsset,
    }) ?? {};

    const params = {
      paused: false,
      timeScale: 1,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      debugMode: "final",
    };
    if (renderer) renderer.setPixelRatio(params.dpr);
    example.setDebugMode?.(params.debugMode);

    const drawingBufferSize = renderer ? new THREE.Vector2() : null;
    function resize() {
      const width = Math.max(1, canvas.clientWidth);
      const height = Math.max(1, canvas.clientHeight);
      const bufferWidth = Math.round(width * params.dpr);
      const bufferHeight = Math.round(height * params.dpr);
    if (rawWebGpu) {
        example.resize?.({ width, height, bufferWidth, bufferHeight, dpr: params.dpr });
        if (camera.isPerspectiveCamera) {
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        }
        return;
      }
      renderer.getDrawingBufferSize(drawingBufferSize);
      if (drawingBufferSize.x === bufferWidth && drawingBufferSize.y === bufferHeight) return;
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(width, height, false);
      if (camera.isPerspectiveCamera) {
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }
      example.resize?.({ width, height, bufferWidth, bufferHeight, dpr: params.dpr });
    }

    const stats = new Stats();
    document.body.appendChild(stats.dom);
    const gui = new GUI({ title: "33.光线追踪钻石" });
    gui.add(params, "paused").name("暂停");
    gui.add(params, "timeScale", 0, 3, 0.05).name("时间缩放");
    gui.add(params, "dpr", 0.5, 2, 0.25).name("像素比").onChange(resize);
    gui.add(params, "debugMode", {
      "Final": "final",
      "No dispersion": "single-ior",
      "One bounce": "one-bounce",
      "Raw-ray mips": "flat-mips",
      "BVH bounds": "bvh",
    }).name("调试").onChange((value) => example.setDebugMode?.(value));

    let elapsed = sceneModule.initialTime ?? 0;
    let previous = performance.now();
    let frameInProgress = false;
    resize();
    window.__sceneLoader?.done();

    async function frame(now) {
      if (frameInProgress) return;
      frameInProgress = true;
      try {
        stats.update();
        resize();
        const rawDelta = Math.min((now - previous) / 1000, 0.1);
        previous = now;
        const delta = params.paused ? 0 : rawDelta * params.timeScale;
        elapsed += delta;
        controls?.update();
        await example.update?.({ delta, rawDelta, elapsed, state: params, camera, controls });
        if (example.render) {
          await example.render({ renderer, scene, camera, elapsed, delta, rawDelta, state: params });
        } else if (typeof renderer?.renderAsync === "function") {
          await renderer.renderAsync(scene, camera);
        } else if (renderer) {
          renderer.render(scene, camera);
        }
      } finally {
        frameInProgress = false;
      }
    }

    if (rawWebGpu) {
      let rawAnimationFrame = 0;
      let rawLoopStopped = false;
      const rawLoop = async (now) => {
        await frame(now);
        if (!rawLoopStopped) rawAnimationFrame = requestAnimationFrame(rawLoop);
      };
      rawAnimationFrame = requestAnimationFrame(rawLoop);
      window.addEventListener("pagehide", () => {
        rawLoopStopped = true;
        cancelAnimationFrame(rawAnimationFrame);
        gui.destroy();
        stats.dom.remove();
        controls?.dispose();
        example.dispose?.();
      }, { once: true });
    } else {
      renderer.setAnimationLoop(frame);
      window.addEventListener("pagehide", () => {
        renderer.setAnimationLoop(null);
        gui.destroy();
        stats.dom.remove();
        controls?.dispose();
        example.dispose?.();
        renderer.dispose();
      }, { once: true });
    }
  </script>
</body>
</html>
