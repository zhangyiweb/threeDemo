<!--
 * @Description: Cesium 合肥地形 — 多源影像切换（高德/Esri/OSM）+ ArcGIS 高程
-->
<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cesium 合肥地形</title>
  <script>
    window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.125.0/Build/Cesium/';
  </script>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/cesium@1.125.0/Build/Cesium/Widgets/widgets.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #cesiumContainer { width: 100%; height: 100%; overflow: hidden; background: #0a1018; }

    #hud {
      position: absolute; left: 16px; top: 16px; z-index: 9;
      padding: 10px 14px; max-width: 340px;
      background: rgba(8, 14, 24, 0.55); color: #cfe0f5;
      font: 12px/1.7 system-ui, sans-serif; border-radius: 8px;
      border: 1px solid rgba(120, 160, 220, 0.28); backdrop-filter: blur(8px);
      pointer-events: none;
    }
    #hud b { color: #39d6ff; }
    #hud .sub { color: #8aa0c4; font-size: 11px; margin-top: 4px; }

    #panel {
      position: absolute; right: 16px; top: 16px; z-index: 9;
      width: 220px; padding: 12px 14px;
      background: rgba(8, 14, 24, 0.72); color: #cfe0f5;
      font: 12px/1.5 system-ui, sans-serif; border-radius: 10px;
      border: 1px solid rgba(120, 160, 220, 0.3); backdrop-filter: blur(10px);
    }
    #panel h3 {
      font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
      color: #8aa0c4; margin: 0 0 8px; text-transform: uppercase;
    }
    #panel .row { display: flex; flex-wrap: wrap; gap: 6px; }
    #panel button {
      appearance: none; cursor: pointer;
      padding: 6px 10px; border-radius: 7px;
      border: 1px solid rgba(120, 160, 220, 0.3);
      background: rgba(255, 255, 255, 0.04); color: #eaf4ff;
      font: 12px/1 system-ui, sans-serif;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    #panel button:hover {
      background: rgba(57, 214, 255, 0.12);
      border-color: rgba(57, 214, 255, 0.45);
    }
    #panel button.active {
      background: rgba(57, 214, 255, 0.22);
      border-color: rgba(57, 214, 255, 0.65);
      color: #fff;
    }
    #panel .hint {
      margin-top: 10px; color: #8aa0c4; font-size: 11px; line-height: 1.45;
    }

    #spots {
      position: absolute; left: 16px; bottom: 16px; z-index: 9;
      display: flex; flex-wrap: wrap; gap: 8px; max-width: 480px;
    }
    #spots button {
      appearance: none; cursor: pointer;
      padding: 7px 12px; border-radius: 8px;
      border: 1px solid rgba(120, 160, 220, 0.35);
      background: rgba(8, 14, 24, 0.65); color: #eaf4ff;
      font: 12px/1 system-ui, sans-serif;
      backdrop-filter: blur(8px);
      transition: background 0.2s, border-color 0.2s;
    }
    #spots button:hover {
      background: rgba(57, 214, 255, 0.18);
      border-color: rgba(57, 214, 255, 0.55);
    }

    #overlay {
      position: absolute; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      background: #0a1018; color: #cfe0f5; font: 15px/1.8 system-ui, sans-serif;
      text-align: center; transition: opacity 0.45s;
    }
    #overlay.hide { opacity: 0; pointer-events: none; }
    #overlay .spinner {
      width: 42px; height: 42px; margin: 0 auto 16px;
      border: 3px solid rgba(57, 214, 255, 0.25); border-top-color: #39d6ff;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    #overlay.err .spinner { display: none; }
    #overlay .err-tip { color: #ffb27a; font-size: 13px; margin-top: 10px; max-width: 480px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>

  <div id="hud">
    地点 <b>合肥市</b> · Cesium 在线地形<br />
    中心 <b>117.2272°E, 31.8206°N</b><br />
    影像 <b id="hud-imagery">高德卫星</b><br />
    高程 <b id="hud-terrain">加载中…</b>
    <div class="sub">右上角切换底图 · 左下角飞往地标</div>
  </div>

  <div id="panel">
    <h3>影像底图</h3>
    <div class="row" id="imagery-btns"></div>
    <div class="hint">
      高德/OSM 路网更新较勤；卫星图因商业授权常滞后数年。
      控制台若刷 inspector.js 的 responseText/blob 报错，是浏览器调试扩展拦截 XHR，与本页逻辑无关，可忽略。
      底图异常时可改用 Esri / OSM。
    </div>
  </div>

  <div id="spots"></div>

  <div id="overlay">
    <div>
      <div class="spinner"></div>
      <div id="overlay-text">正在连接在线 Cesium 与合肥地形…</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/cesium@1.125.0/Build/Cesium/Cesium.js"></script>
  <script>
    (async function () {
      const overlay = document.getElementById('overlay');
      const overlayText = document.getElementById('overlay-text');
      const hudTerrain = document.getElementById('hud-terrain');
      const hudImagery = document.getElementById('hud-imagery');

      const HEFEI = { lon: 117.2272, lat: 31.8206, height: 18000 };

      const SPOTS = [
        { name: '合肥市中心', lon: 117.2272, lat: 31.8206, height: 12000 },
        { name: '大蜀山', lon: 117.1720, lat: 31.8430, height: 4500 },
        { name: '巢湖', lon: 117.5400, lat: 31.5600, height: 28000 },
        { name: '科学岛', lon: 117.1700, lat: 31.9100, height: 6000 },
        { name: '骆岗机场旧址', lon: 117.3000, lat: 31.7800, height: 8000 },
        { name: '合肥新桥机场', lon: 116.9760, lat: 31.9880, height: 10000 },
      ];

      // 国内常用在线瓦片：高德路网更新快；卫星仍可能滞后，但通常比 Esri 全球缓存新
      const IMAGERY = {
        gaodeSat: {
          label: '高德卫星',
          create: function () {
            return new Cesium.UrlTemplateImageryProvider({
              url: 'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
              subdomains: ['1', '2', '3', '4'],
              maximumLevel: 18,
              credit: '© 高德地图',
            });
          },
        },
        gaodeRoad: {
          label: '高德路网',
          create: function () {
            return new Cesium.UrlTemplateImageryProvider({
              url: 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
              subdomains: ['1', '2', '3', '4'],
              maximumLevel: 18,
              credit: '© 高德地图',
            });
          },
        },
        osm: {
          label: 'OSM 路网',
          create: function () {
            return new Cesium.OpenStreetMapImageryProvider({
              url: 'https://tile.openstreetmap.org/',
            });
          },
        },
        esri: {
          label: 'Esri 卫星',
          create: function () {
            return new Cesium.UrlTemplateImageryProvider({
              url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
              maximumLevel: 19,
              credit: 'Esri World Imagery',
            });
          },
        },
        carto: {
          label: 'Carto 浅色',
          create: function () {
            return new Cesium.UrlTemplateImageryProvider({
              url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',
              subdomains: ['a', 'b', 'c', 'd'],
              maximumLevel: 18,
              credit: '© CARTO · OSM',
            });
          },
        },
      };

      function showError(msg) {
        overlay.classList.add('err');
        overlayText.innerHTML =
          '地形加载失败<div class="err-tip">' + msg + '</div>';
      }

      function hideOverlay() {
        overlay.classList.add('hide');
        setTimeout(function () {
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, 500);
      }

      function flyTo(spot) {
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(spot.lon, spot.lat, spot.height),
          orientation: {
            heading: Cesium.Math.toRadians(0),
            pitch: Cesium.Math.toRadians(-45),
            roll: 0,
          },
          duration: 2.2,
        });
      }

      function setActive(groupEl, btn) {
        Array.prototype.forEach.call(groupEl.querySelectorAll('button'), function (b) {
          b.classList.toggle('active', b === btn);
        });
      }

      function setImagery(key) {
        const conf = IMAGERY[key];
        if (!conf || !viewer) return;
        viewer.imageryLayers.removeAll();
        viewer.imageryLayers.addImageryProvider(conf.create());
        hudImagery.textContent = conf.label;
      }

      let viewer;
      try {
        // 默认用高德卫星（国内城区通常比 Esri 全球缓存新）
        const defaultKey = 'gaodeSat';
        viewer = new Cesium.Viewer('cesiumContainer', {
          baseLayer: new Cesium.ImageryLayer(IMAGERY[defaultKey].create()),
          baseLayerPicker: false,
          geocoder: false,
          homeButton: false,
          sceneModePicker: true,
          navigationHelpButton: false,
          animation: false,
          timeline: false,
          fullscreenButton: true,
          vrButton: false,
          infoBox: false,
          selectionIndicator: false,
          terrainProvider: new Cesium.EllipsoidTerrainProvider(),
        });

        viewer.scene.globe.depthTestAgainstTerrain = true;
        viewer.scene.globe.enableLighting = true;
        viewer.scene.fog.enabled = true;
        viewer.scene.skyAtmosphere.show = true;
        viewer.cesiumWidget.creditContainer.style.display = 'none';

        hudImagery.textContent = IMAGERY[defaultKey].label;

        overlayText.textContent = '正在加载 ArcGIS 全球高程瓦片…';
        const terrainProvider = await Cesium.ArcGISTiledElevationTerrainProvider.fromUrl(
          'https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer'
        );
        viewer.terrainProvider = terrainProvider;
        hudTerrain.textContent = 'ArcGIS Terrain3D';

        flyTo(HEFEI);

        // 影像按钮
        const imageryBtns = document.getElementById('imagery-btns');
        Object.keys(IMAGERY).forEach(function (key) {
          const btn = document.createElement('button');
          btn.textContent = IMAGERY[key].label;
          if (key === defaultKey) btn.classList.add('active');
          btn.addEventListener('click', function () {
            setImagery(key);
            setActive(imageryBtns, btn);
          });
          imageryBtns.appendChild(btn);
        });

        // 地标
        const spotsEl = document.getElementById('spots');
        SPOTS.forEach(function (spot) {
          const btn = document.createElement('button');
          btn.textContent = spot.name;
          btn.addEventListener('click', function () { flyTo(spot); });
          spotsEl.appendChild(btn);
        });

        // 鼠标海拔
        let sampleTimer = 0;
        const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
        handler.setInputAction(function (movement) {
          clearTimeout(sampleTimer);
          sampleTimer = setTimeout(function () {
            const ray = viewer.camera.getPickRay(movement.endPosition);
            if (!ray) return;
            const cartesian = viewer.scene.globe.pick(ray, viewer.scene);
            if (!cartesian) return;
            const carto = Cesium.Cartographic.fromCartesian(cartesian);
            const lon = Cesium.Math.toDegrees(carto.longitude).toFixed(4);
            const lat = Cesium.Math.toDegrees(carto.latitude).toFixed(4);
            const h = carto.height;
            hudTerrain.textContent =
              'ArcGIS Terrain3D · ≈ ' +
              (h != null && !Number.isNaN(h) ? h.toFixed(0) + ' m' : '--') +
              ' · ' + lon + ', ' + lat;
          }, 120);
        }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

        hideOverlay();
      } catch (err) {
        console.error(err);
        showError(
          (err && err.message ? err.message : String(err)) +
          '<br/>请检查网络是否可访问高德 / Esri / ArcGIS 瓦片。'
        );
      }
    })();
  </script>
</body>

</html>
