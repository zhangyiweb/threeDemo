<!--
 * @Description: Cesium 合肥地形 — 多源影像切换（高德/Esri/OSM）+ ArcGIS 高程 + 天气预设
-->
<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cesium 合肥地形</title>
  <script>
    window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.125.0/Build/Cesium/';
  </script>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/cesium@1.125.0/Build/Cesium/Widgets/widgets.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #cesiumContainer { width: 100%; height: 100%; overflow: hidden; background: #0a1018; }

    #hud {
      position: absolute; left: 16px; top: 16px; z-index: 9;
      padding: 10px 14px; max-width: 340px;
      background: rgba(8, 14, 24, 0.55); color: #cfe0f5;
      font: 12px/1.7 system-ui, sans-serif; border-radius: 8px;
      border: 1px solid rgba(120, 160, 220, 0.28); backdrop-filter: blur(8px);
      pointer-events: none;
    }
    #hud b { color: #39d6ff; }
    #hud .sub { color: #8aa0c4; font-size: 11px; margin-top: 4px; }

    #panel {
      position: absolute; right: 16px; top: 16px; z-index: 9;
      width: 220px; padding: 12px 14px;
      background: rgba(8, 14, 24, 0.72); color: #cfe0f5;
      font: 12px/1.5 system-ui, sans-serif; border-radius: 10px;
      border: 1px solid rgba(120, 160, 220, 0.3); backdrop-filter: blur(10px);
    }
    #panel h3 {
      font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
      color: #8aa0c4; margin: 0 0 8px; text-transform: uppercase;
    }
    #panel h3 + .row { margin-bottom: 14px; }
    #panel .row { display: flex; flex-wrap: wrap; gap: 6px; }
    #panel button {
      appearance: none; cursor: pointer;
      padding: 6px 10px; border-radius: 7px;
      border: 1px solid rgba(120, 160, 220, 0.3);
      background: rgba(255, 255, 255, 0.04); color: #eaf4ff;
      font: 12px/1 system-ui, sans-serif;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    #panel button:hover {
      background: rgba(57, 214, 255, 0.12);
      border-color: rgba(57, 214, 255, 0.45);
    }
    #panel button.active {
      background: rgba(57, 214, 255, 0.22);
      border-color: rgba(57, 214, 255, 0.65);
      color: #fff;
    }
    #panel .hint {
      margin-top: 10px; color: #8aa0c4; font-size: 11px; line-height: 1.45;
    }

    #spots {
      position: absolute; left: 16px; bottom: 16px; z-index: 9;
      display: flex; flex-wrap: wrap; gap: 8px; max-width: 480px;
    }
    #spots button {
      appearance: none; cursor: pointer;
      padding: 7px 12px; border-radius: 8px;
      border: 1px solid rgba(120, 160, 220, 0.35);
      background: rgba(8, 14, 24, 0.65); color: #eaf4ff;
      font: 12px/1 system-ui, sans-serif;
      backdrop-filter: blur(8px);
      transition: background 0.2s, border-color 0.2s;
    }
    #spots button:hover {
      background: rgba(57, 214, 255, 0.18);
      border-color: rgba(57, 214, 255, 0.55);
    }

    #overlay {
      position: absolute; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      background: #0a1018; color: #cfe0f5; font: 15px/1.8 system-ui, sans-serif;
      text-align: center; transition: opacity 0.45s;
    }
    #overlay.hide { opacity: 0; pointer-events: none; }
    #overlay .spinner {
      width: 42px; height: 42px; margin: 0 auto 16px;
      border: 3px solid rgba(57, 214, 255, 0.25); border-top-color: #39d6ff;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    #overlay.err .spinner { display: none; }
    #overlay .err-tip { color: #ffb27a; font-size: 13px; margin-top: 10px; max-width: 480px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>

  <div id="hud">
    地点 <b>合肥市</b> · Cesium 在线地形<br />
    中心 <b>117.2272°E, 31.8206°N</b><br />
    影像 <b id="hud-imagery">高德卫星</b><br />
    高程 <b id="hud-terrain">加载中…</b><br />
    天气 <b id="hud-weather">晴天</b>
    <div class="sub">右上角可切换更新底图与天气 · 左下角飞往地标</div>
  </div>

  <div id="panel">
    <h3>影像底图</h3>
    <div class="row" id="imagery-btns"></div>
    <h3>天气</h3>
    <div class="row" id="weather-btns"></div>
    <div class="hint">
      高德/OSM 路网更新较勤；卫星图因商业授权常滞后数年。
      控制台若刷 inspector.js 的 responseText/blob 报错，是浏览器调试扩展拦截 XHR，与本页逻辑无关，可忽略。
      底图异常时可改用 Esri / OSM。
    </div>
  </div>

  <div id="spots"></div>

  <div id="overlay">
    <div>
      <div class="spinner"></div>
      <div id="overlay-text">正在连接在线 Cesium 与合肥地形…</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/cesium@1.125.0/Build/Cesium/Cesium.js"></script>
  <script>
    (async function () {
      const overlay = document.getElementById('overlay');
      const overlayText = document.getElementById('overlay-text');
      const hudTerrain = document.getElementById('hud-terrain');
      const hudImagery = document.getElementById('hud-imagery');
      const hudWeather = document.getElementById('hud-weather');

      const HEFEI = { lon: 117.2272, lat: 31.8206, height: 18000 };

      const SPOTS = [
        { name: '合肥市中心', lon: 117.2272, lat: 31.8206, height: 12000 },
        { name: '大蜀山', lon: 117.1720, lat: 31.8430, height: 4500 },
        { name: '巢湖', lon: 117.5400, lat: 31.5600, height: 28000 },
        { name: '科学岛', lon: 117.1700, lat: 31.9100, height: 6000 },
        { name: '骆岗机场旧址', lon: 117.3000, lat: 31.7800, height: 8000 },
        { name: '合肥新桥机场', lon: 116.9760, lat: 31.9880, height: 10000 },
      ];

      // 国内常用在线瓦片：高德路网更新快；卫星仍可能滞后，但通常比 Esri 全球缓存新
      const IMAGERY = {
        gaodeSat: {
          label: '高德卫星',
          create: function () {
            return new Cesium.UrlTemplateImageryProvider({
              url: 'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
              subdomains: ['1', '2', '3', '4'],
              maximumLevel: 18,
              credit: '© 高德地图',
            });
          },
        },
        gaodeRoad: {
          label: '高德路网',
          create: function () {
            return new Cesium.UrlTemplateImageryProvider({
              url: 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
              subdomains: ['1', '2', '3', '4'],
              maximumLevel: 18,
              credit: '© 高德地图',
            });
          },
        },
        osm: {
          label: 'OSM 路网',
          create: function () {
            return new Cesium.OpenStreetMapImageryProvider({
              url: 'https://tile.openstreetmap.org/',
            });
          },
        },
        esri: {
          label: 'Esri 卫星',
          create: function () {
            return new Cesium.UrlTemplateImageryProvider({
              url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
              maximumLevel: 19,
              credit: 'Esri World Imagery',
            });
          },
        },
        carto: {
          label: 'Carto 浅色',
          create: function () {
            return new Cesium.UrlTemplateImageryProvider({
              url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',
              subdomains: ['a', 'b', 'c', 'd'],
              maximumLevel: 18,
              credit: '© CARTO · OSM',
            });
          },
        },
      };

      const WEATHER = {
        sunny: {
          label: '晴天',
          clock: '2024-06-15T04:00:00Z', // UTC ≈ 合肥下午
          lighting: true,
          fogDensity: 0.0002,
          fogMin: 0.01,
          brightness: 1.05,
          hue: 0.0,
          saturation: 1.1,
          rain: 0,
          snow: 0,
          clouds: 0.15,
        },
        cloudy: {
          label: '多云',
          clock: '2024-06-15T03:30:00Z',
          lighting: true,
          fogDensity: 0.0008,
          fogMin: 0.05,
          brightness: 0.85,
          hue: -0.02,
          saturation: 0.85,
          rain: 0,
          snow: 0,
          clouds: 0.55,
        },
        overcast: {
          label: '阴天',
          clock: '2024-11-10T04:00:00Z',
          lighting: true,
          fogDensity: 0.0018,
          fogMin: 0.12,
          brightness: 0.55,
          hue: -0.05,
          saturation: 0.55,
          rain: 0,
          snow: 0,
          clouds: 0.9,
        },
        rain: {
          label: '下雨',
          clock: '2024-07-20T05:00:00Z',
          lighting: true,
          fogDensity: 0.0025,
          fogMin: 0.18,
          brightness: 0.45,
          hue: -0.08,
          saturation: 0.5,
          rain: 1,
          snow: 0,
          clouds: 0.85,
        },
        snow: {
          label: '下雪',
          clock: '2024-01-15T04:30:00Z',
          lighting: true,
          fogDensity: 0.0022,
          fogMin: 0.15,
          brightness: 0.7,
          hue: 0.05,
          saturation: 0.4,
          rain: 0,
          snow: 1,
          clouds: 0.75,
        },
        night: {
          label: '夜晚',
          clock: '2024-06-15T14:00:00Z', // UTC 白天 = 合肥夜晚
          lighting: true,
          fogDensity: 0.0006,
          fogMin: 0.04,
          brightness: 0.25,
          hue: 0.15,
          saturation: 0.7,
          rain: 0,
          snow: 0,
          clouds: 0.25,
        },
      };

      function showError(msg) {
        overlay.classList.add('err');
        overlayText.innerHTML =
          '地形加载失败<div class="err-tip">' + msg + '</div>';
      }

      function hideOverlay() {
        overlay.classList.add('hide');
        setTimeout(function () {
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, 500);
      }

      function flyTo(spot) {
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(spot.lon, spot.lat, spot.height),
          orientation: {
            heading: Cesium.Math.toRadians(0),
            pitch: Cesium.Math.toRadians(-45),
            roll: 0,
          },
          duration: 2.2,
        });
      }

      function setActive(groupEl, btn) {
        Array.prototype.forEach.call(groupEl.querySelectorAll('button'), function (b) {
          b.classList.toggle('active', b === btn);
        });
      }

      // ── 粒子雨雪（地心重力 + 像素尺寸，挂在相机前方）────────
      let rainSystem = null;
      let snowSystem = null;
      let lastPrecipRadius = -1;
      const gravityScratch = new Cesium.Cartesian3();
      const precipCenter = new Cesium.Cartesian3();
      const precipTmp = new Cesium.Cartesian3();

      function makeRainCanvas() {
        const c = document.createElement('canvas');
        c.width = 8;
        c.height = 32;
        const ctx = c.getContext('2d');
        const g = ctx.createLinearGradient(4, 0, 4, 32);
        g.addColorStop(0, 'rgba(180, 220, 255, 0)');
        g.addColorStop(0.35, 'rgba(180, 220, 255, 0.95)');
        g.addColorStop(1, 'rgba(140, 190, 255, 0)');
        ctx.fillStyle = g;
        ctx.fillRect(3, 0, 2, 32);
        return c;
      }

      function makeSnowCanvas() {
        const c = document.createElement('canvas');
        c.width = c.height = 24;
        const ctx = c.getContext('2d');
        const g = ctx.createRadialGradient(12, 12, 0, 12, 12, 12);
        g.addColorStop(0, 'rgba(255,255,255,1)');
        g.addColorStop(0.45, 'rgba(255,255,255,0.8)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 24, 24);
        return c;
      }

      function makePrecipSystem(type) {
        const isRain = type === 'rain';
        const gravity = isRain ? -1200.0 : -80.0;

        return new Cesium.ParticleSystem({
          show: false,
          image: isRain ? makeRainCanvas() : makeSnowCanvas(),
          startColor: isRain
            ? Cesium.Color.fromCssColorString('#c5e4ff').withAlpha(0.9)
            : Cesium.Color.WHITE.withAlpha(0.95),
          endColor: isRain
            ? Cesium.Color.fromCssColorString('#9ecfff').withAlpha(0.12)
            : Cesium.Color.WHITE.withAlpha(0.1),
          startScale: 1.0,
          endScale: isRain ? 0.55 : 0.35,
          minimumParticleLife: isRain ? 1.0 : 3.0,
          maximumParticleLife: isRain ? 2.2 : 6.5,
          minimumSpeed: isRain ? 0.5 : 0.2,
          maximumSpeed: isRain ? 2.0 : 1.0,
          imageSize: isRain
            ? new Cesium.Cartesian2(7, 30)
            : new Cesium.Cartesian2(12, 12),
          emissionRate: isRain ? 2800 : 1000,
          lifetime: Number.MAX_VALUE,
          sizeInMeters: false,
          emitter: new Cesium.BoxEmitter(new Cesium.Cartesian3(400, 400, 180)),
          // 官方写法：沿地心方向加速（velocity 在 ECEF，不能改 local z）
          updateCallback: function (p, dt) {
            Cesium.Cartesian3.normalize(p.position, gravityScratch);
            Cesium.Cartesian3.multiplyByScalar(
              gravityScratch,
              gravity * dt,
              gravityScratch
            );
            Cesium.Cartesian3.add(p.velocity, gravityScratch, p.velocity);
          },
        });
      }

      function precipBoxSize(radius) {
        return new Cesium.Cartesian3(radius * 2, radius * 2, Math.max(120, radius * 0.45));
      }

      function syncPrecipToCamera() {
        if (!viewer) return;
        const rainOn = rainSystem && rainSystem.show;
        const snowOn = snowSystem && snowSystem.show;
        if (!rainOn && !snowOn) return;

        const cam = viewer.camera;
        const carto = cam.positionCartographic;
        if (!carto) return;

        const height = Math.max(carto.height, 60);
        const radius = Cesium.Math.clamp(height * 0.14, 140, 2800);
        // 相机前方一段距离，略抬高，保证落在视野里
        const ahead = Cesium.Math.clamp(height * 0.1, 80, 1600);
        Cesium.Cartesian3.multiplyByScalar(cam.directionWC, ahead, precipCenter);
        Cesium.Cartesian3.add(cam.positionWC, precipCenter, precipCenter);
        Cesium.Cartesian3.normalize(precipCenter, precipTmp);
        Cesium.Cartesian3.multiplyByScalar(
          precipTmp,
          Math.min(120, height * 0.03),
          precipTmp
        );
        Cesium.Cartesian3.add(precipCenter, precipTmp, precipCenter);

        const model = Cesium.Transforms.eastNorthUpToFixedFrame(precipCenter);
        if (Math.abs(radius - lastPrecipRadius) > 40) {
          lastPrecipRadius = radius;
          const box = precipBoxSize(radius);
          if (rainSystem) rainSystem.emitter = new Cesium.BoxEmitter(box);
          if (snowSystem) snowSystem.emitter = new Cesium.BoxEmitter(box);
        }
        if (rainOn) rainSystem.modelMatrix = model;
        if (snowOn) snowSystem.modelMatrix = model;
      }

      function setPrecip(rainOn, snowOn) {
        if (!rainSystem) {
          rainSystem = makePrecipSystem('rain');
          viewer.scene.primitives.add(rainSystem);
        }
        if (!snowSystem) {
          snowSystem = makePrecipSystem('snow');
          viewer.scene.primitives.add(snowSystem);
        }
        rainSystem.show = !!rainOn;
        snowSystem.show = !!snowOn;
        lastPrecipRadius = -1;
        syncPrecipToCamera();
      }

      // ── 云层 ────────────────────────────────────────────────
      let cloudCollection = null;

      function ensureClouds() {
        if (cloudCollection) return cloudCollection;
        try {
          cloudCollection = new Cesium.CloudCollection({ show: false });
          viewer.scene.primitives.add(cloudCollection);
          const baseLon = 117.23;
          const baseLat = 31.82;
          for (let i = 0; i < 48; i++) {
            const lon = baseLon + (Math.random() - 0.5) * 1.2;
            const lat = baseLat + (Math.random() - 0.5) * 1.0;
            const h = 1800 + Math.random() * 2200;
            cloudCollection.add({
              position: Cesium.Cartesian3.fromDegrees(lon, lat, h),
              scale: new Cesium.Cartesian2(
                600 + Math.random() * 1400,
                200 + Math.random() * 500
              ),
              maximumSize: new Cesium.Cartesian3(
                40 + Math.random() * 50,
                16 + Math.random() * 20,
                18 + Math.random() * 24
              ),
              slice: 0.3 + Math.random() * 0.4,
              brightness: 0.85 + Math.random() * 0.2,
            });
          }
        } catch (e) {
          console.warn('CloudCollection 不可用，跳过体积云', e);
          cloudCollection = {
            show: false,
            length: 0,
            get: function () { return null; },
          };
        }
        return cloudCollection;
      }

      function setCloudCoverage(amount) {
        const clouds = ensureClouds();
        if (!clouds || typeof clouds.get !== 'function') return;
        clouds.show = amount > 0.05;
        const n = clouds.length || 0;
        for (let i = 0; i < n; i++) {
          const c = clouds.get(i);
          if (!c) continue;
          c.brightness = 0.35 + amount * 0.7;
          c.show = Math.random() < Math.min(1, amount * 1.15);
        }
      }

      // ── 天气应用 ────────────────────────────────────────────
      function applyWeather(key) {
        const w = WEATHER[key];
        if (!w || !viewer) return;

        viewer.clock.currentTime = Cesium.JulianDate.fromIso8601(w.clock);
        viewer.clock.shouldAnimate = false;
        viewer.scene.globe.enableLighting = w.lighting;

        viewer.scene.fog.enabled = true;
        viewer.scene.fog.density = w.fogDensity;
        viewer.scene.fog.minimumBrightness = w.fogMin;

        const atm = viewer.scene.skyAtmosphere;
        if (atm) {
          atm.show = true;
          atm.brightnessShift = w.brightness - 1.0;
          atm.hueShift = w.hue;
          atm.saturationShift = w.saturation - 1.0;
        }

        setCloudCoverage(w.clouds);
        setPrecip(w.rain > 0, w.snow > 0);

        hudWeather.textContent = w.label;
      }

      function setImagery(key) {
        const conf = IMAGERY[key];
        if (!conf || !viewer) return;
        viewer.imageryLayers.removeAll();
        viewer.imageryLayers.addImageryProvider(conf.create());
        hudImagery.textContent = conf.label;
      }

      let viewer;
      try {
        // 默认用高德卫星（国内城区通常比 Esri 全球缓存新）
        const defaultKey = 'gaodeSat';
        viewer = new Cesium.Viewer('cesiumContainer', {
          baseLayer: new Cesium.ImageryLayer(IMAGERY[defaultKey].create()),
          baseLayerPicker: false,
          geocoder: false,
          homeButton: false,
          sceneModePicker: true,
          navigationHelpButton: false,
          animation: false,
          timeline: false,
          fullscreenButton: true,
          vrButton: false,
          infoBox: false,
          selectionIndicator: false,
          terrainProvider: new Cesium.EllipsoidTerrainProvider(),
        });

        viewer.scene.globe.depthTestAgainstTerrain = true;
        viewer.scene.globe.enableLighting = true;
        viewer.scene.fog.enabled = true;
        viewer.scene.skyAtmosphere.show = true;
        viewer.cesiumWidget.creditContainer.style.display = 'none';

        hudImagery.textContent = IMAGERY[defaultKey].label;

        overlayText.textContent = '正在加载 ArcGIS 全球高程瓦片…';
        const terrainProvider = await Cesium.ArcGISTiledElevationTerrainProvider.fromUrl(
          'https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer'
        );
        viewer.terrainProvider = terrainProvider;
        hudTerrain.textContent = 'ArcGIS Terrain3D';

        flyTo(HEFEI);

        // 影像按钮
        const imageryBtns = document.getElementById('imagery-btns');
        Object.keys(IMAGERY).forEach(function (key, idx) {
          const btn = document.createElement('button');
          btn.textContent = IMAGERY[key].label;
          if (key === defaultKey) btn.classList.add('active');
          btn.addEventListener('click', function () {
            setImagery(key);
            setActive(imageryBtns, btn);
          });
          imageryBtns.appendChild(btn);
        });

        // 天气按钮
        const weatherBtns = document.getElementById('weather-btns');
        Object.keys(WEATHER).forEach(function (key, idx) {
          const btn = document.createElement('button');
          btn.textContent = WEATHER[key].label;
          if (key === 'sunny') btn.classList.add('active');
          btn.addEventListener('click', function () {
            applyWeather(key);
            setActive(weatherBtns, btn);
          });
          weatherBtns.appendChild(btn);
        });
        applyWeather('sunny');

        // 地标
        const spotsEl = document.getElementById('spots');
        SPOTS.forEach(function (spot) {
          const btn = document.createElement('button');
          btn.textContent = spot.name;
          btn.addEventListener('click', function () { flyTo(spot); });
          spotsEl.appendChild(btn);
        });

        // 鼠标海拔
        let sampleTimer = 0;
        const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
        handler.setInputAction(function (movement) {
          clearTimeout(sampleTimer);
          sampleTimer = setTimeout(function () {
            const ray = viewer.camera.getPickRay(movement.endPosition);
            if (!ray) return;
            const cartesian = viewer.scene.globe.pick(ray, viewer.scene);
            if (!cartesian) return;
            const carto = Cesium.Cartographic.fromCartesian(cartesian);
            const lon = Cesium.Math.toDegrees(carto.longitude).toFixed(4);
            const lat = Cesium.Math.toDegrees(carto.latitude).toFixed(4);
            const h = carto.height;
            hudTerrain.textContent =
              'ArcGIS Terrain3D · ≈ ' +
              (h != null && !Number.isNaN(h) ? h.toFixed(0) + ' m' : '--') +
              ' · ' + lon + ', ' + lat;
          }, 120);
        }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

        // 雨雪粒子跟随相机
        viewer.scene.preUpdate.addEventListener(syncPrecipToCamera);

        hideOverlay();
      } catch (err) {
        console.error(err);
        showError(
          (err && err.message ? err.message : String(err)) +
          '<br/>请检查网络是否可访问高德 / Esri / ArcGIS 瓦片。'
        );
      }
    })();
  </script>
</body>

</html>
