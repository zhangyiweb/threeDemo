<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

// ── moods（完整影棚调色）────────────────────────────────────────────────────
const MOODS = {
  noir: {
    backdrop: '#131417',
    key: { color: '#ffd9a3', intensity: 95 },
    fill: { color: '#8fa3c9', intensity: 0.6 },
    rim: { color: '#86a8ff', intensity: 14 },
    env: 0.07,
    exposure: 1.0,
    bloom: 0.35,
    haze: 0.16,
    dust: 0.35,
    fog: 0.055,
  },
  ember: {
    backdrop: '#171310',
    key: { color: '#ff9d4f', intensity: 85 },
    fill: { color: '#ff5f3c', intensity: 0.5 },
    rim: { color: '#ffd9a3', intensity: 10 },
    env: 0.05,
    exposure: 1.05,
    bloom: 0.5,
    haze: 0.2,
    dust: 0.45,
    fog: 0.06,
  },
  moonlight: {
    backdrop: '#0d1117',
    key: { color: '#bcd2ff', intensity: 75 },
    fill: { color: '#5f7fae', intensity: 0.8 },
    rim: { color: '#ffb37a', intensity: 9 },
    env: 0.08,
    exposure: 0.95,
    bloom: 0.4,
    haze: 0.14,
    dust: 0.3,
    fog: 0.05,
  },
  daylight: {
    backdrop: '#e3e0da',
    key: { color: '#fff0dd', intensity: 60 },
    fill: { color: '#dfe9ff', intensity: 5 },
    rim: { color: '#ffffff', intensity: 7 },
    env: 0.5,
    exposure: 1.12,
    bloom: 0.08,
    haze: 0.0,
    dust: 0.0,
    fog: 0.012,
  },
};

// ── studio：地面地平线 / 尘埃 / 体积光锥 / 三点光 ─────────────────────────────
function buildFloor({ size = 60, color = 0x131417, near = 8, far = 27 } = {}) {
  const geo = new THREE.PlaneGeometry(size, size);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: 0.9, metalness: 0, envMapIntensity: 0.25,
  });
  const horizon = { value: new THREE.Color(color) };
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uHorizonColor = horizon;
    shader.uniforms.uHorizonNear = { value: near };
    shader.uniforms.uHorizonFar = { value: far };
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vHorizonWorld;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\n  vHorizonWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vHorizonWorld;\nuniform vec3 uHorizonColor;\nuniform float uHorizonNear;\nuniform float uHorizonFar;')
      .replace('#include <dithering_fragment>', '#include <dithering_fragment>\n  float _hd = length(vHorizonWorld.xz);\n  float _hf = smoothstep(uHorizonNear, uHorizonFar, _hd);\n  gl_FragColor.rgb = mix(gl_FragColor.rgb, uHorizonColor, _hf);');
  };
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  return { mesh, setHorizon: (c) => horizon.value.set(c) };
}

function createDust(count = 420) {
  const base = new Float32Array(count * 3);
  const phase = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    base[i * 3] = (Math.random() - 0.5) * 4.6;
    base[i * 3 + 1] = Math.random() * 3.2;
    base[i * 3 + 2] = -1.3 + Math.random() * 3.6;
    phase[i] = Math.random() * Math.PI * 2;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(base.slice(), 3));

  const size = 64;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.4, 'rgba(255,255,255,0.4)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  const mat = new THREE.PointsMaterial({
    map: new THREE.CanvasTexture(canvas),
    color: 0xfff2dd,
    size: 0.02,
    transparent: true,
    opacity: 0.35,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true,
  });
  const points = new THREE.Points(geo, mat);
  points.renderOrder = 2;

  function update(t) {
    const pos = geo.attributes.position;
    for (let i = 0; i < count; i++) {
      const p = phase[i];
      pos.array[i * 3] = base[i * 3] + Math.sin(t * 0.12 + p) * 0.22;
      pos.array[i * 3 + 1] = base[i * 3 + 1] + Math.sin(t * 0.07 + p * 1.7) * 0.16;
      pos.array[i * 3 + 2] = base[i * 3 + 2] + Math.cos(t * 0.09 + p * 0.6) * 0.18;
    }
    pos.needsUpdate = true;
  }
  return { points, material: mat, update };
}

function createLightShaft(lightPos, floorTarget) {
  const dir = floorTarget.clone().sub(lightPos);
  const len = dir.length();
  dir.normalize();
  const radius = Math.tan(0.5) * len * 0.85;
  const geo = new THREE.ConeGeometry(radius, len, 96, 1, true);
  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    uniforms: {
      uColor: { value: new THREE.Color(0xffd9a3) },
      uOpacity: { value: 0.16 },
      uFloorY: { value: 0.0 },
      uWallZ: { value: -1.8 },
    },
    vertexShader: /* glsl */ `
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewDir;
      varying vec3 vWorldPos;
      void main() {
        vUv = uv;
        vNormal = normalize(normalMatrix * normal);
        vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vViewDir = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */ `
      uniform vec3 uColor;
      uniform float uOpacity;
      uniform float uFloorY;
      uniform float uWallZ;
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewDir;
      varying vec3 vWorldPos;
      void main() {
        float core = pow(abs(dot(normalize(vNormal), normalize(vViewDir))), 1.8);
        float falloff = pow(vUv.y, 1.6);
        float floorFade = smoothstep(uFloorY + 0.03, uFloorY + 0.65, vWorldPos.y);
        float wallFade = smoothstep(uWallZ + 0.05, uWallZ + 0.75, vWorldPos.z);
        float a = core * falloff * floorFade * wallFade * uOpacity;
        float n = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
        a *= 0.88 + 0.24 * n;
        gl_FragColor = vec4(uColor, a);
      }
    `,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), dir);
  mesh.position.copy(lightPos).addScaledVector(dir, len / 2);
  mesh.renderOrder = 1;
  return { mesh, material: mat };
}

function createStudio(scene, renderer, target) {
  RectAreaLightUniformsLib.init();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  pmrem.dispose();

  const key = new THREE.SpotLight(0xffd9a3, 95);
  key.position.set(-2.6, 3.4, 2.4);
  key.angle = 0.5;
  key.penumbra = 0.65;
  key.decay = 1.6;
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.near = 0.5;
  key.shadow.camera.far = 16;
  key.shadow.bias = -0.0004;
  key.shadow.normalBias = 0.035;
  key.shadow.radius = 4;
  key.target.position.set(0, 1.0, 0.1);
  scene.add(key, key.target);

  const fill = new THREE.RectAreaLight(0x8fa3c9, 0.6, 3.4, 2.6);
  fill.position.set(3.0, 1.6, 2.6);
  fill.lookAt(target);
  scene.add(fill);

  const rim = new THREE.RectAreaLight(0x86a8ff, 14, 1.0, 3.0);
  rim.position.set(2.2, 2.4, -2.6);
  rim.lookAt(target);
  scene.add(rim);

  const floor = buildFloor();
  scene.add(floor.mesh);

  const dust = createDust();
  scene.add(dust.points);

  const shaft = createLightShaft(key.position, new THREE.Vector3(0, 0.9, 0.35));
  scene.add(shaft.mesh);

  return {
    key, fill, rim,
    cyc: floor.mesh,
    dust, shaft,
    update: (t) => dust.update(t),
    setFloorHorizon: floor.setHorizon,
  };
}

function createContactShadow() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(size / 2, size / 2, size * 0.05, size / 2, size / 2, size / 2);
  grad.addColorStop(0, 'rgba(0,0,0,0.55)');
  grad.addColorStop(0.55, 'rgba(0,0,0,0.22)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  const mat = new THREE.MeshBasicMaterial({
    map: new THREE.CanvasTexture(canvas),
    transparent: true,
    depthWrite: false,
    opacity: 0.55,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.y = 0.002;
  mesh.renderOrder = 1;
  return mesh;
}

// ── renderer / scene ─────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x131417);
scene.fog = new THREE.FogExp2(0x131417, 0.055);

const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 60);
camera.position.set(3.7, 2.1, 5.3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.8;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI / 2 - 0.01;
controls.target.set(0, 0.85, 0);

const studioParams = {
  mood: 'moonlight',
  keyLight: 95,
  fillLight: 0.6,
  rimLight: 14,
  haze: 0.16,
  dust: 0.35,
  exposure: 1.0,
  backdrop: '#131417',
};
const fxParams = {
  bloom: 0.35,
  bloomRadius: 0.55,
  bloomThreshold: 1.0,
  ao: true,
  aoIntensity: 1.0,
  aoRadius: 0.25,
  dof: false,
  aperture: 0.003,
  maxblur: 0.008,
  chroma: 0.15,
  saturation: 1.0,
  contrast: 1.0,
  temperature: 0.0,
  vignette: 0.55,
  grain: 0.03,
  letterbox: 0.1,
};
const cameraParams = { fov: 30, turntable: true, speed: 1.2 };

const studio = createStudio(scene, renderer, controls.target);
const contactShadow = createContactShadow();
contactShadow.scale.set(2.4, 3.2, 1);
scene.add(contactShadow);

// 简单展品：用来观察环境光 / 阴影 / AO / 体积光
const subject = new THREE.Group();
scene.add(subject);

const matWood = new THREE.MeshStandardMaterial({
  color: 0xc4a574, roughness: 0.72, metalness: 0.05, envMapIntensity: 0.35,
});
const matMetal = new THREE.MeshStandardMaterial({
  color: 0xb8c0cc, roughness: 0.22, metalness: 0.95, envMapIntensity: 0.8,
});
const matGlass = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0.05, metalness: 0,
  transmission: 0.9, thickness: 0.4, ior: 1.5,
  transparent: true, envMapIntensity: 1,
});

const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.62, 0.18, 48), matWood);
pedestal.position.y = 0.09;
pedestal.castShadow = true;
pedestal.receiveShadow = true;
subject.add(pedestal);

const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.38, 64, 48), matMetal);
sphere.position.set(0, 0.62, 0);
sphere.castShadow = true;
subject.add(sphere);

const torus = new THREE.Mesh(new THREE.TorusKnotGeometry(0.18, 0.055, 160, 24), matGlass);
torus.position.set(0.55, 0.42, 0.2);
torus.rotation.set(0.4, 0.3, 0);
torus.castShadow = true;
subject.add(torus);

const box = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.42, 0.22), matWood);
box.position.set(-0.55, 0.39, 0.15);
box.rotation.y = 0.35;
box.castShadow = true;
box.receiveShadow = true;
subject.add(box);

// ── post FX ──────────────────────────────────────────────────────────────────
const bufferSize = renderer.getDrawingBufferSize(new THREE.Vector2());
const composer = new EffectComposer(
  renderer,
  new THREE.WebGLRenderTarget(bufferSize.x, bufferSize.y, {
    type: THREE.HalfFloatType,
    samples: 4,
  })
);
composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
composer.addPass(new RenderPass(scene, camera));

const gtaoPass = new GTAOPass(scene, camera, window.innerWidth, window.innerHeight);
gtaoPass.output = GTAOPass.OUTPUT.Default;
gtaoPass.blendIntensity = fxParams.aoIntensity;
gtaoPass.updateGtaoMaterial({ radius: fxParams.aoRadius });
gtaoPass.enabled = fxParams.ao;
composer.addPass(gtaoPass);

const aoExcluded = [studio.shaft.mesh, studio.dust.points, contactShadow];
const gtaoRenderOriginal = gtaoPass.render.bind(gtaoPass);
gtaoPass.render = function (...args) {
  const wasVisible = aoExcluded.map((o) => o.visible);
  aoExcluded.forEach((o) => { o.visible = false; });
  gtaoRenderOriginal(...args);
  aoExcluded.forEach((o, i) => { o.visible = wasVisible[i]; });
};

const SanitizeShader = {
  uniforms: { tDiffuse: { value: null } },
  vertexShader: /* glsl */ `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */ `
    uniform sampler2D tDiffuse;
    varying vec2 vUv;
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      if (c.r != c.r || c.g != c.g || c.b != c.b) c.rgb = vec3(0.0);
      c.rgb = clamp(c.rgb, vec3(0.0), vec3(16.0));
      gl_FragColor = c;
    }
  `,
};
composer.addPass(new ShaderPass(SanitizeShader));

const bokehPass = new BokehPass(scene, camera, {
  focus: 4.0,
  aperture: fxParams.aperture,
  maxblur: fxParams.maxblur,
});
bokehPass.enabled = fxParams.dof;
composer.addPass(bokehPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  fxParams.bloom, fxParams.bloomRadius, fxParams.bloomThreshold
);
composer.addPass(bloomPass);

const GradeShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    uVignette: { value: fxParams.vignette },
    uGrain: { value: fxParams.grain },
    uChroma: { value: fxParams.chroma },
    uSaturation: { value: fxParams.saturation },
    uContrast: { value: fxParams.contrast },
    uTemperature: { value: fxParams.temperature },
    uLetterbox: { value: fxParams.letterbox },
  },
  vertexShader: /* glsl */ `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */ `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform float uVignette;
    uniform float uGrain;
    uniform float uChroma;
    uniform float uSaturation;
    uniform float uContrast;
    uniform float uTemperature;
    uniform float uLetterbox;
    varying vec2 vUv;
    float ign(vec2 p) {
      return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715))));
    }
    void main() {
      vec2 dir = vUv - vec2(0.5);
      vec2 off = dir * dot(dir, dir) * uChroma * 0.05;
      vec4 color = texture2D(tDiffuse, vUv);
      color.r = texture2D(tDiffuse, vUv - off).r;
      color.b = texture2D(tDiffuse, vUv + off).b;

      color.rgb *= vec3(1.0 + uTemperature * 0.10, 1.0 + uTemperature * 0.02, 1.0 - uTemperature * 0.10);

      float luma = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      color.rgb = mix(vec3(luma), color.rgb, uSaturation);
      color.rgb = max((color.rgb - 0.18) * uContrast + 0.18, 0.0);

      float d = distance(vUv, vec2(0.5));
      color.rgb *= 1.0 - uVignette * smoothstep(0.32, 0.82, d);

      vec2 jitter = vec2(mod(uTime * 61.0, 17.0), mod(uTime * 83.0, 29.0));
      float n = ign(gl_FragCoord.xy + jitter);
      float lumaOut = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
      color.rgb += (n - 0.5) * uGrain * (0.1 + 0.9 * smoothstep(0.0, 0.35, lumaOut));

      if (vUv.y < uLetterbox || vUv.y > 1.0 - uLetterbox) color.rgb = vec3(0.0);
      gl_FragColor = color;
    }
  `,
};
const gradePass = new ShaderPass(GradeShader);
composer.addPass(gradePass);
composer.addPass(new OutputPass());

// ── mood apply ───────────────────────────────────────────────────────────────
function applyMood(name) {
  const m = MOODS[name];
  if (!m) return;
  studio.key.color.set(m.key.color);
  studio.key.intensity = m.key.intensity;
  studio.fill.color.set(m.fill.color);
  studio.fill.intensity = m.fill.intensity;
  studio.rim.color.set(m.rim.color);
  studio.rim.intensity = m.rim.intensity;
  studio.cyc.material.color.set(m.backdrop);
  studio.setFloorHorizon(m.backdrop);
  studio.shaft.material.uniforms.uColor.value.set(m.key.color);
  studio.shaft.material.uniforms.uOpacity.value = m.haze;
  studio.shaft.mesh.visible = m.haze > 0.001;
  studio.dust.material.opacity = m.dust;
  studio.dust.points.visible = m.dust > 0.001;
  scene.background.set(m.backdrop);
  scene.fog.color.set(m.backdrop);
  scene.fog.density = m.fog;
  scene.environmentIntensity = m.env;
  renderer.toneMappingExposure = m.exposure;
  bloomPass.strength = m.bloom;
  fxParams.bloom = m.bloom;

  Object.assign(studioParams, {
    keyLight: m.key.intensity,
    fillLight: m.fill.intensity,
    rimLight: m.rim.intensity,
    haze: m.haze,
    dust: m.dust,
    exposure: m.exposure,
    backdrop: m.backdrop,
  });
  gui.controllersRecursive().forEach((c) => c.updateDisplay());
}

// ── GUI ──────────────────────────────────────────────────────────────────────
const gui = new GUI({ title: 'Studio Environment' });

const fStudio = gui.addFolder('Studio');
fStudio.add(studioParams, 'mood', Object.keys(MOODS)).onChange(applyMood);
fStudio.add(studioParams, 'keyLight', 0, 250, 1).onChange((v) => { studio.key.intensity = v; });
fStudio.add(studioParams, 'fillLight', 0, 12, 0.1).onChange((v) => { studio.fill.intensity = v; });
fStudio.add(studioParams, 'rimLight', 0, 40, 0.1).onChange((v) => { studio.rim.intensity = v; });
fStudio.add(studioParams, 'haze', 0, 0.5, 0.005).onChange((v) => {
  studio.shaft.material.uniforms.uOpacity.value = v;
  studio.shaft.mesh.visible = v > 0.001;
});
fStudio.add(studioParams, 'dust', 0, 1, 0.01).onChange((v) => {
  studio.dust.material.opacity = v;
  studio.dust.points.visible = v > 0.001;
});
fStudio.add(studioParams, 'exposure', 0.3, 2, 0.01).onChange((v) => { renderer.toneMappingExposure = v; });
fStudio.addColor(studioParams, 'backdrop').onChange((v) => {
  studio.cyc.material.color.set(v);
  studio.setFloorHorizon(v);
  scene.background.set(v);
  scene.fog.color.set(v);
});
fStudio.open();

const fCam = gui.addFolder('Camera');
fCam.add(cameraParams, 'fov', 18, 60, 0.5).onChange((v) => {
  camera.fov = v;
  camera.updateProjectionMatrix();
});
fCam.add(cameraParams, 'turntable');
fCam.add(cameraParams, 'speed', 0.2, 5, 0.1).name('turntable speed');
fCam.close();

const fFX = gui.addFolder('FX');
fFX.add(fxParams, 'bloom', 0, 1.5, 0.01).name('bloom strength').onChange((v) => { bloomPass.strength = v; });
fFX.add(fxParams, 'bloomRadius', 0, 1, 0.01).name('bloom radius').onChange((v) => { bloomPass.radius = v; });
fFX.add(fxParams, 'bloomThreshold', 0, 1.5, 0.01).name('bloom threshold').onChange((v) => { bloomPass.threshold = v; });
fFX.add(fxParams, 'ao').name('ambient occlusion').onChange((v) => { gtaoPass.enabled = v; });
fFX.add(fxParams, 'aoIntensity', 0, 1, 0.01).name('ao intensity').onChange((v) => { gtaoPass.blendIntensity = v; });
fFX.add(fxParams, 'aoRadius', 0.05, 1, 0.01).name('ao radius').onChange((v) => {
  gtaoPass.updateGtaoMaterial({ radius: v });
});
fFX.add(fxParams, 'dof').name('depth of field').onChange((v) => { bokehPass.enabled = v; });
fFX.add(fxParams, 'aperture', 0, 0.01, 0.0001).onChange((v) => { bokehPass.uniforms['aperture'].value = v; });
fFX.add(fxParams, 'maxblur', 0, 0.02, 0.0005).name('max blur').onChange((v) => { bokehPass.uniforms['maxblur'].value = v; });
fFX.add(fxParams, 'chroma', 0, 1, 0.01).name('chromatic aberration').onChange((v) => { gradePass.uniforms.uChroma.value = v; });
fFX.add(fxParams, 'saturation', 0, 2, 0.01).onChange((v) => { gradePass.uniforms.uSaturation.value = v; });
fFX.add(fxParams, 'contrast', 0.5, 1.5, 0.01).onChange((v) => { gradePass.uniforms.uContrast.value = v; });
fFX.add(fxParams, 'temperature', -1, 1, 0.01).onChange((v) => { gradePass.uniforms.uTemperature.value = v; });
fFX.add(fxParams, 'vignette', 0, 1, 0.01).onChange((v) => { gradePass.uniforms.uVignette.value = v; });
fFX.add(fxParams, 'grain', 0, 0.15, 0.001).onChange((v) => { gradePass.uniforms.uGrain.value = v; });
fFX.add(fxParams, 'letterbox', 0, 0.2, 0.005).onChange((v) => { gradePass.uniforms.uLetterbox.value = v; });
fFX.open();

applyMood(studioParams.mood);

// ── loop ─────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  gtaoPass.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop((time) => {
  const t = time / 1000;
  controls.autoRotate = cameraParams.turntable;
  controls.autoRotateSpeed = cameraParams.speed;
  controls.update();
  controls.target.y = Math.max(controls.target.y, 0.08);
  camera.position.y = Math.max(camera.position.y, 0.08);

  torus.rotation.y += 0.004;
  studio.update(t);
  gradePass.uniforms.uTime.value = t;
  if (fxParams.dof) {
    bokehPass.uniforms['focus'].value = camera.position.distanceTo(controls.target);
  }
  composer.render();
});
</script>
</html>
