<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>47.水下斯涅尔窗</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #container, canvas { width: 100%; height: 100%; display: block; }
    body { overflow: hidden; background: #020305; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
      "@petamoriken/float16": "https://cdn.jsdelivr.net/npm/@petamoriken/float16@3.9.2/browser/float16.mjs",
      "astronomy-engine": "https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/esm/astronomy.js",
      "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js",
      "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.37.4/build/index.js",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/build/index.module.js",
      "three-stdlib": "https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/runtime/exr-loader.js"
    }
  }
  </script>
  <script src="../assets/loading-overlay.js"></script>
</head>
<body>
  <div id="container"><canvas id="view"></canvas></div>
  <script type="module">
    import * as THREE from "three/webgpu";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GUI } from "three/addons/libs/lil-gui.module.min.js";
    import Stats from "three/addons/libs/stats.module.js";

        import {
    
      bakeSkyEnvironment,
    
      CausticsPass,
    
      createSandMaterial,
    
      createSkyDome,
    
      createSunLight,
    
      Rng,
    
      runFftSelfTest,
    
      SKY_ENVIRONMENT_INTENSITY,
    
      SubmergedOcean,
    
      UnderwaterMediumPipeline,
    
    } from "https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/skills/threejs-spectral-ocean/examples/submerged-snell-ocean/underwater-snell-ocean.bundle.js";
    
    
    
    const SEABED_Y = -26;
    
    const CAMERA_MIN_Y = SEABED_Y + 1.25;
    
    const CAMERA_MAX_Y = -3.5;
    
    const SAUCER_EXTENT = 2800;
    
    const SAUCER_SEGMENTS = 224;
    
    const SAUCER_RISE_START = 680;
    
    const SAUCER_RISE_END = 1150;
    
    const TOWER_Z = -34;
    
    
    
    function hash2(x, y, seed) {
    
      let value =
    
        Math.imul(x | 0, 374761393) +
    
        Math.imul(y | 0, 668265263) +
    
        Math.imul(seed | 0, 2246822519);
    
      value = Math.imul(value ^ (value >>> 13), 1274126177);
    
      return ((value ^ (value >>> 16)) >>> 0) / 4294967296;
    
    }
    
    
    
    function smoothCurve(value) {
    
      return value * value * (3 - 2 * value);
    
    }
    
    
    
    function valueNoise2(x, y, seed = 0) {
    
      const xi = Math.floor(x);
    
      const yi = Math.floor(y);
    
      const xf = x - xi;
    
      const yf = y - yi;
    
      const a = hash2(xi, yi, seed);
    
      const b = hash2(xi + 1, yi, seed);
    
      const c = hash2(xi, yi + 1, seed);
    
      const d = hash2(xi + 1, yi + 1, seed);
    
      const u = smoothCurve(xf);
    
      const v = smoothCurve(yf);
    
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    
    }
    
    
    
    function fbm2(x, y, octaves = 5, seed = 0) {
    
      let value = 0;
    
      let amplitude = 0.5;
    
      let fx = x;
    
      let fy = y;
    
      for (let index = 0; index < octaves; index += 1) {
    
        value += valueNoise2(fx, fy, seed + index * 101) * amplitude;
    
        const rotatedX = fx * 0.8 - fy * 0.6;
    
        const rotatedY = fx * 0.6 + fy * 0.8;
    
        fx = rotatedX * 2.03;
    
        fy = rotatedY * 2.03;
    
        amplitude *= 0.5;
    
      }
    
      return value;
    
    }
    
    
    
    function smoothstepNumber(edge0, edge1, value) {
    
      const t = THREE.MathUtils.clamp((value - edge0) / (edge1 - edge0), 0, 1);
    
      return t * t * (3 - 2 * t);
    
    }
    
    
    
    /**
    
     * The far rim: terrain fills the water column geometrically, which is what
    
     * closes the seabed/ocean horizon gap. A view-aligned scattering slab cannot
    
     * do it — see the note in the medium.
    
     */
    
    function saucerHeight(x, z) {
    
      const blend = smoothstepNumber(
    
        SAUCER_RISE_START,
    
        SAUCER_RISE_END,
    
        Math.hypot(x, z),
    
      );
    
      const rimTop = -3.6 + (fbm2(x * 0.006, z * 0.006, 3, 131) - 0.5) * 2.2;
    
      return THREE.MathUtils.lerp(SEABED_Y, rimTop, blend);
    
    }
    
    
    
    function createSaucerSeabedGeometry() {
    
      const geometry = new THREE.PlaneGeometry(
    
        SAUCER_EXTENT,
    
        SAUCER_EXTENT,
    
        SAUCER_SEGMENTS,
    
        SAUCER_SEGMENTS,
    
      );
    
      geometry.rotateX(-Math.PI / 2);
    
      const positions = geometry.getAttribute("position");
    
      for (let index = 0; index < positions.count; index += 1) {
    
        positions.setY(
    
          index,
    
          saucerHeight(positions.getX(index), positions.getZ(index)),
    
        );
    
      }
    
      positions.needsUpdate = true;
    
      geometry.computeVertexNormals();
    
      geometry.computeBoundingBox();
    
      geometry.computeBoundingSphere();
    
      return geometry;
    
    }
    
    
    
    function createMaterial(color, roughness, metalness, medium = null) {
    
      const material = new THREE.MeshStandardNodeMaterial();
    
      material.color.set(color);
    
      material.roughness = roughness;
    
      material.metalness = metalness;
    
      if (medium) medium.applyCaustics(material, 1.2);
    
      return material;
    
    }
    
    
    
    function createStrut(material, start, end, radius, radialSegments = 12) {
    
      const direction = new THREE.Vector3().subVectors(end, start);
    
      const length = direction.length();
    
      const geometry = new THREE.CylinderGeometry(
    
        radius,
    
        radius,
    
        length,
    
        radialSegments,
    
      );
    
      const mesh = new THREE.Mesh(geometry, material);
    
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
    
      mesh.quaternion.setFromUnitVectors(
    
        new THREE.Vector3(0, 1, 0),
    
        direction.normalize(),
    
      );
    
      mesh.castShadow = true;
    
      mesh.receiveShadow = true;
    
      return mesh;
    
    }
    
    
    
    /**
    
     * A deliberately simplified structure that crosses the waterline: seabed-rooted
    
     * piles with underwater bracing, a deck, and an above-water headframe. Its
    
     * air-side geometry is what the Snell window has to transport.
    
     */
    
    function createWaterlineTower(medium) {
    
      const group = new THREE.Group();
    
      const underwaterBronze = createMaterial(0x376f70, 0.54, 0.72, medium);
    
      const bronze = createMaterial(0x7b5b2d, 0.36, 0.82);
    
      const iron = createMaterial(0x283640, 0.48, 0.72);
    
      const timber = createMaterial(0x6e4a2a, 0.78, 0.04);
    
      const canvas = createMaterial(0x86b0aa, 0.9, 0);
    
      canvas.side = THREE.DoubleSide;
    
      const materials = [underwaterBronze, bronze, iron, timber, canvas];
    
      const airSide = [];
    
    
    
      const pileRadius = 5.5;
    
      const pileCount = 6;
    
      const pilePoints = [];
    
      for (let index = 0; index < pileCount; index += 1) {
    
        const angle = (index / pileCount) * Math.PI * 2 + Math.PI / 6;
    
        const x = Math.sin(angle) * pileRadius;
    
        const z = Math.cos(angle) * pileRadius;
    
        pilePoints.push(new THREE.Vector3(x, 0, z));
    
    
    
        const underwaterHeight = -SEABED_Y;
    
        const underwaterPile = new THREE.Mesh(
    
          new THREE.CylinderGeometry(0.3, 0.42, underwaterHeight, 18),
    
          underwaterBronze,
    
        );
    
        underwaterPile.position.set(x, SEABED_Y + underwaterHeight * 0.5, z);
    
        underwaterPile.castShadow = true;
    
        underwaterPile.receiveShadow = true;
    
        group.add(underwaterPile);
    
    
    
        const upperPile = new THREE.Mesh(
    
          new THREE.CylinderGeometry(0.28, 0.3, 2.45, 18),
    
          bronze,
    
        );
    
        upperPile.position.set(x, 1.225, z);
    
        upperPile.castShadow = true;
    
        upperPile.receiveShadow = true;
    
        group.add(upperPile);
    
        airSide.push(upperPile);
    
      }
    
    
    
      for (let index = 0; index < pileCount; index += 1) {
    
        const next = (index + 1) % pileCount;
    
        const a = pilePoints[index];
    
        const b = pilePoints[next];
    
        for (const [top, bottom] of [[-2, -14], [-14, -25]]) {
    
          group.add(
    
            createStrut(
    
              underwaterBronze,
    
              new THREE.Vector3(a.x, top, a.z),
    
              new THREE.Vector3(b.x, bottom, b.z),
    
              0.075,
    
            ),
    
          );
    
          group.add(
    
            createStrut(
    
              underwaterBronze,
    
              new THREE.Vector3(b.x, top, b.z),
    
              new THREE.Vector3(a.x, bottom, a.z),
    
              0.075,
    
            ),
    
          );
    
        }
    
      }
    
    
    
      const deck = new THREE.Mesh(
    
        new THREE.CylinderGeometry(6.5, 6.5, 0.48, 72),
    
        timber,
    
      );
    
      deck.position.y = 2.62;
    
      deck.castShadow = true;
    
      deck.receiveShadow = true;
    
      group.add(deck);
    
      airSide.push(deck);
    
    
    
      const deckTrim = new THREE.Mesh(
    
        new THREE.TorusGeometry(6.52, 0.1, 10, 72),
    
        bronze,
    
      );
    
      deckTrim.rotation.x = Math.PI / 2;
    
      deckTrim.position.y = 2.82;
    
      group.add(deckTrim);
    
      airSide.push(deckTrim);
    
    
    
      const legAngles = [Math.PI / 4, 3 * Math.PI / 4, 5 * Math.PI / 4, 7 * Math.PI / 4];
    
      for (const angle of legAngles) {
    
        const leg = createStrut(
    
          iron,
    
          new THREE.Vector3(Math.sin(angle) * 3.6, 2.85, Math.cos(angle) * 3.6),
    
          new THREE.Vector3(Math.sin(angle) * 0.65, 13.2, Math.cos(angle) * 0.65),
    
          0.15,
    
          16,
    
        );
    
        group.add(leg);
    
        airSide.push(leg);
    
      }
    
    
    
      const canopy = new THREE.Mesh(
    
        new THREE.CylinderGeometry(2.1, 6.15, 1.2, 72, 1, true),
    
        canvas,
    
      );
    
      canopy.position.y = 6.05;
    
      canopy.castShadow = true;
    
      group.add(canopy);
    
      airSide.push(canopy);
    
    
    
      const crown = new THREE.Mesh(
    
        new THREE.TorusGeometry(0.72, 0.1, 12, 40),
    
        bronze,
    
      );
    
      crown.rotation.x = Math.PI / 2;
    
      crown.position.y = 13.35;
    
      group.add(crown);
    
      airSide.push(crown);
    
    
    
      const beacon = new THREE.Mesh(
    
        new THREE.CylinderGeometry(0.38, 0.62, 2.6, 24),
    
        bronze,
    
      );
    
      beacon.position.y = 14.65;
    
      beacon.castShadow = true;
    
      group.add(beacon);
    
      airSide.push(beacon);
    
    
    
      return { group, materials, airSide };
    
    }
    
    
    
    function clampCamera(camera, controls) {
    
      camera.position.y = THREE.MathUtils.clamp(
    
        camera.position.y,
    
        CAMERA_MIN_Y,
    
        CAMERA_MAX_Y,
    
      );
    
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, -220, 220);
    
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, -220, 220);
    
      if (controls?.target) {
    
        controls.target.x = THREE.MathUtils.clamp(controls.target.x, -180, 180);
    
        controls.target.y = THREE.MathUtils.clamp(controls.target.y, SEABED_Y + 0.5, 16);
    
        controls.target.z = THREE.MathUtils.clamp(controls.target.z, -180, 180);
    
        controls.update();
    
      }
    
    }
    
    
    
    const sceneModule = {
    
      backend: "webgpu",
    
      initialTime: 28,
    
      renderer: {
    
        options: { antialias: false },
    
        toneMapping: THREE.NoToneMapping,
    
        exposure: 1,
    
        clearColor: 0x061b2d,
    
      },
    
      camera: {
    
        fov: 50,
    
        near: 0.1,
    
        far: 5000,
    
        position: [19, -23.17, -22],
    
      },
    
      controls: {
    
        target: [7.2, 1.54, -35.73],
    
        minDistance: 8,
    
        maxDistance: 180,
    
        minPolarAngle: 0.05,
    
        maxPolarAngle: Math.PI - 0.05,
    
        enablePan: true,
    
      },
    
      async setup({ renderer, scene, camera, controls }) {
    
        renderer.shadowMap.enabled = true;
    
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    
    
    
        const fftValidation = await runFftSelfTest(renderer);
    
        if (
    
          fftValidation.maxErrorConstant >= 1e-3 ||
    
          fftValidation.maxErrorWave >= 1e-3
    
        ) {
    
          throw new Error(
    
            `IFFT validation failed: constant=${fftValidation.maxErrorConstant}, ` +
    
            `wave=${fftValidation.maxErrorWave}`,
    
          );
    
        }
    
    
    
        const sky = createSkyDome();
    
        scene.add(sky);
    
        const environment = bakeSkyEnvironment(renderer, sky);
    
        scene.environment = environment.texture;
    
        scene.environmentIntensity = SKY_ENVIRONMENT_INTENSITY;
    
    
    
        const sun = createSunLight(2048);
    
        sun.shadow.camera.left = -80;
    
        sun.shadow.camera.right = 80;
    
        sun.shadow.camera.top = 80;
    
        sun.shadow.camera.bottom = -80;
    
        sun.shadow.camera.near = 1;
    
        sun.shadow.camera.far = 900;
    
        scene.add(sun, sun.target);
    
    
    
        const ocean = new SubmergedOcean(scene, new Rng(19051906), {
    
          segments: 384,
    
        });
    
        const caustics = new CausticsPass(ocean.simulation, 1024);
    
        const medium = new UnderwaterMediumPipeline(
    
          renderer,
    
          scene,
    
          camera,
    
          caustics,
    
          {
    
            godraySteps: 14,
    
            particulateCount: 18_000,
    
            submerged: ocean.submerged,
    
          },
    
        );
    
    
    
        const seabedMaterial = createSandMaterial((material, strength) =>
    
          medium.applyCaustics(material, strength)
    
        );
    
        const seabed = new THREE.Mesh(
    
          createSaucerSeabedGeometry(),
    
          seabedMaterial,
    
        );
    
        seabed.receiveShadow = true;
    
        scene.add(seabed);
    
    
    
        const tower = createWaterlineTower(medium);
    
        tower.group.position.z = TOWER_Z;
    
        scene.add(tower.group);
    
        // The tower's air-side geometry is registered with the interface layer, so
    
        // the Snell window shows its forward-refracted image instead of bare sky.
    
        ocean.register({
    
          name: "waterline tower",
    
          root: tower.group,
    
          meshes: tower.airSide,
    
          maxEdgeLength: 1.2,
    
          minimumLocalY: -0.1,
    
          stableMeanSurface: true,
    
          liveInterfaceMotion: true,
    
          underwaterOnly: true,
    
          maxCameraDistance: 130,
    
        });
    
    
    
        clampCamera(camera, controls);
    
        return {
    
          setDebugMode(mode) {
    
            medium.setDebugMode(mode);
    
          },
    
          update({ elapsed, delta }) {
    
            clampCamera(camera, controls);
    
            ocean.update(
    
              renderer,
    
              camera,
    
              scene,
    
              elapsed,
    
              Math.max(delta, 1 / 120),
    
            );
    
            caustics.update(renderer);
    
            medium.update(elapsed);
    
            sky.position.copy(camera.position);
    
          },
    
          render() {
    
            medium.render();
    
          },
    
          metrics() {
    
            const snapshot = ocean.interfaceStructures.debugSnapshot();
    
            return {
    
              spectrum: "256² × 3",
    
              caustics: "1024²",
    
              raySteps: "14",
    
              interfaceLayer: `${snapshot.active ? "on" : "off"} ${snapshot.draws}d/${snapshot.triangles}t`,
    
              fftTest: `pass ${Math.max(
    
                fftValidation.maxErrorConstant,
    
                fftValidation.maxErrorWave,
    
              ).toExponential(1)}`,
    
            };
    
          },
    
          dispose() {
    
            medium.dispose();
    
            caustics.dispose();
    
            ocean.dispose(scene);
    
            scene.remove(seabed, sky, tower.group, sun, sun.target);
    
            scene.environment = null;
    
            environment.dispose();
    
            seabed.geometry.dispose();
    
            seabedMaterial.dispose();
    
            sky.geometry.dispose();
    
            sky.material.dispose();
    
            const geometries = new Set();
    
            tower.group.traverse((object) => {
    
              if (object.isMesh) geometries.add(object.geometry);
    
            });
    
            for (const geometry of geometries) geometry.dispose();
    
            for (const material of tower.materials) material.dispose();
    
          },
    
        };
    
      },
    
    };

    if ((sceneModule.backend === "webgpu" || sceneModule.backend === "raw-webgpu") && !navigator.gpu) {
      throw new Error("WebGPU unavailable");
    }

    const canvas = document.querySelector("#view");
    const rawWebGpu = sceneModule.backend === "raw-webgpu";
    const rendererOptions = {
      canvas,
      antialias: true,
      powerPreference: "high-performance",
      ...(sceneModule.renderer?.options ?? {}),
    };
    const renderer = rawWebGpu
      ? null
      : sceneModule.backend === "webgpu"
        ? new THREE.WebGPURenderer(rendererOptions)
        : new THREE.WebGLRenderer(rendererOptions);

    if (typeof renderer?.init === "function") await renderer.init();
    if (renderer) {
      renderer.outputColorSpace = sceneModule.renderer?.outputColorSpace ?? THREE.SRGBColorSpace;
      renderer.toneMapping = sceneModule.renderer?.toneMapping ?? THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = sceneModule.renderer?.exposure ?? 1;
    }
    if (renderer && sceneModule.renderer?.clearColor != null) {
      renderer.setClearColor(sceneModule.renderer.clearColor, sceneModule.renderer.clearAlpha ?? 1);
    }

    const scene = new THREE.Scene();
    const cameraConfig = sceneModule.camera ?? {};
    const camera = cameraConfig.type === "orthographic"
      ? new THREE.OrthographicCamera(
          cameraConfig.left ?? -1,
          cameraConfig.right ?? 1,
          cameraConfig.top ?? 1,
          cameraConfig.bottom ?? -1,
          cameraConfig.near ?? 0,
          cameraConfig.far ?? 1,
        )
      : new THREE.PerspectiveCamera(
          cameraConfig.fov ?? 50,
          1,
          cameraConfig.near ?? 0.1,
          cameraConfig.far ?? 2000,
        );
    if (cameraConfig.position) camera.position.fromArray(cameraConfig.position);
    if (cameraConfig.up) camera.up.fromArray(cameraConfig.up);

    const controlsConfig = sceneModule.controls ?? {};
    const controls = controlsConfig.enabled === false || cameraConfig.type === "orthographic"
      ? null
      : new OrbitControls(camera, canvas);
    if (controls) {
      controls.enableDamping = controlsConfig.enableDamping ?? true;
      controls.dampingFactor = controlsConfig.dampingFactor ?? 0.08;
      controls.enablePan = controlsConfig.enablePan ?? true;
      controls.enableZoom = controlsConfig.enableZoom ?? true;
      controls.screenSpacePanning = controlsConfig.screenSpacePanning ?? true;
      controls.minDistance = controlsConfig.minDistance ?? 0;
      controls.maxDistance = controlsConfig.maxDistance ?? Infinity;
      controls.minPolarAngle = controlsConfig.minPolarAngle ?? 0;
      controls.maxPolarAngle = controlsConfig.maxPolarAngle ?? Math.PI;
      controls.minAzimuthAngle = controlsConfig.minAzimuthAngle ?? -Infinity;
      controls.maxAzimuthAngle = controlsConfig.maxAzimuthAngle ?? Infinity;
      controls.target.fromArray(controlsConfig.target ?? [0, 0, 0]);
      controls.update();
    }

    function resolveAsset(relativePath) {
      if (/^https?:\/\//.test(relativePath)) return relativePath;
      return new URL(relativePath, new URL("https://cdn.jsdelivr.net/gh/zhangyiweb/models@4b84f07/awesome/examples/threejs-spectral-ocean/submerged-snell-ocean/", import.meta.url)).href;
    }

    const example = await sceneModule.setup({
      THREE,
      canvas,
      renderer,
      scene,
      camera,
      controls,
      resolveAsset,
    }) ?? {};

    const params = {
      paused: false,
      timeScale: 1,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      debugMode: "final",
    };
    if (renderer) renderer.setPixelRatio(params.dpr);
    example.setDebugMode?.(params.debugMode);

    const drawingBufferSize = renderer ? new THREE.Vector2() : null;
    function resize() {
      const width = Math.max(1, canvas.clientWidth);
      const height = Math.max(1, canvas.clientHeight);
      const bufferWidth = Math.round(width * params.dpr);
      const bufferHeight = Math.round(height * params.dpr);
    if (rawWebGpu) {
        example.resize?.({ width, height, bufferWidth, bufferHeight, dpr: params.dpr });
        if (camera.isPerspectiveCamera) {
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        }
        return;
      }
      renderer.getDrawingBufferSize(drawingBufferSize);
      if (drawingBufferSize.x === bufferWidth && drawingBufferSize.y === bufferHeight) return;
      renderer.setPixelRatio(params.dpr);
      renderer.setSize(width, height, false);
      if (camera.isPerspectiveCamera) {
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }
      example.resize?.({ width, height, bufferWidth, bufferHeight, dpr: params.dpr });
    }

    const stats = new Stats();
    document.body.appendChild(stats.dom);
    const gui = new GUI({ title: "47.水下斯涅尔窗" });
    gui.add(params, "paused").name("暂停");
    gui.add(params, "timeScale", 0, 3, 0.05).name("时间缩放");
    gui.add(params, "dpr", 0.5, 2, 0.25).name("像素比").onChange(resize);
    gui.add(params, "debugMode", {
      "Final": "final",
      "No medium": "no-medium",
      "Aquatic fog": "fog",
      "God rays": "god-rays",
      "Caustic tile": "caustics",
      "Scene depth": "depth",
    }).name("调试").onChange((value) => example.setDebugMode?.(value));

    let elapsed = sceneModule.initialTime ?? 0;
    let previous = performance.now();
    let frameInProgress = false;
    resize();
    window.__sceneLoader?.done();

    async function frame(now) {
      if (frameInProgress) return;
      frameInProgress = true;
      try {
        stats.update();
        resize();
        const rawDelta = Math.min((now - previous) / 1000, 0.1);
        previous = now;
        const delta = params.paused ? 0 : rawDelta * params.timeScale;
        elapsed += delta;
        controls?.update();
        await example.update?.({ delta, rawDelta, elapsed, state: params, camera, controls });
        if (example.render) {
          await example.render({ renderer, scene, camera, elapsed, delta, rawDelta, state: params });
        } else if (typeof renderer?.renderAsync === "function") {
          await renderer.renderAsync(scene, camera);
        } else if (renderer) {
          renderer.render(scene, camera);
        }
      } finally {
        frameInProgress = false;
      }
    }

    if (rawWebGpu) {
      let rawAnimationFrame = 0;
      let rawLoopStopped = false;
      const rawLoop = async (now) => {
        await frame(now);
        if (!rawLoopStopped) rawAnimationFrame = requestAnimationFrame(rawLoop);
      };
      rawAnimationFrame = requestAnimationFrame(rawLoop);
      window.addEventListener("pagehide", () => {
        rawLoopStopped = true;
        cancelAnimationFrame(rawAnimationFrame);
        gui.destroy();
        stats.dom.remove();
        controls?.dispose();
        example.dispose?.();
      }, { once: true });
    } else {
      renderer.setAnimationLoop(frame);
      window.addEventListener("pagehide", () => {
        renderer.setAnimationLoop(null);
        gui.destroy();
        stats.dom.remove();
        controls?.dispose();
        example.dispose?.();
        renderer.dispose();
      }, { once: true });
    }
  </script>
</body>
</html>
