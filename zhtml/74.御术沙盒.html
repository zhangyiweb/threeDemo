<style>
/* ------------------------------------------------------------------ *
 * Bending Sandbox — UI shell
 * The 3D view owns the whole viewport; everything here floats on top.
 * ------------------------------------------------------------------ */

:root {
  --ui-bg: rgba(10, 14, 20, 0.55);
  --ui-bg-solid: rgba(12, 16, 22, 0.92);
  --ui-border: rgba(255, 255, 255, 0.12);
  --ui-text: rgba(238, 245, 255, 0.92);
  --ui-text-dim: rgba(197, 214, 232, 0.6);
  --ui-accent: #7fd6ff;
  --ui-radius: 14px;
  --ui-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  --ui-font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #05070a;
  color: var(--ui-text);
  font-family: var(--ui-font);
  -webkit-font-smoothing: antialiased;
}

#viewport {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
}

/* ------------------------------------------------------------------ *
 * Loading veil
 * ------------------------------------------------------------------ */

.loader {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  background: radial-gradient(120% 120% at 50% 30%, #16202c 0%, #05070a 70%);
  transition: opacity 0.7s ease, visibility 0.7s;
}

.loader.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loader__inner {
  text-align: center;
  width: min(420px, 80vw);
}

.loader__title {
  margin: 22px 0 18px;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 0.18em;
}

.loader__sigil {
  display: flex;
  justify-content: center;
  gap: 14px;
}

.sigil {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  animation: sigil-pulse 1.8s ease-in-out infinite;
}

.sigil--fire {
  background: #ff6a1a;
}
.sigil--water {
  background: #31b6ff;
  animation-delay: 0.15s;
}
.sigil--earth {
  background: #b98a4d;
  animation-delay: 0.3s;
}
.sigil--air {
  background: #c9f0ff;
  animation-delay: 0.45s;
}

@keyframes sigil-pulse {
  0%,
  100% {
    transform: scale(0.7);
    opacity: 0.35;
  }
  50% {
    transform: scale(1.15);
    opacity: 1;
  }
}

.loader__bar {
  height: 3px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.1);
  overflow: hidden;
}

.loader__bar i {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: 3px;
  background: linear-gradient(90deg, #ff6a1a, #31b6ff, #c9f0ff);
  transition: width 0.25s ease;
}

.loader__status {
  margin: 14px 0 0;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ui-text-dim);
}

/* ------------------------------------------------------------------ *
 * HUD
 * ------------------------------------------------------------------ */

.hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 20;
  font-size: 13px;
}

.hud__elements {
  position: absolute;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  pointer-events: auto;
}

/* The element picker is meaningless while walking — keep it visible but quiet. */
.hud__elements.is-dimmed {
  opacity: 0.32;
  filter: saturate(0.35);
}

.hud__modes {
  position: absolute;
  left: 50%;
  bottom: 118px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px;
  border-radius: 999px;
  border: 1px solid var(--ui-border);
  background: var(--ui-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--ui-shadow);
  pointer-events: auto;
}

.mode-card {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 16px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ui-text-dim);
  cursor: pointer;
  user-select: none;
  transition: color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
}

.mode-card:hover {
  color: var(--ui-text);
}

.mode-card.is-active {
  color: #06131c;
  background: var(--ui-accent);
  box-shadow: 0 0 22px -6px var(--ui-accent);
}

.mode-card__glyph {
  font-size: 13px;
  line-height: 1;
}

.hud__modes-key {
  padding: 0 10px 0 6px;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--ui-text-dim);
}

.element-card {
  position: relative;
  width: 86px;
  padding: 10px 8px 9px;
  border-radius: var(--ui-radius);
  border: 1px solid var(--ui-border);
  background: var(--ui-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--ui-shadow);
  text-align: center;
  cursor: pointer;
  transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  user-select: none;
}

.element-card:hover {
  transform: translateY(-3px);
  background: rgba(20, 28, 38, 0.7);
}

.element-card.is-active {
  border-color: var(--accent, var(--ui-accent));
  background: rgba(20, 28, 38, 0.82);
  box-shadow: 0 0 0 1px var(--accent, var(--ui-accent)) inset, 0 8px 28px rgba(0, 0, 0, 0.5),
    0 0 26px -6px var(--accent, var(--ui-accent));
}

.element-card__glyph {
  font-size: 22px;
  line-height: 1;
  color: var(--accent, var(--ui-accent));
  text-shadow: 0 0 14px var(--accent, var(--ui-accent));
}

/* Inline sigils: sized like the old text glyph, glow via filter instead. */
.element-card__glyph .glyph-svg {
  display: block;
  width: 30px;
  height: 30px;
  margin: 1px auto 0;
  filter: drop-shadow(0 0 6px var(--accent, var(--ui-accent)));
  transition: filter 0.18s ease;
}

.element-card.is-active .glyph-svg {
  filter: drop-shadow(0 0 10px var(--accent, var(--ui-accent)));
}

.element-card__label {
  margin-top: 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.element-card__key {
  position: absolute;
  top: 6px;
  right: 8px;
  font-size: 10px;
  color: var(--ui-text-dim);
}

.hud__panel {
  position: absolute;
  padding: 12px 14px;
  border-radius: var(--ui-radius);
  border: 1px solid var(--ui-border);
  background: var(--ui-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--ui-shadow);
  line-height: 1.65;
}

.hud__help {
  left: 22px;
  bottom: 26px;
  max-width: 260px;
  color: var(--ui-text-dim);
  transition: opacity 0.3s ease;
}

.hud__help.is-hidden {
  opacity: 0;
}

.hud__help strong {
  color: var(--ui-text);
  font-weight: 600;
}

.hud__help kbd {
  display: inline-block;
  min-width: 18px;
  padding: 1px 5px;
  margin-right: 4px;
  border-radius: 5px;
  border: 1px solid var(--ui-border);
  background: rgba(255, 255, 255, 0.07);
  font: 11px/1.5 var(--ui-font);
  color: var(--ui-text);
  text-align: center;
}

.hud__stats {
  right: 22px;
  top: 22px;
  min-width: 132px;
  font-variant-numeric: tabular-nums;
  color: var(--ui-text-dim);
}

.hud__stats b {
  float: right;
  color: var(--ui-text);
  font-weight: 600;
}

.hud__title {
  left: 22px;
  top: 22px;
  letter-spacing: 0.12em;
  font-size: 13px;
  font-weight: 600;
}

.hud__title span {
  display: block;
  margin-top: 2px;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--ui-text-dim);
  text-transform: none;
}

.hud__toast {
  position: absolute;
  left: 50%;
  top: 76px;
  transform: translate(-50%, -12px);
  padding: 9px 18px;
  border-radius: 999px;
  border: 1px solid var(--ui-border);
  background: var(--ui-bg-solid);
  box-shadow: var(--ui-shadow);
  opacity: 0;
  transition: opacity 0.25s ease, transform 0.25s ease;
  font-size: 12px;
  letter-spacing: 0.04em;
}

.hud__toast.is-visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ------------------------------------------------------------------ *
 * lil-gui theming
 * ------------------------------------------------------------------ */

.lil-gui.root {
  --background-color: rgba(12, 16, 22, 0.9);
  --widget-color: rgba(255, 255, 255, 0.1);
  --focus-color: rgba(127, 214, 255, 0.35);
  --hover-color: rgba(255, 255, 255, 0.16);
  --font-family: var(--ui-font);
  --font-size: 11px;
  --input-font-size: 11px;
  --title-height: 30px;
  --widget-height: 22px;
  --name-width: 46%;
  z-index: 40;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--ui-shadow);
  max-height: calc(100vh - 32px);
}

.lil-gui.root > .title {
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 600;
}

.lil-gui.autoPlace {
  top: 16px;
  right: 16px;
}

@media (max-width: 760px) {
  .hud__help,
  .hud__stats {
    display: none;
  }
  .element-card {
    width: 68px;
  }
  .hud__modes {
    bottom: 108px;
  }
  .mode-card {
    padding: 6px 12px;
  }
}

</style>

</body>

  /* Interaction mode — what a drawn path *means*                        */

    this.elapsed = 0;
    this.delta = 0;

  }

  tick() {
    const now = performance.now() / 1e3;
    this.delta = Math.min(now - this._last, this.maxDelta);

    return this.delta;
  }

  reset() {

    this._decay = 4e-4;
  }

   * @param {THREE.Color} color
   * @param {number} strength 0..1
   * @param {number} [decay]  fraction remaining after one second

  trigger(color, strength, decay = 4e-4) {
    const scaled = strength * settings.post.flashStrength;

  }

    this.strength = 0;
  }
};

         * stays dim is that the power emitted scales as T^4. Both fall out of the

         * the result holds together at any exposure.
         *
         * Fit: Tanner Helland's piecewise approximation, valid 1000-40000 K.
         */
        vec3 blackbody(float kelvin) {
          float t = clamp(kelvin, 1000.0, 12000.0) * 0.01;
          vec3 c;
          if (t <= 66.0) {
            c.r = 1.0;
            c.g = 0.3900816 * log(t) - 0.6318414;
            c.b = t <= 19.0 ? 0.0 : 0.5432068 * log(t - 10.0) - 1.1962540;
          } else {
            c.r = 1.2929362 * pow(t - 60.0, -0.1332047);
            c.g = 1.1298909 * pow(t - 60.0, -0.0755148);
            c.b = 1.0;
          }
          c = clamp(c, 0.0, 1.0);
          return c * c * (0.6 + 0.4 * c); // cheap, accurate-enough sRGB -> linear
        }

        /**
         * Density of the flame at a world point.
         *
         * @param heat out — normalised temperature, 0 at the perturbed surface,
         *             1 in the burning core.
         * @param bath out — how strongly this point is lit by the flame around
         *             it, for the single-scatter term.
         */
        float flameSample(vec3 p, out float heat, out float bath) {
          heat = 0.0;
          bath = 0.0;

          vec3 rel = p - vCenter;
          float ax = dot(rel, vTangent);
          vec3 perp = rel - vTangent * ax;

          float s = vS + ax;                                  // metres from the tail
          float u = clamp(s / max(uStreamLength, 0.01), 0.0, 1.0);
          float age = 1.0 - u;

          // Billowing wake behind a fireball at the nose.
          float radius = uRadius * flameProfile(u)
                       * (1.0 + (uHeadSize - 1.0) * smoothstep(0.62, 1.0, u));

          // A local frame whose "up" is world up (projected off the tangent), so
          // buoyancy, the teardrop stretch and the vertical elongation of the
          // noise all pull in the direction gravity actually cares about.
          vec3 upAxis = vec3(0.0, 1.0, 0.0) - vTangent * vTangent.y;
          float upLen = length(upAxis);
          upAxis = upLen > 1e-3 ? upAxis / upLen : vec3(1.0, 0.0, 0.0);
          vec3 sideAxis = cross(vTangent, upAxis);

          float py = dot(perp, upAxis);
          float px = dot(perp, sideAxis);

          // Buoyant stretch: mostly upward, so the cross-section is a teardrop
          // rather than a symmetric tube. The underside gets a quarter of it —
          // enough that the flame drapes instead of ending on a flat horizontal
          // cut, which is what an unstretched underside reads as.
          float plume = max(uPlume, 0.05);
          float shapedY = py > 0.0 ? py / plume : py / (1.0 + (plume - 1.0) * 0.25);
          float rad = length(vec2(px, shapedY));

          // Fold the axial overshoot past either end into the radius: a capsule,
          // so the stream ends in round caps instead of being sliced flat.
          float over = s - clamp(s, 0.0, uStreamLength);
          rad = sqrt(rad * rad + over * over);

          // Conservative reject *before* paying for any noise: even with the
          // bulge pushed fully outward the field cannot reach past this. Most
          // samples along most rays land here, so this test is what pays for the
          // headroom the hull needs.
          float qNominal = rad / max(radius, 1e-3);
          if (qNominal > REACH_HI * (1.0 + uBulge)) return 0.0;

          float sFlow = s - uTime * uFlow;                    // streams backwards

          // ---- 1. silhouette: metre-scale lobes -------------------------
          // One octave, wavelength of order the flame's own width. A fireball's
          // outline is dominated by lobes this size; turbulence at flame-detail
          // frequency can only nibble the edge of a capsule and the result still
          // reads as a shaded tube.
          float lobe = vnoise(vec3(px, py * 0.8, sFlow * 0.7) * uBulgeScale
                              + vec3(uSeed, uTime * 0.25, 0.0)) * 2.0 - 1.0;
          radius *= 1.0 + uBulge * lobe;

          float q = rad / max(radius, 1e-3);
          float edge = 1.0 - q;
          if (edge < -1.2) return 0.0;

          // ---- 2. vortex roll-up ----------------------------------------
          // Noise domain attached to the stream (a local frame around the axis)
          // so the fire is carried along instead of swimming through the world.
          vec2 rp = rot2(s * uSwirl * 0.3 + uTime * uSwirlSpeed + uSeed) * vec2(px, py);

          // Hot gas sheds ring vortices that travel back down the wake and grow
          // as they age. Rotating the domain in the (streamwise, vertical) plane
          // by that travelling wave folds the field over on itself — this is what
          // produces curling, mushrooming billows. Plain fbm, at any octave
          // count, makes clouds; it never makes curls. The rotation is strongest
          // on the axis and dies off outside the tube, so the fringe is sheared
          // past the core rather than rotating rigidly with it.
          float phase = s * uRingFreq - uTime * uRingSpeed + uSeed;
          float roll = uVortex * sin(phase * 6.2831853)
                     * smoothstep(0.0, 0.32, age) * exp(-q * q * 0.7);
          vec2 rolled = rot2(roll) * vec2(sFlow * uStreamStretch, rp.y * uTongue);

          // ---- 3. turbulence --------------------------------------------
          // Anisotropic on purpose: a lower frequency vertically and along the
          // flow draws every structure out into a tall, streamwise tongue.
          vec3 np = vec3(rp.x, rolled.y, rolled.x) * uNoiseFrequency;
          np.y -= uTime * uBuoyancy;                          // hot gas climbs

          // Radial shear. Gas at the fringe is unconfined and has been climbing
          // and falling behind for longer than gas on the axis, so the domain is
          // dragged upward and backward in proportion to how far out it sits.
          // This is what turns rounded blobs into the tongues that lick up off a
          // flame's edge: without a shear the structures are the same shape
          // everywhere and only their size changes.
          np.y -= uLick * q * q;
          np.z += uLick * 0.45 * q * q;

          float ridge, coarse;
          float n = flameFbm(np, uTime * uBuoyancy * 0.06, ridge, coarse) * 2.0 - 1.0;
          coarse = coarse * 2.0 - 1.0;

          // Filaments belong to the fringe. In the body they only mottle a core
          // that should read as one continuous sheet of burning gas.
          //
          // Note the sign: the ridge peaks *on* an iso-line of the noise, so
          // adding it thickens the iso-lines and the flame ends up drawn in
          // bright closed loops, like a contour map. Subtracting it instead
          // deepens the gaps between lobes, which is what actually separates the
          // fringe into strands.
          float fringe = smoothstep(0.3, 1.05, q);
          float turbulent = n * 0.75 + (0.5 - ridge) * uWisp * fringe;

          // ---- 4. shred --------------------------------------------------
          // The heart of the flame is barely touched by the noise while the
          // fringe is torn apart by it. That contrast — solid burning core, an
          // edge dissolving into wisps — is most of what reads as "fire".
          //
          // The falloff past REACH_LO is not cosmetic: it is what bounds how far
          // outside the nominal tube the noise can push density. Without it the
          // volume reaches well past the proxy hull and the flame is sliced off
          // along a visibly straight edge.
          // The coherent burning core belongs to the head. By the far end of the
          // wake the gas has been churning for the whole flight and there is no
          // quiet axis left, so the erosion floor climbs with age.
          float shred = mix(mix(0.26, 1.0, age), 1.8 * uShred, smoothstep(0.06, 1.05, q))
                      * (1.0 - smoothstep(REACH_LO, REACH_HI, q));
          // Turbulence is *fully developed* in the wake and still growing at the
          // head: the gas at the far end has had the whole flight to break up.
          // Without this the tail is the smoothest part of the volume, and a
          // smooth field marched with a hard density threshold renders its own
          // iso-surfaces as concentric shells — the flame ends up wearing
          // contour rings exactly where it should look most chaotic.
          float erosion = uNoiseStrength * shred * (1.0 + 1.3 * age);
          float field = edge + turbulent * erosion;
          field -= uDetachment * age * 0.55;                  // the tail tears into puffs

          // Temperature gets its own, deliberately blunter field, and the reason
          // is the single least obvious thing in this shader.
          //
          // Radiated power goes as a high power of temperature, so whatever
          // drives the temperature gets its contrast multiplied several-fold on
          // screen. Drive it from the full density field and that amplification
          // lands on the level sets of turbulent noise — which are nested closed
          // loops — and the flame comes out looking like polished agate: dense
          // parallel contour lines wrapping every blob. It is unmistakable once
          // seen and impossible to tune away from the colour end.
          //
          // So the contrast is carried by the capsule falloff, i.e. geometry: hot on the
          // axis, cooling outward, no level sets of its own. The noise only
          // *displaces* that profile — enough that a tongue stays hot along its
          // spine, not enough to draw itself. And it is the two coarsest octaves
          // that do the displacing, since a reaction zone is thick compared with
          // the smallest turbulent scales.
          // Deliberately not the age-amplified erosion the density uses: letting
          // the wake's extra churn into the temperature brings the agate straight
          // back, and only in the tail, which is the last place it is wanted.
          float heatField = edge + coarse * uHeatFollow * uNoiseStrength * shred
                          - uDetachment * age * 0.55;

          float d = smoothstep(0.0, clamp(uSoftness, 0.05, 1.0), field);
          if (d <= 0.0) return 0.0;

          d *= smoothstep(0.0, max(uTailFade, 0.01), u);
          d *= 1.0 - smoothstep(1.0 - uHeadFade, 1.0, u) * step(0.001, uHeadFade);

          // ---- temperature ------------------------------------------------
          // Follows the *perturbed* shape rather than the distance to the axis, so
          // a tongue the large eddies pushed outward stays hot along its own spine
          // and cools toward its own tip — the difference between filaments that
          // are burning and filaments that have been painted orange onto a
          // cylinder. Reading it off the density instead would clamp to 1 across
          // the whole core and flatten the flame into a single white blob.
          float interior = clamp(heatField * uHeatFocus, 0.0, 1.0);
          // Spent gas has mixed. It no longer has a hot axis and a cool skin —
          // it is all roughly one temperature, simply dimming. Flattening the
          // radial profile with age is also what keeps the thin tail from
          // rendering as a stack of nested rings: that is where the radial
          // gradient is steepest, so that is where equal steps of temperature
          // are packed closest together and the high radiance exponent turns
          // them into visible bands.
          interior = mix(interior, 0.55, age * age * 0.65);
          // ...and behind the head it has also had time to radiate away.
          float cool = mix(uTailHeat, 1.0, pow(u, 0.55));
          heat = clamp(pow(interior, max(uHeatFalloff, 0.05)) * cool, 0.0, 1.0);

          // Cool gas close to the burning core is bathed in its light.
          bath = exp(-max(q - 0.5, 0.0) * uScatterFalloff) * (1.0 - heat);

          return d * uDensity;
        }

        void main() {
          vec3 ro = cameraPosition;
          vec3 rd = normalize(vWorld - ro);

          // The hull is a camera-facing strip through the axis, so every pixel
          // gets exactly one fragment and that fragment has to march the whole
          // volume along its ray. Bounding it with a sphere is what the obvious
          // implementation does, and it is ruinous here: the flame is stretched
          // two-and-a-half times taller than it is wide, so a sphere big enough
          // to hold it is two-and-a-half times too long in the direction almost
          // every ray actually travels — the fixed step budget gets spread over
          // a slab that is mostly empty and the volume samples at a fraction of
          // the resolution it should.
          //
          // Bounding with the *ellipsoid* the volume actually occupies instead
          // costs one extra dot product and buys back that factor directly as
          // step density. Solve it as a unit sphere in the squashed frame.
          float reach = REACH_HI * (1.0 + uBulge);
          vec3 up = vec3(0.0, 1.0, 0.0) - vTangent * vTangent.y;
          float upLen = length(up);
          up = upLen > 1e-3 ? up / upLen : vec3(1.0, 0.0, 0.0);
          vec3 side = cross(vTangent, up);

          float rPerp = max(vRadius * reach, uRadius * 0.2);
          float rUp   = rPerp * max(uPlume, 1.0);
          float rDown = rPerp * (1.0 + (max(uPlume, 1.0) - 1.0) * 0.25);
          // The plume only stretches upward, so the bound is an ellipsoid lifted
          // off the axis rather than centred on it.
          float rVert = (rUp + rDown) * 0.5;
          vec3 origin = vCenter + up * (rUp - rDown) * 0.5;
          // Looking down the barrel of the stream, a ray stays inside the volume
          // for its whole length; broadside, it is through in one diameter.
          float axial = abs(dot(rd, vTangent));
          float rLong = mix(rPerp, max(uStreamLength * 0.6, rPerp), axial * axial);

          vec3 o = ro - origin;
          vec3 eo = vec3(dot(o, side) / rPerp, dot(o, up) / rVert, dot(o, vTangent) / rLong);
          vec3 ed = vec3(dot(rd, side) / rPerp, dot(rd, up) / rVert, dot(rd, vTangent) / rLong);
          float ea = dot(ed, ed);
          float eb = dot(eo, ed);
          float ec = dot(eo, eo) - 1.0;
          float disc = eb * eb - ea * ec;
          if (disc <= 0.0) discard;
          float esq = sqrt(disc);
          float maxRadius = rPerp;
          float t0 = max((-eb - esq) / ea, 0.02);
          float t1 = (-eb + esq) / ea;

          // Clip the march on the opaque scene: correct occlusion by the ground
          // and the character, for free.
          float dzdt = (viewMatrix * vec4(rd, 0.0)).z;
          float packed = unpackRGBAToDepth(texture2D(uSceneDepth, gl_FragCoord.xy / uResolution));
          float sceneViewZ = perspectiveDepthToViewZ(packed, uCameraNear, uCameraFar);
          float tScene = dzdt < -1e-5 ? sceneViewZ / dzdt : 1e6;
          t1 = min(t1, tScene);
          if (t1 <= t0) discard;

          float steps = clamp(uSteps, 6.0, 72.0);
          float baseStep = (t1 - t0) / steps;
          // Dither the entry point: a fixed start turns the slices into visible
          // onion rings, a per-pixel offset turns them into grain the bloom eats.
          float t = t0 + baseStep * hash13(vec3(gl_FragCoord.xy, fract(uTime) * 64.0));

          // One flicker value for the whole ray — the flame brightens and dims
          // as a body, not per sample. Two rates: a slow roll from the bulk of
          // the gas, a fast tremor from the burn itself.
          // Amplitude deliberately modest and clamped. This multiplies the whole
          // ray, so a swing wide enough to look dramatic on paper reads on screen
          // as the fireball guttering out for a frame at a time.
          float flickN = vnoise(vec3(uTime * 5.3, uSeed, 0.0)) * 0.7
                       + vnoise(vec3(uTime * 13.1, uSeed * 2.0, 5.0)) * 0.3;
          float flick = clamp(1.0 + uFlicker * 0.6 * (flickN * 2.0 - 1.0), 0.4, 1.7);

          vec3 acc = vec3(0.0);
          float transmittance = 1.0;
          // The hull has to be wide enough for the noise to push the volume out
          // to its full reach, which leaves most rays crossing a lot of empty
          // space. Coasting through it at a coarser stride — and dropping back
          // to the fine one the moment anything is hit — buys back the cost of
          // that headroom without thinning the samples where they matter.
          float stride = 1.0;

          for (int i = 0; i < 72; i++) {
            if (t >= t1 || transmittance < 0.012) break;

            float heat, bath;
            float d = flameSample(ro + rd * t, heat, bath);
            float stepSize = baseStep * stride;

            if (d > 0.002) {
              stride = 1.0;
              stepSize = baseStep;
              // Soften the contact with whatever the march ran into.
              d *= clamp((tScene - t) / max(maxRadius * 0.6, 1e-3), 0.0, 1.0);

              float kelvin = mix(uTempEdge, uTempCore, heat);
              // The palette blend keeps the editor's four colour stops meaningful
              // without letting them fight the physics: at 0 the flame is a pure
              // radiator, at 1 it is the hand-authored ramp.
              vec3 artistic = gradient4(uColorCore, uColorMid, uColorEdge, uColorSmoke,
                                        pow(1.0 - heat, 0.85));
              vec3 tint = mix(blackbody(kelvin), artistic, clamp(uPalette, 0.0, 1.0));

              // Stefan-Boltzmann. This single exponent is what gives the volume
              // its enormous internal dynamic range: a white-hot core forty times
              // brighter than the red gas two centimetres outside it.
              float power = pow(kelvin / max(uTempCore, 1.0), uEmissionCurve);
              vec3 emission = tint * power;

              // Single scatter: the sooty gas wrapped around the burn does not
              // radiate on its own, it reflects. Without this term the fringe
              // and the smoky underside collapse to flat black and the flame
              // loses the halo that sits between it and the smoke.
              emission += mix(uColorEdge, uColorMid, bath) * uScatter * bath * bath * 0.06;

              acc += emission * uEmission * flick * d * transmittance * stepSize;

              // Soot extinction: the cool fringe blocks the background hard, and
              // even the hot gas keeps enough of it to occlude its own far side,
              // which is what leaves visible structure in the fireball instead
              // of one integrated white disc.
              // Squared, so only the genuinely white-hot gas turns clear. Fading
              // the soot away linearly with temperature thins the merely warm
              // gas on the near face too, and that gas is exactly what draws the
              // dark filaments across a real fireball's bright interior.
              transmittance *= exp(-d * uSoot * mix(1.0, uCoreClarity, heat * heat) * stepSize);
            } else {
              stride = min(stride * 1.6, 2.2);
            }

            t += stepSize;
          }

          float alpha = clamp((1.0 - transmittance) * uOpacity, 0.0, 1.0);
          vec3 color = acc * uOpacity * uGlobalGlow * mix(0.65, 1.0, uShaderIntensity);
          if (alpha < 0.002 && max(color.r, max(color.g, color.b)) < 0.002) discard;

          gl_FragColor = vec4(color, alpha);
        }
      `
      )
    });
  }
  /** Pull live editor values (called once per frame by the ability). */
  sync() {
    const c = settings.fire;
    const g = settings.global;
    const u = this.uniforms;
    u.uRadius.value = c.flameWidth;
    u.uHeadSize.value = c.headSize;
    u.uPlume.value = c.flameHeight;
    u.uWakeSpread.value = c.wakeSpread;
    u.uDetachment.value = c.detachment;
    u.uSoftness.value = c.softness;
    u.uShred.value = c.shred;
    u.uBulge.value = c.bulge;
    u.uBulgeScale.value = c.bulgeScale;
    u.uFlow.value = c.flameSpeed * g.noiseSpeed;
    u.uBuoyancy.value = c.buoyancy * g.noiseSpeed;
    u.uSwirl.value = c.flameCurl * g.turbulence;
    u.uSwirlSpeed.value = c.flameSpeed * 0.35 * g.noiseSpeed;
    u.uVortex.value = c.vortex * g.turbulence;
    u.uRingFreq.value = c.ringFrequency;
    u.uRingSpeed.value = c.ringSpeed * g.noiseSpeed;
    u.uNoiseFrequency.value = c.noiseFrequency * g.noiseFrequency;
    u.uNoiseStrength.value = 0.28 * c.flameTurbulence * c.noiseStrength * g.turbulence * g.noiseStrength;
    u.uWarp.value = c.flameWarp * g.turbulence;
    u.uTongue.value = c.tongueStretch;
    u.uStreamStretch.value = c.streamStretch;
    u.uWisp.value = c.wisps;
    u.uFlicker.value = c.flicker;
    u.uLick.value = c.lick;
    u.uOctaves.value = c.detailOctaves;
    u.uTempCore.value = c.tempCore;
    u.uTempEdge.value = c.tempEdge;
    u.uEmissionCurve.value = c.emissionCurve;
    u.uHeatFocus.value = c.heatFocus;
    u.uHeatFalloff.value = c.heatFalloff;
    u.uHeatFollow.value = c.heatFollow;
    u.uTailHeat.value = c.tailHeat;
    u.uPalette.value = c.paletteBlend;
    u.uScatter.value = c.scatter;
    u.uScatterFalloff.value = c.scatterFalloff;
    u.uDensity.value = c.volumeDensity;
    u.uSoot.value = c.soot;
    u.uCoreClarity.value = c.coreClarity;
    u.uEmission.value = c.glow * 2.4;
    u.uOpacity.value = c.opacity * g.opacity;
    u.uSteps.value = c.volumeSteps;
    u.uColorCore.value.copy(getColor(c.colorCore));
    u.uColorMid.value.copy(getColor(c.colorMid));
    u.uColorEdge.value.copy(getColor(c.colorEdge));
    u.uColorSmoke.value.copy(getColor(c.colorSmoke));
  }
};

var DistortionMaterial = class extends ShaderMaterial9 {
  constructor({ upright = false, stream = false, frequency = 2.2, speed = 1.4, strength = 1 } = {}) {
    super({
      transparent: true,
      depthWrite: false,
      depthTest: false,
      blending: NormalBlending3,
      side: DoubleSide6,
      toneMapped: false,
      uniforms: sharedUniforms({
        uStrength: { value: strength },
        uFrequency: { value: frequency },
        uSpeed: { value: speed },
        uHeight: { value: 1 },
        uFalloff: { value: 1 },
        uSeed: { value: Math.random() * 10 },
        uRise: { value: 1 }
        // heat rises: scroll the noise upward
      }),
      defines: {
        ...upright ? { UPRIGHT: "" } : {},
        ...stream ? { STREAM: "" } : {}
      },
      vertexShader: (
        /* glsl */
        `
        uniform float uHeight;
        varying vec2 vUv;
        varying vec3 vWorld;

        void main() {
          vUv = uv;
          vec3 pos = position;
          #ifdef UPRIGHT
            pos.y += uv.y * (uHeight - 1.0);
          #endif
          vec4 world = modelMatrix * vec4(pos, 1.0);
          vWorld = world.xyz;
          gl_Position = projectionMatrix * viewMatrix * world;
        }
      `
      ),
      fragmentShader: (
        /* glsl */
        `
        uniform float uTime;
        uniform float uStrength;
        uniform float uFrequency;
        uniform float uSpeed;
        uniform float uFalloff;
        uniform float uSeed;
        uniform float uRise;
        uniform float uShaderIntensity;

        varying vec2 vUv;
        varying vec3 vWorld;

        ${noiseGLSL}

        void main() {
          vec3 np = vec3(vWorld.xz * uFrequency, vWorld.y * uFrequency * 0.6 - uTime * uSpeed * uRise + uSeed);
          float nx = snoise(np);
          float ny = snoise(np + vec3(19.3, 7.7, 31.1));

          // Fade at the silhouette so the warp never shows a hard border.
          vec2 c = (vUv - 0.5) * 2.0;
          float mask = 1.0 - smoothstep(0.35, 1.0, length(vec2(c.x, c.y * uFalloff)));
          #ifdef UPRIGHT
            mask = (1.0 - smoothstep(0.25, 1.0, vUv.y)) * smoothstep(0.0, 0.12, vUv.x);
          #endif
          #ifdef STREAM
            // Long camera-facing strip: feather across it, fade out at the tail
            // only — the head keeps its full shimmer.
            mask = (1.0 - smoothstep(0.35, 1.0, abs(c.y))) * smoothstep(0.0, 0.18, vUv.x);
          #endif

          float strength = uStrength * uShaderIntensity * mask;
          if (strength < 0.002) discard;

          gl_FragColor = vec4(vec2(nx, ny) * 0.5 + 0.5, strength, mask);
        }
      `
      )
    });
  }
};

          // thin it loses to surface tension and tears into strands, sheets with

          //

          float torn = thin * uShred * smoothstep(0.34, 0.62, 1.0 - shred);

function createRockMaterial(environment, mossAmount = 1) {
  const material = new MeshStandardMaterial3({
    color: 16777215,
    roughness: 0.92,
    metalness: 0.02,
    flatShading: true
  });
  const uniforms = {
    uColorRock: { value: getColor(settings.earth.colorRock).clone() },
    uColorDark: { value: getColor(settings.earth.colorRockDark).clone() },
    uColorMoss: { value: getColor(settings.earth.colorMoss).clone() },
    uGlowColor: { value: new Color16(1, 0.45, 0.12) },
    uGlow: { value: 0 },
    // Ground plates lie flat, so the upward-facing moss term would otherwise
    // cover every one of them completely.
    uMoss: { value: mossAmount }
  };
  environment.registerShadowCasterWithPatch(material, (shader) => {
    Object.assign(shader.uniforms, uniforms);
    shader.vertexShader = shader.vertexShader.replace(
      "#include <common>",
      `#include <common>
         varying vec3 vRockWorld;
         varying vec3 vRockLocal;`
    ).replace(
      "#include <begin_vertex>",
      `#include <begin_vertex>
         vRockLocal = transformed;
         #ifdef USE_INSTANCING
           vRockWorld = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
         #else
           vRockWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;
         #endif`
    );
    shader.fragmentShader = shader.fragmentShader.replace(
      "#include <common>",
      `#include <common>
         uniform vec3 uColorRock;
         uniform vec3 uColorDark;
         uniform vec3 uColorMoss;
         uniform vec3 uGlowColor;
         uniform float uGlow;
         uniform float uMoss;
         varying vec3 vRockWorld;
         varying vec3 vRockLocal;
         ${noiseGLSL}`
    ).replace(
      "#include <emissivemap_fragment>",
      `#include <emissivemap_fragment>
         {
           // Strata and grain.
           float strata = snoise01(vRockLocal * vec3(2.0, 9.0, 2.0));
           float grain = fbm3(vRockWorld * 5.5) * 0.5 + 0.5;
           vec3 rock = mix(uColorDark, uColorRock, strata * 0.6 + grain * 0.5);

           // Moss clings to upward-facing surfaces.
           vec3 upView = normalize((viewMatrix * vec4(0.0, 1.0, 0.0, 0.0)).xyz);
           float upness = clamp(dot(normalize(normal), upView), 0.0, 1.0);
           float moss = smoothstep(0.55, 0.95, upness) * smoothstep(0.35, 0.7, grain);
           rock = mix(rock, uColorMoss, moss * 0.65 * uMoss);

           // A thin seam of heat where the rock was torn out of the ground.
           // Keep the threshold tight: a wide band turns the boulders into
           // glowing tiger stripes.
           float crack = smoothstep(0.90, 0.99, 1.0 - abs(strata - 0.5) * 2.0);
           diffuseColor.rgb *= rock;
           totalEmissiveRadiance += uGlowColor * crack * uGlow;
         }`
    );
  });
  material.userData.uniforms = uniforms;
  material.userData.sync = (glow = 0) => {
    uniforms.uColorRock.value.copy(getColor(settings.earth.colorRock));
    uniforms.uColorDark.value.copy(getColor(settings.earth.colorRockDark));
    uniforms.uColorMoss.value.copy(getColor(settings.earth.colorMoss));
    uniforms.uGlowColor.value.copy(getColor(settings.earth.lightColor));
    uniforms.uGlow.value = glow * settings.earth.glow * settings.global.glow;
  };
  return material;
}

function valueNoise3(x2, y, z, seed) {

  const x10 = lerp2(corner(0, 1, 0), corner(1, 1, 0), u);
  const x01 = lerp2(corner(0, 0, 1), corner(1, 0, 1), u);
  const x11 = lerp2(corner(0, 1, 1), corner(1, 1, 1), u);

    this.distortionPass = new ShaderPass(DistortionShader);

    this.composer.addPass(this.distortionPass);

      new Vector27(size.x, size.y),
      settings.post.bloomStrength,
      settings.post.bloomRadius,
      settings.post.bloomThreshold

    gl.getClearColor(this._clearColor);
    const previousAlpha = gl.getClearAlpha();
    scene.background = null;
    scene.overrideMaterial = this.depthMaterial;
    camera.layers.set(LAYER.WORLD);
    gl.setRenderTarget(this.depthTarget);
    gl.setClearColor(16777215, 1);
    gl.clear();

    scene.overrideMaterial = previousOverride;
    camera.layers.mask = mask;
    gl.setClearColor(this._clearColor, previousAlpha);

    const camera = this.camera;
    const previousBackground = scene.background;
    const mask = camera.layers.mask;
    gl.getClearColor(this._clearColor);
    const previousAlpha = gl.getClearAlpha();
    scene.background = null;
    camera.layers.set(LAYER.DISTORTION);
    gl.setRenderTarget(this.distortionTarget);
    gl.setClearColor(DISTORTION_CLEAR, 0);
    gl.clear();

  sync(elapsed, flash) {

    this.bloomPass.radius = post.bloomRadius;
    this.bloomPass.threshold = post.bloomThreshold;

    u.uSaturation.value = post.enabled ? post.saturation : 1;
    u.uTemperature.value = post.enabled ? post.temperature : 0;
    u.uLift.value = post.lift;
    u.uGain.value = post.gain;

    u.uFlashStrength.value = flash.strength;

  render() {

  setSize(width, height, pixelRatio) {

    this.bloomPass.setSize(width, height);
    const w = Math.floor(width * pixelRatio);
    const h = Math.floor(height * pixelRatio);
    this.depthTarget.setSize(Math.max(2, Math.floor(w / 2)), Math.max(2, Math.floor(h / 2)));
    this.distortionTarget.setSize(Math.max(2, Math.floor(w / 2)), Math.max(2, Math.floor(h / 2)));
    frame.uResolution.value.set(w, h);
  }
  dispose() {
    this.depthTarget.dispose();
    this.distortionTarget.dispose();
    this.depthMaterial.dispose();
    this.composer.dispose();
  }
};

var STORAGE_KEY = "bending-sandbox.presets.v1";
var LAST_KEY = "bending-sandbox.lastPreset";
var PresetManager = class {
  constructor() {
    this.presets = this._read();
  }
  _read() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (error) {
      console.warn("[PresetManager] could not read presets", error);
      return {};
    }
  }
  _write() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.presets));
    } catch (error) {
      console.warn("[PresetManager] could not persist presets", error);
    }
  }
  get names() {
    return Object.keys(this.presets).sort();
  }
  has(name) {
    return Object.prototype.hasOwnProperty.call(this.presets, name);
  }
  save(name) {
    if (!name) return false;
    this.presets[name] = snapshotSettings();
    this._write();
    localStorage.setItem(LAST_KEY, name);
    return true;
  }
  load(name) {
    const preset = this.presets[name];
    if (!preset) return false;
    applySettings(preset);
    localStorage.setItem(LAST_KEY, name);
    return true;
  }
  duplicate(name) {
    if (!this.has(name)) return null;
    let copy = `${name} 副本`;
    let index = 2;
    while (this.has(copy)) copy = `${name} 副本 ${index++}`;
    this.presets[copy] = structuredClone(this.presets[name]);
    this._write();
    return copy;
  }
  remove(name) {
    if (!this.has(name)) return false;
    delete this.presets[name];
    this._write();
    return true;
  }
  reset() {
    applySettings(structuredClone(DEFAULT_SETTINGS));
  }
  /** Trigger a download of the current settings (or a named preset). */
  exportJSON(name = null) {
    const data = name && this.has(name) ? this.presets[name] : snapshotSettings();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = `${(name ?? "bending-settings").replace(/\s+/g, "-").toLowerCase()}.json`;
    anchor.click();
    URL.revokeObjectURL(url);
  }
  /** Export every stored preset in one file. */
  exportAll() {
    const blob = new Blob([JSON.stringify(this.presets, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = "bending-presets.json";
    anchor.click();
    URL.revokeObjectURL(url);
  }
  /**
   * Import from a JSON file chosen by the user.
   * Accepts either a single settings snapshot or a map of presets.
   * @returns {Promise<{ imported: string[], applied: boolean }>}
   */
  importFromFile() {
    return new Promise((resolve) => {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "application/json,.json";
      input.onchange = async () => {
        const file = input.files?.[0];
        if (!file) return resolve({ imported: [], applied: false });
        try {
          const data = JSON.parse(await file.text());
          if (data && data.global && data.fire) {
            applySettings(data);
            resolve({ imported: [], applied: true });
          } else {
            const names = [];
            for (const [name, preset] of Object.entries(data)) {
              if (preset && typeof preset === "object") {
                this.presets[name] = preset;
                names.push(name);
              }
            }
            this._write();
            resolve({ imported: names, applied: false });
          }
        } catch (error) {
          console.error("[PresetManager] import failed", error);
          resolve({ imported: [], applied: false });
        }
      };
      input.click();
    });
  }
  /** Current live settings, for callers that want to inspect them. */
  get current() {
    return settings;
  }
};

// src/core/App.js
var HDR_URL = "https://cdn.jsdelivr.net/gh/achrefelouafi/AvatarCastingAbilitiesThreeJS@main/public/hdri/spruit_sunrise.hdr";
var App = class {
  constructor(canvas2) {
    this.canvas = canvas2;
    this.time = new Time();
    this.elapsed = 0;
    this.paused = false;
    this._raf = 0;
    this.renderer = new Renderer(canvas2);
    this.rig = new CameraRig(canvas2);
    this.camera = this.rig.camera;
    this.environment = new Environment(this.renderer, this.camera);
    this.scene = this.environment.scene;
    this.ground = new Ground(this.environment);
    this.dust = new DustMotes();
    this.contactShadows = new ContactShadows(this.renderer, { size: 2.6, height: 2.4, blur: 2 });
    this.scene.add(this.ground.mesh, this.dust.points, this.contactShadows.group);
    this.dust.setPixelRatio(this.renderer.gl.getPixelRatio());
    this.particles = new ParticleEngine(this.scene);
    this.lights = new LightPool(this.scene);
    this.decals = new DecalSystem(this.scene);
    this.bursts = new BurstSystem(this.scene);
    this.shake = new CameraShake(this.rig);
    this.flash = new ScreenFlash();
    this.abilities = new AbilityManager({
      scene: this.scene,
      camera: this.camera,
      environment: this.environment,
      particles: this.particles,
      lights: this.lights,
      decals: this.decals,
      bursts: this.bursts,
      shake: this.shake,
      flash: this.flash
    });
    this.character = new CharacterController(this.environment);
    this.scene.add(this.character.root);
    this.walk = new WalkController(this.character, {
      scene: this.scene,
      particles: this.particles,
      lights: this.lights,
      decals: this.decals,
      bursts: this.bursts,
      shake: this.shake
    });
    this.input = new InputManager(canvas2);
    this.pathDrawer = new PathDrawer(this.camera);
    this.scene.add(this.pathDrawer.object3D);
    this.post = new PostProcessing(this.renderer, this.scene, this.camera);
    this.loading = new LoadingScreen();
    this.hud = new HUD(document.getElementById("hud"));
    this.editor = new Editor({
      onClear: () => this.clearEffects(),
      onToast: (message) => this.hud.showToast(message)
    });
    this._bindEvents();
    this._mode = null;
    this.setMode(settings.mode);
    this.selectElement(ELEMENTS[0]);
    this._focusPoint = new Vector325();
  }
  /* ------------------------------------------------------------------ */
  _bindEvents() {
    this.renderer.onResize((width, height, pixelRatio) => {
      this.rig.resize(width, height);
      this.post.setSize(width, height, pixelRatio);
      this.dust.setPixelRatio(pixelRatio);
    });
    this.input.on("draw:start", (pointer) => this.pathDrawer.begin(pointer));
    this.input.on("draw:move", (pointer) => this.pathDrawer.move(pointer));
    this.input.on("draw:end", () => this.pathDrawer.end());
    this.input.on("element", (index) => this.selectElement(ELEMENTS[index]));
    this.input.on("action", (action) => this._handleAction(action));
    this.pathDrawer.on("cast", (curve) => {
      if (settings.mode === "walk") {
        if (!this.walk.begin(curve)) this.hud.showToast("路径太短，无法骑乘");
      } else {
        this.abilities.cast(curve);
      }
    });
    this.hud.onSelect = (element) => this.selectElement(element);
    this.hud.onMode = (mode) => this.setMode(mode);
  }
  _handleAction(action) {
    const index = ELEMENTS.indexOf(this.abilities.selected);
    switch (action) {
      case "nextElement":
        this.selectElement(ELEMENTS[(index + 1) % ELEMENTS.length]);
        break;
      case "prevElement":
        this.selectElement(ELEMENTS[(index - 1 + ELEMENTS.length) % ELEMENTS.length]);
        break;
      case "toggleHelp":
        this.hud.toggleHelp();
        break;
      case "toggleEditor":
        this.editor.toggle();
        break;
      case "clear":
        this.clearEffects();
        this.hud.showToast("特效已清除");
        break;
      case "togglePause":
        this.paused = !this.paused;
        this.hud.showToast(this.paused ? "已暂停" : "已继续");
        break;
      case "togglePose": {
        const pose = this.character.togglePose();
        this.editor.refresh();
        this.hud.showToast(pose === "sitting" ? "打坐姿态" : "站立待机");
        break;
      }
      case "toggleMode":
        this.setMode(MODES[(MODES.indexOf(settings.mode) + 1) % MODES.length]);
        break;
      default:
        break;
    }
  }
  selectElement(element) {
    if (!element) return;
    this.abilities.select(element);
    this.hud.setElement(element);
  }
  /**
   * Switch between casting and walking.
   *
   * `settings.mode` is the source of truth — the editor writes it directly and
   * the frame loop notices — so this is also the sync point for presets and
   * "reset to defaults".
   */
  setMode(mode) {
    const next = MODES.includes(mode) ? mode : MODES[0];
    const changed = this._mode !== next;
    this._mode = next;
    settings.mode = next;
    if (next !== "walk") this.walk.cancel();
    this.hud.setMode(next);
    if (changed) this.hud.showToast(`${MODE_META[next].hint} — ${MODE_META[next].blurb}`);
    this.editor.refresh();
  }
  clearEffects() {
    this.walk.cancel();
    this.abilities.clear();
    this.particles.reset();
    this.decals.clear();
    this.bursts.clear();
    this.lights.reset();
    this.shake.reset();
    this.flash.reset();
    this.pathDrawer.trail.hide();
  }
  /* ------------------------------------------------------------------ */
  /** Load assets, warm the shader cache, then start the loop. */
  async load() {
    const assets = new AssetLoader();
    this.loading.setProgress(0.05, "正在加载环境…");
    const hdr = await assets.loadHDR(HDR_URL);
    await this.environment.loadEnvironment(hdr);
    frame.uEnvMap.value = this.environment.equirect;
    this.loading.setProgress(0.5, "正在加载角色…");
    await this.character.load(assets);
    this.loading.setProgress(0.85, "正在编译着色器…");
    await this.renderer.gl.compileAsync(this.scene, this.camera);
    this.loading.setProgress(1, "准备就绪");
    this.loading.hide();
    this.start();
  }
  start() {
    this.time.reset();
    const loop = () => {
      this._raf = requestAnimationFrame(loop);
      this.frame();
    };
    this._raf = requestAnimationFrame(loop);
  }
  stop() {
    cancelAnimationFrame(this._raf);
  }
  /* ------------------------------------------------------------------ */
  frame() {
    const gl = this.renderer.gl;
    gl.info.reset();
    const raw = this.time.tick();
    const dt = this.paused ? 0 : raw * settings.global.timeScale;
    this.elapsed += dt;
    frame.uTime.value = this.elapsed;
    frame.uDelta.value = dt;
    frame.uShaderIntensity.value = settings.global.shaderIntensity;
    frame.uGlobalGlow.value = settings.global.glow;
    frame.uCameraNear.value = this.camera.near;
    frame.uCameraFar.value = this.camera.far;
    this.renderer.syncSettings();
    if (settings.mode !== this._mode) this.setMode(settings.mode);
    this.environment.setFocus(this.character.position.x, this.character.position.z);
    this.environment.update();
    this.walk.update(dt);
    this.character.update(dt);
    this.ground.update(this.elapsed);
    this.dust.update(this.elapsed, this.character.position);
    this.pathDrawer.update(raw);
    this.abilities.update(dt);
    this.particles.flush();
    this.decals.update(dt);
    this.bursts.update(dt);
    this.lights.update(dt);
    const focus = this.abilities.focus;
    if (focus) this.rig.lookAt(focus.position, MathUtils9.clamp(1 - focus.u * 0.4, 0, 1));
    this.rig.setAnchor(this.character.position.x, 0, this.character.position.z);
    this.shake.update(raw);
    this.flash.update(raw);
    this.rig.update(raw);
    this.contactShadows.setPosition(this.character.position.x, this.character.position.z);
    this.contactShadows.render(this.scene);
    gl.shadowMap.needsUpdate = true;
    this.post.sync(this.elapsed, this.flash);
    this.post.render();
    this.hud.update(raw, () => ({
      particles: this.particles.countLive(this.elapsed),
      calls: gl.info.render.calls,
      abilities: this.abilities.active.length
    }));
  }
  /* ------------------------------------------------------------------ */
  dispose() {
    this.stop();
    this.input.dispose();
    this.pathDrawer.dispose();
    this.abilities.dispose();
    this.particles.dispose();
    this.decals.dispose();
    this.bursts.dispose();
    this.lights.dispose();
    this.walk.dispose();
    this.character.dispose();
    this.ground.dispose();
    this.dust.dispose();
    this.contactShadows.dispose();
    this.post.dispose();
    this.environment.dispose();
    this.editor.dispose();
    this.rig.dispose();
    this.renderer.dispose();
  }
};

// src/main.js
var canvas = document.getElementById("viewport");
async function boot() {
  try {
    const app = new App(canvas);
    await app.load();
    window.app = app;
  } catch (error) {
    console.error("[boot] failed to start", error);
    new LoadingScreen().fail(
      error?.message ? `启动失败：${error.message}` : "启动失败，请查看控制台。"
    );
  }
}
boot();

  window.THREE = THREE;
